        in: header
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Verwerfen"
        required: true
      responses:
        "204":
          description: Verworfen
        "412":
          description: If-Match passt nicht zur aktuellen Version (VERSION_KONFLIKT)
        "428":
          description: If-Match fehlt (VERSION_FEHLT)
        "401":
          description: Not Authorized
        "403":
          description: Not Allowed
        "400":
          description: Bad Request
      security:
      - SecurityScheme:
        - inhaber
        - mitarbeiter
        - treuhaender
        - geschaeftsstelle
  /api/v1/dokumente/{id}/vorschau:
    get:
      summary: Vorschaubild einer Seite lesen
      description: "PNG der Seite (ab 1, Standard 1). Unsichtbares oder fremdes Dokument,\
        \ Seite über der Seitenzahl oder noch ohne Vorschau → 404 NICHT_GEFUNDEN;\
        \ Seite unter 1 oder keine Zahl → 400."
