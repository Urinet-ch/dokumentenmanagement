        "400":
          description: ANFRAGE_UNGUELTIG
        "403":
          description: "NICHT_ERLAUBT: ohne Recht A12"
        "404":
          description: "NICHT_GEFUNDEN: Quelle unbekannt"
        "409":
          description: STATUS_KONFLIKT
        "412":
          description: VERSION_KONFLIKT
        "428":
          description: VERSION_FEHLT
        "401":
          description: Not Authorized
