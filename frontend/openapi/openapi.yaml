  /api/v1/kontakte/{kontaktId}/zusammenfuehren:
    post:
      summary: Kontakt in einen anderen zusammenführen (Req 17.7–17.10)
      description: "Eine Transaktion: Dokumente (neue Version, bei archivierten eine\
        \ Fassung in dokument_version), Partner des KI-Vorschlags, Verkaufschancen\
        \ und Korrekturbeispiele wandern zum Ziel, die Quelle wird inaktiv mit Verweis\
        \ auf das Ziel; Protokoll KONTAKT_ZUSAMMENFUEHREN. Nicht umkehrbar. If-Match\
        \ der Quelle: fehlt → 428, nur ein starkes ETag passt, sonst oder veraltet\
        \ → 412. Körper ungültig, Ziel gleich Quelle oder unbekannt → 400; Quelle\
        \ unbekannt → 404; Quelle oder Ziel inaktiv, oder eine laufende Übernahme\
        \ hält einen der Kontakte → 409. In allen Fehlerfällen ändert sich nichts."
      tags:
      - Kontakte
      parameters:
      - name: kontaktId
        in: path
        required: true
        schema:
          type: string
      - required: true
        name: If-Match
        in: header
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/KontaktZusammenfuehren"
        required: true
      responses:
        "200":
          description: Zusammengeführt
