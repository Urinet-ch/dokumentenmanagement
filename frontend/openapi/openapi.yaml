  /api/v1/kontakte/liste:
    get:
      summary: "Kontakte auflisten (Req 17.1, 17.2)"
      description: "Mit q: Name enthalten oder ähnlich, Vorname oder Ort enthalten\
        \ (ohne Gross-/Kleinschreibung), E-Mail enthalten, PLZ oder Kontakt-ID aus\
        \ 21.CRM gleich; exakte Kontakt-ID und E-Mail zuerst, dann Ähnlichkeit, dann\
        \ Name. Ohne q nach Name, Vorname. Recht A6 (inhaber, geschaeftsstelle); sonst\
        \ 403 NICHT_ERLAUBT. Ungültige Parameter → 400 ANFRAGE_UNGUELTIG."
      tags:
      - Kontakte
      parameters:
      - description: 1–100
        schema:
          maximum: 100
          minimum: 1
          format: int32
          type: integer
          default: 50
        name: groesse
        in: query
      - schema:
          type: boolean
        name: nichtImExport
        in: query
      - description: "Suchbegriff, 1–200 Zeichen ohne Steuerzeichen"
        name: q
        in: query
        schema:
          type: string
      - schema:
          type: string
          enum:
          - CSV_IMPORT
          - MANUELL
        name: quelle
        in: query
      - description: ab 0
        schema:
          minimum: 0
          format: int32
          type: integer
          default: 0
        name: seite
        in: query
      - description: Standard AKTIV
        schema:
          type: string
          enum:
          - AKTIV
          - INAKTIV
          - ALLE
        name: status
        in: query
      responses:
        "200":
          description: Eine Seite
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KontaktListe"
        "400":
          description: "ANFRAGE_UNGUELTIG: q, status, quelle, nichtImExport, seite\
            \ oder groesse ungültig"
        "403":
          description: "NICHT_ERLAUBT: ohne Recht A6"
        "401":
          description: Not Authorized
      security:
      - SecurityScheme:
        - inhaber
        - geschaeftsstelle
