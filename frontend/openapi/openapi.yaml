  /api/v1/chat:
    post:
      summary: Frage an den Chat
      description: "Antwort als Server-Sent Events mit benannten Ereignissen, JSON\
        \ in data: «werkzeug» {name} je Werkzeugaufruf, «text» {delta}, genau ein\
        \ «quellen» [{id, titel, link} | {werkzeug, datenstand, belege} | {wissen:\
        \ {titel, link, stand}, dokumente: [{titel, link, seiten}]}] vor «fertig»\
        \ {gespraechId, nachrichtId, tokens: {ein, aus}}; «fehler» {meldung, gespraechId}\
        \ beendet den Stream ohne «fertig». Vor dem Stream: 400 ANFRAGE_UNGUELTIG,\
        \ 404 NICHT_GEFUNDEN (fremdes oder unbekanntes Gespräch), 429 ZU_VIELE_ANFRAGEN\
        \ mit Retry-After und dem Feld grund der Problem Details (STUNDENLIMIT: mehr\
        \ als 100 Fragen in 60 Minuten; LAEUFT: schon eine laufende Frage, Retry-After\
        \ höchstens 5 s). Nur beschreibend: der generierte Client liest den Stream\
        \ nicht."
      tags:
      - Chat
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatFrage"
        required: true
      responses:
        "200":
          description: Stream der Ereignisse
          content:
            text/event-stream:
              schema:
                type: string
        "429":
          description: Rate-Limit (grund STUNDENLIMIT) oder schon eine laufende Frage
            (grund LAEUFT)
          headers:
            Retry-After:
              description: Sekunden bis zum nächsten Versuch
        "401":
          description: Not Authorized
        "403":
          description: Not Allowed
        "400":
          description: Bad Request
      security:
      - SecurityScheme:
        - inhaber
        - mitarbeiter
        - treuhaender
        - geschaeftsstelle
  /api/v1/chat/auswertung:
    get:
      summary: Chat-Bewertungen auswerten
      description: "Kennzahlen für den Zeitraum sowie höchstens 100 Antworten mit\
        \ höchstens 2 Sternen. Zeitraum maximal 12 Monate, nur Inhaber (A24)."
