          type: string
      responses:
        "204":
          description: Quellenprüfung bestätigt
        "403":
          description: Kein Freigaberecht
        "404":
          description: Seite nicht vorhanden
        "409":
          description: Kein Quellenhinweis vorhanden
        "412":
          description: Seitenstand geändert
        "428":
          description: If-Match fehlt
        "401":
          description: Not Authorized
