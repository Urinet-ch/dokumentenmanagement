          description: Rolle darf keinen Lint starten
        "409":
          description: Ein Lint läuft bereits
        "429":
          description: Monatsbudget der Wissensbasis erschöpft
        "401":
          description: Not Authorized
      tags:
      - Wissen Lint Resource
      security:
      - SecurityScheme:
        - inhaber
        - geschaeftsstelle
  /api/v1/wissensbasis/log:
    get:
      summary: Wissensbasis-Log
      description: Neueste Einträge zuerst; Einträge ohne sichtbare Seite werden ausgelassen.
      tags:
      - Wissensbasis
      parameters:
      - schema:
          type: integer
          default: 50
        name: groesse
        in: query
      - description: Cursor aus dem vorherigen Ergebnis
        name: vor
        in: query
        schema:
          type: string
      responses:
        "200":
          description: Gefilterte Logseite
          content:
            application/json:
              schema: {}
        "400":
          description: Ungültiger Cursor oder Pagingwert
        "401":
          description: Not Authorized
        "403":
          description: Not Allowed
      security:
      - SecurityScheme:
        - inhaber
        - mitarbeiter
        - treuhaender
        - geschaeftsstelle
  /api/v1/wissensentwuerfe:
    get:
      summary: Wissensentwürfe auflisten
      description: A17 sieht alle Entwürfe; A18 nur den Status eigener Analysevorschläge.
      tags:
      - Wissensbasis
      parameters:
      - name: status
        in: query
        schema:
          type: string
      responses:
        "200":
          description: Entwürfe
          content:
            application/json:
              schema: {}
        "403":
          description: Rolle darf keine Entwürfe lesen
        "401":
          description: Not Authorized
      security:
      - SecurityScheme:
        - inhaber
        - mitarbeiter
        - treuhaender
        - geschaeftsstelle
    post:
      summary: Manuellen Wissensentwurf anlegen
      tags:
      - Wissensbasis
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Eingabe"
        required: true
      responses:
        "201":
          description: Entwurf angelegt und geprüft
        "400":
          description: Anfrage ungültig
        "403":
          description: Rolle darf keine Entwürfe anlegen
        "404":
          description: Seite nicht vorhanden oder nicht sichtbar
        "401":
          description: Not Authorized
      security:
      - SecurityScheme:
        - inhaber
        - geschaeftsstelle
  /api/v1/wissensentwuerfe/analyse:
    post:
      summary: Eigene Chat-Antwort als Analyse vorschlagen
      tags:
      - Wissensbasis
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WissenAnalyse"
