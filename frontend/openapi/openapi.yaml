          $ref: "#/components/schemas/UUID"
      - name: nr
        in: path
        required: true
        schema:
          type: integer
          format: int32
      responses:
        "202":
          description: Abschnitt erneut eingereiht
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WissenIngestAuftrag"
        "400":
          description: Abschnittsnummer ungültig
        "403":
          description: Rolle darf den Abschnitt nicht wiederholen
        "404":
          description: Ingest-Entwurf nicht gefunden
        "409":
          description: "Entwurf, Quelle oder Abschnitt ist nicht mehr aktuell"
        "429":
          description: Ingest- oder Monatsbudget reicht nicht aus
        "401":
          description: Not Authorized
      security:
      - SecurityScheme:
        - inhaber
        - geschaeftsstelle
  /api/v1/wissensentwuerfe/{entwurfId}/aenderungen/{nr}/annehmen:
    post:
      summary: Eine Wissensänderung annehmen
