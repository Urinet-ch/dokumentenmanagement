          description: Not Authorized
        "403":
          description: Not Allowed
      security:
      - SecurityScheme:
        - inhaber
  /api/v1/wissensbasis/lint:
    post:
      summary: Lint der Wissensbasis starten
      responses:
        "202":
          description: Lint eingereiht
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WissenLintAuftrag"
