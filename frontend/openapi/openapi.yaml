---
components:
  schemas:
    Abschnittsfehler:
      type: object
      properties:
        nummer:
          type: integer
          format: int32
        seite:
          type: integer
          format: int32
        verworfen:
          type: integer
          format: int32
        behalten:
          type: integer
          format: int32
        antwortUngueltig:
          type: boolean
        maxZeichen:
          type: integer
          format: int32
    Aenderung:
      type: object
      properties:
        id:
          type: integer
          format: int64
        nr:
          type: integer
          format: int32
        aktion:
          type: string
        seiteId:
          $ref: "#/components/schemas/UUID"
        pfad:
          type: string
        basisVersion:
          type: integer
          format: int32
        daten:
          type: object
          additionalProperties: {}
        inhalt:
          type: string
        diff:
          type: object
          additionalProperties: {}
        begruendung:
          type: string
        widersprueche:
          type: array
          items:
            type: object
            additionalProperties: {}
        entfernteAussagen:
          type: array
          items:
            type: object
            additionalProperties: {}
        befunde:
          type: array
          items:
            type: object
            additionalProperties: {}
        hinweise:
          type: array
          items:
            type: object
            additionalProperties: {}
        vertraulichkeitKontext:
          type: string
        status:
          type: string
        entschiedenVon:
          type: string
        entschiedenAm:
          $ref: "#/components/schemas/Instant"
        grund:
          type: string
        ergebnisVersion:
          type: integer
          format: int32
        etag:
          type: integer
          format: int32
    Aktion:
      type: string
      enum:
      - A1
      - A2
      - A3
      - A4
      - A5
      - A6
      - A7
      - A8
      - A9
      - A10
      - A11
      - A12
      - A13
      - A14
      - A15
      - A16
      - A17
      - A18
      - A19
      - A20
      - A21
      - A22
      - A23
      - A24
      - A25
      - A26
      - A27
      - A28
      - A29
    Ansicht:
      type: object
      properties:
        id:
          $ref: "#/components/schemas/UUID"
        art:
          $ref: "#/components/schemas/Art"
        ziel:
          type: string
        rolle:
          $ref: "#/components/schemas/Rolle"
        grund:
          type: string
        beantragtVon:
          type: string
        beantragtAm:
          $ref: "#/components/schemas/Instant"
        gueltigBis:
          $ref: "#/components/schemas/Instant"
    Antwort:
      type: object
      properties:
        geschaeftsjahr:
          type: integer
          format: int32
        kategorien:
          type: array
          items:
            $ref: "#/components/schemas/Kategorie"
        nichtGeprueft:
          type: array
          items:
            type: string
        datenstand:
          $ref: "#/components/schemas/Datenstand"
        hinweis:
          type: string
    Antwort1:
      type: object
      properties:
        entwurfId:
          $ref: "#/components/schemas/UUID"
        status:
          type: string
        anzahl:
          $ref: "#/components/schemas/Anzahl"
        paketSha256:
          type: string
        befunde:
          type: array
          items:
            type: object
            additionalProperties:
              type: string
        hinweise:
          type: array
          items:
            type: object
            additionalProperties:
              type: string
    Anzahl:
      type: object
      properties:
        neu:
          type: integer
          format: int32
        aendern:
          type: integer
          format: int32
        unveraendert:
          type: integer
          format: int32
        ignoriert:
          type: integer
          format: int32
    ApiToken:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        scope:
          type: string
          enum:
          - generator
          - import
          - webseite-lesen
          - webseite-erfassung
        aktiv:
          type: boolean
        erstellt:
          $ref: "#/components/schemas/Instant"
        zuletzt:
          type:
          - string
          - "null"
          anyOf:
          - $ref: "#/components/schemas/Instant"
          - type: "null"
        webseite:
          type:
          - string
          - "null"
        hoechsteStufe:
          type:
          - string
          - "null"
        gueltigBis:
          type:
          - string
          - "null"
          anyOf:
          - $ref: "#/components/schemas/Instant"
          - type: "null"
        absenderPruefen:
          type: boolean
    ApiTokenAblauf:
      type: object
      required:
      - gueltigBis
      properties:
        gueltigBis:
          description: Gültig bis einschliesslich dieses Tages
          type: string
          $ref: "#/components/schemas/LocalDate"
    ApiTokenErstellt:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        scope:
          type: string
          enum:
          - generator
          - import
        erstellt:
          $ref: "#/components/schemas/Instant"
        gueltigBis:
          type:
          - string
          - "null"
          anyOf:
          - $ref: "#/components/schemas/Instant"
          - type: "null"
        token:
          type: string
          description: Das Token `ua_<id>_<geheimnis>`; wird nur dieses eine Mal ausgegeben.
    ApiTokenNeu:
      type: object
      required:
      - name
      - scope
      properties:
        name:
          type: string
          maxLength: 100
          description: "Bezeichnung, z. B. «Rechnungsgenerator»"
        scope:
          type: string
          enum:
          - generator
          - import
        gueltigBis:
          description: Gültig bis einschliesslich dieses Tages
          type:
          - string
          - "null"
          anyOf:
          - $ref: "#/components/schemas/LocalDate"
          - type: "null"
    Art:
      type: string
      enum:
      - INHABER_ROLLE
      - LOESCHEN
    ArtKlassifikation:
      type: object
      properties:
        klassifikation:
          type: string
        pflicht:
          type: boolean
        standardWert:
          type: string
    Aussage:
      type: object
      properties:
        nr:
          type: integer
          format: int32
        schluessel:
          type: string
        text:
          type: string
        seiten:
          type: array
          items:
            type: integer
            format: int32
        auszug:
          type: string
        belegt:
          type: boolean
        zugeordnet:
          type: boolean
    Auswirkung:
      type: object
      properties:
        schluessel:
          type: string
        text:
          type: string
        betroffeneDatensaetze:
          type: integer
          format: int64
    AuszugTeil:
      description: Stück der Textstelle; treffer = hervorgehobener Suchbegriff (Req
        14.4)
      type: object
      required:
      - text
      - treffer
      properties:
        text:
          type: string
        treffer:
          type: boolean
    Bearbeitung:
      type: object
      properties:
        titel:
          type: string
        beschreibung:
          type: string
        tags:
          type: array
          items:
            type: string
        veraltetAb:
          $ref: "#/components/schemas/LocalDate"
        quellen:
          type: array
          items:
            $ref: "#/components/schemas/Quelleneintrag"
        inhalt:
          type: string
        entfernteAussagen:
          type: array
          items:
            $ref: "#/components/schemas/EntfernteAussage"
    Befund:
      type: object
      properties:
        pfad:
          type: string
        code:
          type: string
        meldung:
          type: string
    BenutzerAenderung:
      type: object
      properties:
        email:
          type: string
        vorname:
          type: string
        nachname:
          type: string
    BenutzerAnlage:
      type: object
      properties:
        benutzername:
          type: string
        email:
          type: string
        vorname:
          type: string
        nachname:
          type: string
        rolle:
          type: string
    BenutzerAnlageErgebnis:
      type: object
      properties:
        id:
          $ref: "#/components/schemas/UUID"
        antragId:
          $ref: "#/components/schemas/UUID"
    BenutzerAnsicht:
      type: object
      properties:
        id:
          type: string
        benutzername:
          type: string
        vorname:
          type: string
        nachname:
          type: string
        email:
          type: string
        rollen:
          type: array
          uniqueItems: true
          items:
            $ref: "#/components/schemas/Rolle"
        rollenkonflikt:
          type: boolean
        status:
          $ref: "#/components/schemas/BenutzerStatus"
        totp:
          type: boolean
        google:
          type: boolean
        passkey:
          type: boolean
        passkeyAnzahl:
          type: integer
          format: int32
        voruebergehendGesperrt:
          type: boolean
        einladungOffenSeit:
          $ref: "#/components/schemas/Instant"
        einladungGueltigBis:
          $ref: "#/components/schemas/Instant"
        letzteAktion:
          $ref: "#/components/schemas/LetzteAktion"
        etag:
          type: string
        apiTokenVerwaltungspfad:
          type: string
        apiTokenHinweis:
          type: string
    BenutzerStatus:
      type: string
      enum:
      - EINGELADEN
      - AKTIV
      - GESPERRT
      - DEAKTIVIERT
      - GELOESCHT
    Bestaetigung:
      description: "Bestätigte Metadaten (A7, Req 8.2–8.5, 8.8, 8.9). Ersetzt die\
        \ Grundfelder sowie die Felder der Gruppen finanz und vertrag vollständig;\
        \ fehlende Felder sind leer. Zusatzfelder kommen aus dem gespeicherten Dokument."
      type: object
      required:
      - art
      properties:
        art:
          type: string
          description: Code einer aktiven Dokumentart
        titel:
          type:
          - string
          - "null"
        datum:
          type:
          - string
          - "null"
          anyOf:
          - $ref: "#/components/schemas/LocalDate"
          - type: "null"
        partnerId:
          description: ID eines Kontakts des Mandanten
          type:
          - string
          - "null"
          anyOf:
          - $ref: "#/components/schemas/UUID"
          - type: "null"
        projekt:
          type:
          - string
          - "null"
        tags:
          type:
          - array
          - "null"
          items:
            type: string
        klassifikationen:
          type:
          - object
          - "null"
          additionalProperties:
            type: array
            items:
              type: string
          description: Werte nach Klassifikations-Code
        vertraulichkeit:
          type:
          - string
          - "null"
          description: "Fehlt sie, gilt die Standardvertraulichkeit der Art"
          enum:
          - NORMAL
          - INTERN
          - PERSONAL
        personBenutzer:
          type:
          - string
          - "null"
        geschaeftsjahr:
          type:
          - integer
          - "null"
          format: int32
          description: "Fehlt es, schlägt das Archiv das Geschäftsjahr vor"
        belegnummer:
          type:
          - string
          - "null"
        richtung:
          type:
          - string
          - "null"
          enum:
          - EINNAHME
          - AUSGABE
        betrag:
          type:
          - number
          - "null"
        waehrung:
          type:
          - string
          - "null"
          description: "ISO 4217, Standard CHF"
        faelligkeit:
          type:
          - string
          - "null"
          anyOf:
          - $ref: "#/components/schemas/LocalDate"
          - type: "null"
        qrReferenz:
          type:
          - string
          - "null"
        konto:
          type:
          - string
          - "null"
        gueltigAb:
          type:
          - string
          - "null"
          anyOf:
          - $ref: "#/components/schemas/LocalDate"
          - type: "null"
        gueltigBis:
          type:
          - string
          - "null"
          anyOf:
          - $ref: "#/components/schemas/LocalDate"
          - type: "null"
        kuendigungsfrist:
          type:
          - string
          - "null"
        naechsteFrist:
          type:
          - string
          - "null"
          anyOf:
          - $ref: "#/components/schemas/LocalDate"
          - type: "null"
        ohnePdfa:
          type: boolean
          description: "Ohne PDF/A bestätigen, wenn die PDF/A-Fassung fehlt (Req 5.9)"
        fristAbgelaufenAkzeptiert:
          type: boolean
          description: Ablauf der Aufbewahrungsfrist ausdrücklich bestätigen (Req
            9.8)
    BrandingDto:
      type: object
      properties:
        name:
          type: string
        logoUrl:
          type: string
        primaerfarbe:
          type: string
        sprache:
          type: string
    ChatAuswertung:
      type: object
      properties:
        anzahl:
          type: integer
          format: int64
        durchschnitt:
          type: number
          format: double
        verteilung:
          type: array
          items:
            $ref: "#/components/schemas/SterneDto"
        gruende:
          type: array
          items:
            $ref: "#/components/schemas/GrundDto"
        schlechteAntworten:
          type: array
          items:
            $ref: "#/components/schemas/SchlechteAntwortDto"
    ChatBewertung:
      type: object
      required:
      - nachrichtId
      - sterne
      - erstellt
      - geaendert
      properties:
        nachrichtId:
          type: string
        sterne:
          type: integer
          format: int32
          maximum: 5
          minimum: 1
        grund:
          type:
          - string
          - "null"
          enum:
          - NICHT_BEANTWORTET
          - FALSCH
          - UNVOLLSTAENDIG
          - QUELLE
          - ZU_LANGSAM
          - ANDERES
        freitext:
          type:
          - string
          - "null"
          maxLength: 500
        erstellt:
          type: string
          $ref: "#/components/schemas/Instant"
        geaendert:
          type: string
          $ref: "#/components/schemas/Instant"
    ChatBewertungEingabe:
      type: object
      required:
      - sterne
      properties:
        sterne:
          type: integer
          format: int32
          maximum: 5
          minimum: 1
        grund:
          type:
          - string
          - "null"
        freitext:
          type:
          - string
          - "null"
          maxLength: 500
    ChatBewertungExportEingabe:
      type: object
      properties:
        von:
          type: string
        bis:
          type: string
        minSterne:
          type: integer
          format: int32
        maxSterne:
          type: integer
          format: int32
        schwaerzen:
          type: boolean
        klartextBestaetigt:
          type: boolean
    ChatEinstellungen:
      type: object
      properties:
        aufbewahrungMonate:
          type: integer
          format: int32
    ChatFrage:
      type: object
      required:
      - frage
      properties:
        frage:
          type: string
          maxLength: 2000
          minLength: 1
          description: "Frage, nach Trim 1 bis 2'000 Zeichen"
        gespraechId:
          description: Gespräch fortsetzen; ohne beginnt ein neues
          type:
          - string
          - "null"
          anyOf:
          - $ref: "#/components/schemas/UUID"
          - type: "null"
    ChatGespraech:
      type: object
      required:
      - id
      - titel
      - geaendert
      - modus
      properties:
        id:
          $ref: "#/components/schemas/UUID"
        titel:
          type: string
        geaendert:
          type: string
          $ref: "#/components/schemas/Instant"
        modus:
          type: string
          description: fester Modus des Gesprächs (Archivchat oder Wissenschat)
          enum:
          - ARCHIV
          - WISSEN
    ChatGespraechAnlegen:
      type: object
      properties:
        modus:
          type:
          - string
          - "null"
          description: "Modus des neuen Gesprächs; fehlt er, gilt ARCHIV. WISSEN setzt\
            \ das Recht A15 voraus"
          default: ARCHIV
          enum:
          - ARCHIV
          - WISSEN
    ChatNachricht:
      type: object
      required:
      - id
      - rolle
      - inhalt
      - quellen
      - zeit
      - analyseMoeglich
      properties:
        id:
          type: string
          description: Nachrichten-ID als Dezimalzahl
        rolle:
          type: string
          enum:
          - BENUTZER
          - ASSISTENT
        inhalt:
          type: string
        quellen:
          type: array
          items:
            $ref: "#/components/schemas/ChatQuelle"
        status:
          type:
          - string
          - "null"
          description: nur bei Antworten
          enum:
          - OK
          - FEHLER
          - ABGEBROCHEN
        zeit:
          type: string
          $ref: "#/components/schemas/Instant"
        analyseMoeglich:
          type: boolean
    ChatQuelldokument:
      type: object
      properties:
        titel:
          type: string
        link:
          type: string
        seiten:
          type: string
    ChatQuelle:
      type: object
      description: "Dokument (id, titel, link), Datenstand eines Zahlenwerkzeugs (werkzeug,\
        \ datenstand, belege) oder Wissensseite mit direkten Quelldokumenten (wissen,\
        \ dokumente)"
      properties:
        id:
          anyOf:
          - $ref: "#/components/schemas/UUID"
          - type: "null"
        titel:
          type:
          - string
          - "null"
        link:
          type:
          - string
          - "null"
          description: relativer PWA-Pfad /dokument/<id>
        werkzeug:
          type:
          - string
          - "null"
        datenstand:
          type:
          - string
          - "null"
          anyOf:
          - $ref: "#/components/schemas/Instant"
          - type: "null"
        belege:
          type:
          - integer
          - "null"
          format: int32
        wissen:
          anyOf:
          - $ref: "#/components/schemas/ChatWissensquelle"
          - type: "null"
        dokumente:
          type:
          - array
          - "null"
          items:
            $ref: "#/components/schemas/ChatQuelldokument"
    ChatVerlauf:
      type: object
      required:
      - id
      - titel
      - geaendert
      - modus
      - nachrichten
      properties:
        id:
          $ref: "#/components/schemas/UUID"
        titel:
          type: string
        geaendert:
          type: string
          $ref: "#/components/schemas/Instant"
        modus:
          type: string
          enum:
          - ARCHIV
          - WISSEN
        nachrichten:
          type: array
          items:
            $ref: "#/components/schemas/ChatNachricht"
    ChatWissensquelle:
      type: object
      properties:
        titel:
          type: string
        link:
          type: string
        stand:
          $ref: "#/components/schemas/Instant"
    Datenstand:
      type: object
      properties:
        zeitpunkt:
          type: string
        anzahl:
          type: integer
          format: int64
    DayOfWeek:
      type: string
      enum:
      - MONDAY
      - TUESDAY
      - WEDNESDAY
      - THURSDAY
      - FRIDAY
      - SATURDAY
      - SUNDAY
    DiffEintrag:
      type: object
      properties:
        pfad:
          type: string
        alt:
          type: string
        neu:
          type: string
        betroffeneDokumente:
          type: integer
          format: int64
        werteVerdeckt:
          type: boolean
    Dokument:
      description: Metadaten eines sichtbaren Dokuments
      type: object
      required:
      - id
      - eingang
      - quelle
      - tags
      - vertraulichkeit
      - status
      - fristAbgelaufen
      - version
      - warnungen
      - pdfaFehlt
      - unsicher
      - versionen
      - klassifikationen
      - klassifikationenUngueltig
      properties:
        id:
          $ref: "#/components/schemas/UUID"
        art:
          type:
          - string
          - "null"
          description: "Code der Dokumentart; null, solange nicht erkannt"
        titel:
          type:
          - string
          - "null"
        datum:
          type:
          - string
          - "null"
          anyOf:
          - $ref: "#/components/schemas/LocalDate"
          - type: "null"
        eingang:
          type: string
          $ref: "#/components/schemas/Instant"
        quelle:
          type: string
          enum:
          - SCAN
          - UPLOAD
          - GENERATOR
          - DRIVE
          - EMAIL
          - ABANINJA
          - WEBSEITE
        tags:
          type: array
          items:
            type: string
        vertraulichkeit:
          type: string
          description: Ohne bestätigte Art gilt PERSONAL (Req 2.21)
          enum:
          - NORMAL
          - INTERN
          - PERSONAL
        status:
          type: string
          enum:
          - NEU
          - VERARBEITUNG
          - EINGANGSKORB
          - ARCHIVIERUNG
          - ARCHIVIERUNG_FEHLER
          - ARCHIVIERT
          - FEHLER
          - VERWORFEN
        bestaetigt:
          type:
          - string
          - "null"
          anyOf:
          - $ref: "#/components/schemas/Instant"
          - type: "null"
        geschaeftsjahr:
          type:
          - integer
          - "null"
          format: int32
        aufbewahrenBis:
          type:
          - string
          - "null"
          anyOf:
          - $ref: "#/components/schemas/LocalDate"
          - type: "null"
        sperreBis:
          type:
          - string
          - "null"
          anyOf:
          - $ref: "#/components/schemas/LocalDate"
          - type: "null"
        fristAbgelaufen:
          type: boolean
        zusatz:
          description: Zusatzfelder nach dem Schema der Art
          type:
          - object
          - "null"
          anyOf:
          - $ref: "#/components/schemas/JsonObjekt"
          - type: "null"
        version:
          type: integer
          format: int32
          description: Version für If-Match (auch als ETag)
        warnungen:
          type: array
          items:
            $ref: "#/components/schemas/Warnung"
          description: "Belegnummer-Warnungen im Eingangskorb; fehlender Fristbezug\
            \ auch nach Bestätigung oder Artwechsel (Spec 05, Req 4.4)"
        fehler:
          type:
          - string
          - "null"
          description: Grund des Fehlers bei FEHLER oder ARCHIVIERUNG_FEHLER (Req
            8.7)
        pdfaFehlt:
          type: boolean
          description: PDF/A-Fassung fehlt (Req 5.9)
        seiten:
          type:
          - integer
          - "null"
          format: int32
          description: Seitenzahl; Vorschau je Seite unter /vorschau
        partnerId:
          anyOf:
          - $ref: "#/components/schemas/UUID"
          - type: "null"
        partnerName:
          type:
          - string
          - "null"
        vorschlag:
          description: "Metadaten-Vorschlag der KI; nur im Eingangskorb, sonst null\
            \ (Req 8.1)"
          type:
          - object
          - "null"
          anyOf:
          - $ref: "#/components/schemas/JsonObjekt"
          - type: "null"
        unsicher:
          type: array
          items:
            type: string
