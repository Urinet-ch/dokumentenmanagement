paths:
  /api/v1/api-tokens:
    get:
      summary: API-Tokens des Mandanten auflisten (ohne Geheimnis)
      tags:
      - API-Tokens
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ApiToken"
        "401":
          description: Not Authorized
        "403":
          description: Not Allowed
      security:
      - SecurityScheme:
        - inhaber
    post:
      summary: API-Token anlegen
      description: Das Token steht nur in dieser Antwort.
      tags:
      - API-Tokens
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApiTokenNeu"
        required: true
      responses:
        "201":
          description: Angelegt
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiTokenErstellt"
        "401":
          description: Not Authorized
        "403":
          description: Not Allowed
        "400":
          description: Bad Request
      security:
      - SecurityScheme:
        - inhaber
  /api/v1/api-tokens/{tokenId}:
    delete:
      summary: API-Token widerrufen
      description: Wirkt sofort; fremde oder unbekannte IDs → 404.
      tags:
      - API-Tokens
      parameters:
      - description: ID des API-Tokens
        name: tokenId
        in: path
        required: true
        schema:
          type: string
      responses:
        "204":
          description: Widerrufen
        "401":
          description: Not Authorized
        "403":
          description: Not Allowed
      security:
      - SecurityScheme:
        - inhaber
  /api/v1/api-tokens/{tokenId}/gueltig-bis:
    put:
      summary: Ablaufdatum eines API-Tokens setzen
      tags:
      - API-Tokens
      parameters:
      - description: ID des API-Tokens
        name: tokenId
        in: path
        required: true
        schema:
          type: string
      requestBody:
        description: "Neues Ablaufdatum, gültig bis einschliesslich dieses Tages"
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApiTokenAblauf"
        required: true
      responses:
        "204":
          description: Ablaufdatum gesetzt
        "401":
          description: Not Authorized
        "403":
          description: Not Allowed
        "400":
          description: Bad Request
      security:
      - SecurityScheme:
        - inhaber
    delete:
      summary: Ablaufdatum eines API-Tokens entfernen
      tags:
      - API-Tokens
      parameters:
      - description: ID des API-Tokens
        name: tokenId
        in: path
        required: true
        schema:
          type: string
      responses:
        "204":
          description: Ablaufdatum entfernt
        "401":
          description: Not Authorized
        "403":
          description: Not Allowed
      security:
      - SecurityScheme:
        - inhaber
  /api/v1/benutzer:
    get:
      summary: Benutzer des Mandanten auflisten
      tags:
      - Benutzerverwaltung
      parameters:
      - name: groesse
        in: query
        schema:
          type: integer
          format: int32
          default: 50
      - name: passkey
        in: query
        schema:
          description: Filter «Passkey eingerichtet»; ohne Angabe alle
          type: string
          enum:
          - ja
          - nein
      - name: q
        in: query
        schema:
          type: string
      - name: seite
        in: query
        schema:
          type: integer
          format: int32
          default: 0
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BenutzerAnsicht"
        "401":
          description: Not Authorized
        "403":
          description: Not Allowed
      security:
      - SecurityScheme:
        - inhaber
    post:
      summary: Benutzer anlegen und einladen
      tags:
      - Benutzerverwaltung
      parameters:
      - name: X-Real-Ip
