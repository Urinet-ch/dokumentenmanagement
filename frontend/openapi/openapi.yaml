        "401":
          description: Not Authorized
        "403":
          description: Not Allowed
      security:
      - SecurityScheme:
        - inhaber
        - mitarbeiter
        - treuhaender
        - geschaeftsstelle
  /api/v1/dokumente/{id}/wiederholen:
    post:
      summary: Verarbeitung oder Archivierung wiederholen
      description: "FEHLER → NEU (neue Verarbeitung), ARCHIVIERUNG_FEHLER → ARCHIVIERUNG\
        \ (neue Archivierung, Metadaten unverändert); sonst 409 STATUS_KONFLIKT (Req\
        \ 6.8, 6.13)."
      tags:
