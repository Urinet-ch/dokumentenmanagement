  /api/v1/wissensseiten:
    get:
      summary: Wissensseiten-Index
      description: "Nach Seitentyp gruppiert. Filter und Zähler berücksichtigen nur\
        \ sichtbare Seiten. Mit pfad wird stattdessen eine einzelne Seite abgerufen.\
        \ modus=hybrid oder volltext liefert höchstens 30 rangierte Treffer ohne Gesamtzahl/Paging,\
        \ hybrid mit Volltext-Rückfall und degradiert. Ohne modus bleibt der Index\
        \ unverändert."
      tags:
      - Wissensbasis
      parameters:
      - name: dokumentId
        in: query
        schema:
          type: string
      - schema:
          type: integer
          default: 50
        name: groesse
        in: query
      - name: modus
        in: query
        schema:
          type: string
      - schema:
          type: integer
          default: 0
        name: offset
        in: query
      - name: pfad
        in: query
        schema:
          type: string
      - name: q
        in: query
        schema:
          type: string
      - name: tag
        in: query
        schema:
          type: string
      - name: typ
        in: query
        schema:
          type: string
      responses:
        "200":
          description: "Index, Seite oder rangiertes Suchergebnis"
          content:
            application/json:
              schema:
                oneOf:
                - $ref: "#/components/schemas/WissensIndex"
                - $ref: "#/components/schemas/Wissensseite"
                - $ref: "#/components/schemas/WissensSuchergebnis"
        "400":
          description: Ungültiger Filter oder Pagingwert
        "404":
          description: Seite zum Pfad nicht vorhanden
        "401":
          description: Not Authorized
        "403":
          description: Not Allowed
      security:
      - SecurityScheme:
        - inhaber
        - mitarbeiter
        - treuhaender
        - geschaeftsstelle
