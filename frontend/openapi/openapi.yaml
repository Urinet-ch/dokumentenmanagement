              schema:
                $ref: "#/components/schemas/Kontakt"
        "400":
          description: ANFRAGE_UNGUELTIG
        "404":
          description: "NICHT_GEFUNDEN: unbekannt oder fremder Mandant"
        "409":
          description: "STATUS_KONFLIKT: inaktiver Kontakt (Req 17.16)"
        "412":
          description: VERSION_KONFLIKT
