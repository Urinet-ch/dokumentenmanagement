      responses:
        "201":
          description: Analyseentwurf angelegt
        "400":
          description: Nachrichten-ID ungültig
        "403":
          description: Rolle darf keine Analyse vorschlagen
        "404":
          description: Antwort oder Quelle nicht sichtbar
        "422":
          description: Analyse aus diesem Gespräch nicht möglich
        "401":
          description: Not Authorized
      security:
      - SecurityScheme:
        - inhaber
        - mitarbeiter
        - geschaeftsstelle
  /api/v1/wissensentwuerfe/import:
    post:
      summary: Wissenspaket synchron als Entwurf importieren
      description: "A17, nur OIDC. Keine KI, keine Freigabe. Höchstens 10 MiB ZIP\
        \ und 60 Sekunden."
      tags:
      - Wissensbasis
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                paket:
                  type: string
                  format: binary
        required: true
      responses:
        "201":
          description: Importentwurf angelegt
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Antwort1"
        "400":
          description: Teil paket fehlt oder ist mehrfach vorhanden
        "403":
          description: Import nicht erlaubt
        "409":
          description: Paket bereits importiert oder zu viele offene Importe
        "413":
          description: Paket zu gross
        "415":
          description: Kein ZIP oder falscher Medientyp
        "422":
          description: Paket ungültig; Codes und Pfade ohne Inhalte
        "401":
          description: Not Authorized
      security:
      - SecurityScheme:
        - inhaber
        - geschaeftsstelle
  /api/v1/wissensentwuerfe/{entwurfId}/abschnitte/{nr}/wiederholen:
