openapi: 3.1.0
tags:
- name: API-Tokens
- name: Benutzerverwaltung
- name: Berichte
- name: Branding
- name: Chat
- name: Dokumentarten
- name: Dokumente
- name: Einstellungen
- name: Exporte
- name: Importe
- name: Konfiguration
- name: Kontakte
- name: Protokoll
- name: Quellen
- name: Trennblaetter
