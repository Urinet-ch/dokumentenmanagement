            schema:
              type: object
              properties:
                datei:
                  type: string
                  format: binary
        required: true
      responses:
        "200":
          description: Zuordnung nötig
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportHochgeladen"
