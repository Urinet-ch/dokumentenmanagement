          description: Mehr als 5'000 Bewertungen im gewählten Zeitraum
        "403":
          description: Not Allowed
        "400":
          description: Bad Request
      security:
      - SecurityScheme:
        - inhaber
  /api/v1/chat/gespraeche:
    get:
      summary: Eigene Gespräche
      description: "Höchstens 20 eigene Gespräche mit Modus (ARCHIV oder WISSEN) und\
        \ mindestens einer Frage, zuletzt geänderte zuerst."
      tags:
      - Chat
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ChatGespraech"
        "401":
          description: Not Authorized
        "403":
          description: Not Allowed
      security:
      - SecurityScheme:
        - inhaber
        - mitarbeiter
        - treuhaender
        - geschaeftsstelle
    post:
      summary: Gespräch mit Modus anlegen
      description: "Legt ein eigenes Gespräch ohne Frage an (Spec 04, Requirement\
        \ 21.1 und 21.5). Modus ARCHIV (Standard, auch ohne Körper) oder WISSEN (nur\
        \ aus der Wissensbasis, Recht A15, sonst 403); ein anderer Wert ergibt 400\
        \ ANFRAGE_UNGUELTIG. Der Modus bleibt für das Gespräch fest. Die Fragen folgen\
        \ wie bisher mit POST /chat und der gespraechId; der Titel ist bis zur ersten\
        \ Frage «Neues Gespräch». Wer wiederholt anlegt, erhält das noch nicht gefragte\
        \ Gespräch desselben Modus zurück (200 statt 201). Das Gespräch erscheint\
        \ in der Liste mit seiner ersten Frage. Der Anfragekörper muss kleiner als\
        \ 8 KiB sein."
      tags:
      - Chat
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatGespraechAnlegen"
        required: false
      responses:
        "200":
          description: Noch nicht gefragtes Gespräch desselben Modus zurückgegeben
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatGespraech"
        "201":
          description: Gespräch angelegt
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatGespraech"
        "400":
          description: Modus ungültig
        "403":
          description: Modus WISSEN ohne Recht A15
        "413":
          description: Anfragekörper zu gross
        "401":
          description: Not Authorized
      security:
      - SecurityScheme:
        - inhaber
        - mitarbeiter
        - treuhaender
        - geschaeftsstelle
