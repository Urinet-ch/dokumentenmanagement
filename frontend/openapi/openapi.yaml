            schema:
              $ref: "#/components/schemas/WissenAnnehmen"
        required: true
      responses:
        "204":
          description: Änderung angenommen
        "403":
          description: Rolle darf Änderungen nicht annehmen
        "404":
          description: Änderung nicht gefunden oder nicht sichtbar
        "409":
          description: Änderung ist nicht offen
        "412":
          description: Version veraltet
        "422":
          description: Fassung hat Befunde oder die Vertraulichkeit ist ungültig
        "428":
          description: If-Match fehlt
        "401":
          description: Not Authorized
        "400":
          description: Bad Request
      security:
      - SecurityScheme:
        - inhaber
        - mitarbeiter
        - treuhaender
        - geschaeftsstelle
  /api/v1/wissensentwuerfe/{entwurfId}/aenderungen/{nr}/neu-erzeugen:
    post:
      summary: Veraltete Wissensänderung neu erzeugen
