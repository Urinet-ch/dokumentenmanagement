            application/json:
              schema:
                $ref: "#/components/schemas/ImportLauf"
        "409":
          description: "STATUS_KONFLIKT: Lauf nicht mehr zuzuordnen oder gesperrt,\
            \ weil seine Übernahme gerade läuft"
        "422":
          description: "CSV_UNGUELTIG: keine Spalte für Name bzw. Titel"
        "401":
          description: Not Authorized
        "403":
          description: Not Allowed
        "400":
          description: Bad Request
      security:
      - SecurityScheme:
        - inhaber
  /api/v1/importe/{id}:
    get:
      summary: Import-Lauf mit Vorschau lesen
      description: "Lauf mit den Zählern der Vorschau (neu, geändert, unverändert,\
        \ mögliche Dublette, fehlerhaft) und einer Seite seiner Zeilen (Req 13.3),\
        \ mit ergebnis nur Zeilen mit diesem Ergebnis. seite ab 0, groesse 1–100.\
        \ Die Zähler der Vorschau fehlen, bis der Auftrag CSV_VORSCHAU fertig ist\
        \ (Status VORSCHAU). Bei Status ZUORDNUNG_NOETIG kommen Spalten und Vorschlag\
        \ wie beim Upload mit (Zuordnungsdialog nach einem Neuladen)."
      tags:
      - Importe
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      - name: ergebnis
        in: query
        schema:
          type: string
          enum:
          - NEU
          - GEAENDERT
          - UNVERAENDERT
          - DUBLETTE
          - FEHLER
          - UEBERSPRUNGEN
          - INAKTIV
      - name: groesse
        in: query
        schema:
          type: integer
          format: int32
          default: 50
      - name: seite
        in: query
        schema:
          type: integer
          format: int32
          default: 0
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportLaufMitZeilen"
        "400":
          description: "ANFRAGE_UNGUELTIG: seite, groesse oder ergebnis ungültig"
        "404":
          description: "NICHT_GEFUNDEN: kein Lauf mit dieser ID im Mandanten"
        "401":
          description: Not Authorized
        "403":
          description: Not Allowed
      security:
      - SecurityScheme:
        - inhaber
  /api/v1/importe/{id}/uebernehmen:
    post:
      summary: Lauf übernehmen
      description: "Reiht die Übernahme eines Laufs im Status VORSCHAU ein (Auftrag\
        \ CSV_UEBERNEHMEN, eine Transaktion; Req 13.6–13.9). Neue Kontakte bzw. Verkaufschancen\
        \ werden angelegt, geänderte aktualisiert (die CSV gewinnt, leere Zellen ü\
        berschreiben nichts), mögliche Dubletten nur nach Entscheid. Gelöscht wird\
        \ nie; beim Vollexport werden Kontakte mit CRM-ID, die fehlen, als «nicht\
        \ mehr im CRM-Export» gekennzeichnet. Ein erneuter Aufruf vor dem Ende ersetzt\
        \ die Entscheide."
      tags:
      - Importe
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ImportUebernehmen"
        required: true
      responses:
        "202":
          description: Übernahme eingereiht; Status bleibt VORSCHAU bis zum Ende
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportLauf"
        "400":
          description: "ANFRAGE_UNGUELTIG: Entscheid ungültig, für eine Zeile ohne\
            \ Dublette, mit einem Kontakt ausserhalb der Kandidaten, zweimal für dieselbe\
            \ Zeile oder bei Verkaufschancen"
        "404":
          description: "NICHT_GEFUNDEN: kein Lauf mit dieser ID im Mandanten"
        "409":
          description: "STATUS_KONFLIKT: Lauf nicht im Status VORSCHAU oder gesperrt,\
            \ weil seine Übernahme gerade läuft"
        "401":
          description: Not Authorized
        "403":
          description: Not Allowed
      security:
      - SecurityScheme:
        - inhaber
