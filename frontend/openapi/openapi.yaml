  /api/v1/dokumente:
    post:
      summary: Dateien hochladen
      description: "PDF, JPEG, PNG, HEIC/HEIF und TIFF bis 50 MB je Datei; je Datei\
        \ ein Ergebnis (Req 3). Für unbestätigte Importe können «art» und «klassifikationen»\
        \ als JSON-Objekt mit Codes übergeben werden; Werte werden nach Req 3.5 geprü\
        ft. Sind alle Dateien abgelehnt, folgt Problem Details mit dem Status der\
        \ ersten Ablehnung und der Erweiterung «ergebnisse». Werkzeuge mit Token vom\
        \ Scope import ordnen die Dateien mit «quelllauf» (ID) oder «quelle» (Code)\
        \ einem Quelllauf zu (Spec 09, 10.4)."
      tags:
      - Dokumente
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                dateien:
                  type: array
                  items:
                    type: string
                    format: binary
                arbeitsfassungen:
                  type: array
                  items:
                    type: string
                    format: binary
                zusammenfassen:
                  type: boolean
                hinweis:
                  type: string
                art:
                  type: string
                klassifikationen:
                  type: string
                quelle:
                  type: string
                quelllauf:
                  type: string
        required: true
      responses:
        "202":
          description: Mindestens eine Datei angenommen oder als Dublette erkannt
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/UploadErgebnis"
        "400":
          description: "Anfrage ungültig (keine Datei, Hinweis zu lang, Anzahl Arbeitsfassungen\
            \ passt nicht) oder alle Dateien abgelehnt, erste mit Steuerzeichen im\
            \ Namen"
        "413":
          description: "Anfrage über archiv.upload.max-anfrage oder alle Dateien abgelehnt,\
            \ erste über 50 MB"
        "409":
          description: "STATUS_KONFLIKT: Quelllauf beendet oder Trockenlauf; QUELLE_LAEUFT:\
            \ Quelle im Trockenlauf; nichts wurde angelegt"
        "415":
          description: "Alle Dateien abgelehnt, erste mit unbekanntem Typ"
        "422":
          description: "Alle Dateien abgelehnt, erste leer oder beschädigt"
        "503":
          description: Speicher nicht erreichbar; nichts wurde angelegt
          headers:
            Retry-After:
              description: Sekunden bis zum nächsten Versuch
        "401":
          description: Not Authorized
        "403":
          description: Not Allowed
      security:
      - SecurityScheme:
        - inhaber
        - mitarbeiter
        - geschaeftsstelle
        - api-token:import
    get:
      summary: Dokumente suchen
      description: "Volltext (deutsche Stammformen; Titel, Partner, Tags, OCR-Text)\
        \ mit Filtern; alle Filter mit «und», mehrere tag müssen alle stehen. Eine\
        \ exakte Belegnummer als q steht zuerst. Nur sichtbare Dokumente, auch in\
        \ gesamt (Req 2.3). Ohne status keine verworfenen Dokumente. Mit modus=hybrid\
        \ Volltext und semantische Suche mit Reranker (Spec 02, Req 2.2, 2.7): q Pflicht,\
        \ ohne sortierung=DATUM, seite und groesse; höchstens 30 Treffer ohne Blä\
        ttern, degradiert bei Rückfall auf den Volltext. Klassifikationsfilter als\
        \ wiederholbare Parameter klassifikation.<code>=<wert>; Antwort enthält sichtbarkeitsgeprü\
        fte Facetten. Ungültige Parameter → 400 ANFRAGE_UNGUELTIG."
      tags:
      - Dokumente
      parameters:
      - description: Code der Dokumentart
        name: art
        in: query
        schema:
          type: string
      - description: exakte Belegnummer
        name: belegnummer
        in: query
        schema:
          type: string
      - description: "Dezimalzahl mit Punkt, ohne Währungsumrechnung"
        name: betragBis
        in: query
        schema:
          type: string
      - description: "Dezimalzahl mit Punkt, ohne Währungsumrechnung"
        name: betragVon
        in: query
        schema:
          type: string
      - description: Belegdatum bis
        schema:
          format: date
          type: string
        name: datumBis
        in: query
      - description: Belegdatum ab
        schema:
          format: date
          type: string
        name: datumVon
        in: query
      - schema:
          format: int32
          type: integer
        name: geschaeftsjahr
        in: query
      - description: 1–100
        schema:
          format: int32
          type: integer
          default: 20
        name: groesse
        in: query
      - description: "Standard volltext; hybrid nur mit q, ohne sortierung=DATUM,\
          \ seite und groesse (Spec 02, Req 2.7)"
        schema:
          type: string
          enum:
          - volltext
          - hybrid
        name: modus
        in: query
      - description: ID des Partners
        schema:
          format: uuid
          type: string
        name: partner
        in: query
      - description: "Suchbegriff (Websuche-Syntax: \"Wortfolge\", -ohne, or), hö\
          chstens 200 Zeichen"
        name: q
        in: query
        schema:
          type: string
      - schema:
          type: string
          enum:
          - EINNAHME
          - AUSGABE
        name: richtung
        in: query
      - description: ab 0
        schema:
          format: int32
          type: integer
          default: 0
        name: seite
        in: query
      - description: "Standard RELEVANZ mit q, sonst DATUM"
        schema:
          type: string
          enum:
          - RELEVANZ
          - DATUM
        name: sortierung
        in: query
      - schema:
          type: string
          enum:
          - NEU
          - VERARBEITUNG
          - EINGANGSKORB
          - ARCHIVIERUNG
          - ARCHIVIERUNG_FEHLER
          - ARCHIVIERT
          - FEHLER
          - VERWORFEN
        name: status
        in: query
      - description: "Tag; mehrfach möglich (höchstens 10), alle müssen stehen"
        name: tag
        in: query
        schema:
          type: array
          items:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Suchergebnis"
        "401":
          description: Not Authorized
        "403":
          description: Not Allowed
      security:
      - SecurityScheme:
        - inhaber
        - mitarbeiter
        - treuhaender
        - geschaeftsstelle
  /api/v1/dokumente/generator:
    post:
      summary: PDF mit Metadaten aus einem Generator ablegen
      description: "Nur mit API-Token vom Scope generator (Req 11.1). Das Dokument\
        \ wird ohne KI verarbeitet und archiviert (Req 11.2); 202 heisst angenommen,\
        \ Status und Fehler zeigt das Dokument."
      tags:
      - Dokumente
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                datei:
                  type: string
                  format: binary
                  description: PDF bis 50 MB
                metadaten:
                  type: string
                  description: GeneratorMetadaten als JSON-Text
        required: true
      responses:
        "202":
          description: Angenommen; Verarbeitung und Archivierung folgen im Worker
          headers:
            Location:
              description: URL des Dokuments
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GeneratorAntwort"
        "200":
          description: Dieselbe PDF liegt schon im Archiv (Req 11.8)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GeneratorAntwort"
        "400":
          description: "Metadaten kein gültiges JSON, unbekanntes Feld, unbekannte\
            \ Art oder ungültiger Wert (Richtung, Währung, Betrag, Vertraulichkeit)"
        "403":
          description: Kein API-Token vom Scope generator
        "409":
          description: "BELEGNUMMER_VERGEBEN (Req 11.3) oder FRIST_ABGELAUFEN (Req\
            \ 9.8); nichts angelegt, nicht erneut senden (Req 11.9)"
        "413":
          description: Datei über 50 MB oder Metadaten über 4 KB
        "415":
          description: Keine PDF
        "422":
          description: "PFLICHTFELD_FEHLT mit Liste (Req 11.6, 11.10), PARTNER_UNBEKANNT\
            \ (Req 11.7), ZUSATZ_UNGUELTIG oder Datei leer bzw. beschädigt"
        "503":
          description: Speicher nicht erreichbar; nichts wurde angelegt
          headers:
            Retry-After:
              description: Sekunden bis zum nächsten Versuch
        "401":
          description: Not Authorized
      security:
      - SecurityScheme:
        - inhaber
        - mitarbeiter
        - geschaeftsstelle
        - api-token:generator
  /api/v1/dokumente/pruefsummen:
    post:
      summary: Prüfsummen abfragen
      description: "Höchstens 1'000 Prüfsummen; Antwort ohne IDs, für Benutzer nur\
        \ sichtbare Dokumente (A1, Scope import)"
      tags:
      - Quellen
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PruefsummenAnfrage"
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PruefsummenAntwort"
        "400":
          description: "ANFRAGE_UNGUELTIG: mehr als 1'000 oder keine gültige SHA-256"
        "401":
          description: Not Authorized
        "403":
          description: Not Allowed
      security:
      - SecurityScheme:
        - inhaber
        - mitarbeiter
        - geschaeftsstelle
        - api-token:import
  /api/v1/dokumente/{id}:
    get:
      summary: Metadaten eines Dokuments lesen
      description: "Unsichtbare und fremde Dokumente → 404 NICHT_GEFUNDEN (Req 1.4,\
        \ 2.3)."
      tags:
      - Dokumente
      parameters:
      - name: id
        in: path
        required: true
        schema:
          $ref: "#/components/schemas/UUID"
      responses:
        "200":
          description: Dokument
          headers:
            ETag:
              description: Version des Dokuments für If-Match
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Dokument"
        "401":
          description: Not Authorized
        "403":
          description: Not Allowed
      security:
      - SecurityScheme:
        - inhaber
        - mitarbeiter
        - treuhaender
        - geschaeftsstelle
    patch:
      summary: Metadaten eines Dokuments ändern
      description: "Nur in EINGANGSKORB, FEHLER und ARCHIVIERT (sonst 409 STATUS_KONFLIKT).\
        \ Vertraulichkeit oder personBenutzer ohne Recht A8 → 403 für die ganze Ä\
        nderung. Bei ARCHIVIERT ist grund Pflicht (422 PFLICHTFELD_FEHLT), die vorherige\
        \ Fassung geht nach dokument_version, kein Pflichtfeld der Art darf neu fehlen,\
        \ und eine Änderung von datum, art, geschaeftsjahr oder gueltigBis berechnet\
        \ die Aufbewahrungsfrist neu: Frist und Sperre werden nur verlängert, ein\
        \ früheres Ergebnis bei gesperrten Dokumenten als SPERRE_KONFLIKT protokolliert\
        \ (Req 9.7, 10.1). Ungültige Zusatzfelder → 422 ZUSATZ_UNGUELTIG; Partner\
        \ unbekannt → 422 PARTNER_UNBEKANNT; Belegnummer einer eigenen Art schon vergeben\
        \ → 409 BELEGNUMMER_VERGEBEN."
      tags:
      - Dokumente
      parameters:
      - name: id
        in: path
        required: true
        schema:
          $ref: "#/components/schemas/UUID"
      - required: true
        name: If-Match
        in: header
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DokumentAenderung"
        required: true
      responses:
        "200":
          description: Geändertes Dokument
          headers:
            ETag:
              description: Neue Version des Dokuments
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Dokument"
        "409":
          description: Sperrkonflikt oder Statuskonflikt (STATUS_KONFLIKT)
        "412":
          description: If-Match passt nicht zur aktuellen Version (VERSION_KONFLIKT)
        "428":
          description: If-Match fehlt (VERSION_FEHLT)
        "401":
          description: Not Authorized
        "403":
          description: Not Allowed
      security:
      - SecurityScheme:
        - inhaber
        - mitarbeiter
        - treuhaender
        - geschaeftsstelle
  /api/v1/dokumente/{id}/bestaetigen:
    post:
      summary: Dokument bestätigen und archivieren
      description: Nur aus EINGANGSKORB (sonst 409 STATUS_KONFLIKT). Pflichtfelder
        der Art fehlen → 422 PFLICHTFELD_FEHLT mit felder; Partner unbekannt → 422
        PARTNER_UNBEKANNT; Belegnummer einer eigenen Art schon vergeben → 409 BELEGNUMMER_VERGEBEN;
        Aufbewahrungsfrist abgelaufen ohne fristAbgelaufenAkzeptiert → 409 FRIST_ABGELAUFEN.
        Ein Feld dateiname → 400 ANFRAGE_UNGUELTIG (Req 3.14). Danach ARCHIVIERUNG
        und Auftrag ARCHIVIEREN.
      tags:
      - Dokumente
      parameters:
      - name: id
        in: path
        required: true
        schema:
          $ref: "#/components/schemas/UUID"
      - required: true
        name: If-Match
        in: header
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Bestaetigung"
        required: true
      responses:
        "202":
          description: "Bestätigt, Archivierung eingereiht; Körper ist das Dokument\
            \ nach der Bestätigung (Req 14.9)"
          headers:
            ETag:
              description: Neue Version des Dokuments
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Dokument"
        "409":
          description: Sperrkonflikt oder Statuskonflikt (STATUS_KONFLIKT)
        "412":
          description: If-Match passt nicht zur aktuellen Version (VERSION_KONFLIKT)
        "428":
          description: If-Match fehlt (VERSION_FEHLT)
        "401":
          description: Not Authorized
        "403":
          description: Not Allowed
        "400":
          description: Bad Request
      security:
      - SecurityScheme:
        - inhaber
        - mitarbeiter
        - treuhaender
        - geschaeftsstelle
  /api/v1/dokumente/{id}/datei:
    get:
      summary: Datei eines Dokuments herunterladen
      description: "Antwortet mit 302 auf eine vorsignierte URL für genau die gespeicherte\
        \ Version, höchstens 5 Minuten gültig (Req 14.6). Verlangt die Anfrage ausdrü\
        cklich «Accept: application/json» (PWA), kommt dieselbe Adresse stattdessen\
        \ als JSON mit 200; Prüfung und Protokoll sind gleich. variante pdfa (Standard,\
        \ ohne nr), original oder arbeitsfassung (nr ab 1, Standard 1). ansicht download\
        \ (Standard, Content-Disposition attachment mit sicherem Dateinamen) oder\
        \ vorschau (inline mit dem Typ der Datei, für die Anzeige in der Seite; nur\
        \ für PDF und Bilder, sonst attachment). Unsichtbare, verworfene oder fehlende\
        \ Dateien → 404 NICHT_GEFUNDEN."
      tags:
      - Dokumente
      parameters:
      - name: id
        in: path
        required: true
        schema:
          $ref: "#/components/schemas/UUID"
      - schema:
          type: string
          default: download
          enum:
          - download
          - vorschau
        name: ansicht
        in: query
      - description: Nummer der Datei (nur original und arbeitsfassung)
        schema:
          maximum: 9999
          minimum: 1
          format: int32
          type: integer
        name: nr
        in: query
      - schema:
          type: string
          default: pdfa
          enum:
          - pdfa
          - original
          - arbeitsfassung
        name: variante
        in: query
      responses:
        "200":
          description: "Vorsignierte URL als JSON (nur mit Accept: application/json)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DownloadAdresse"
        "302":
          description: Weiterleitung auf die vorsignierte URL
          headers:
            Location:
              description: "vorsignierte URL, nur für GET"
        "401":
          description: Not Authorized
        "403":
          description: Not Allowed
      security:
      - SecurityScheme:
        - inhaber
        - mitarbeiter
        - treuhaender
        - geschaeftsstelle
  /api/v1/dokumente/{id}/verwerfen:
    post:
      summary: Dokument verwerfen
      description: "Nur aus EINGANGSKORB und FEHLER (sonst 409 STATUS_KONFLIKT, nichts\
        \ wird gelöscht). Löscht alle Dateien unter eingang/ und protokolliert je\
        \ Datei SHA-256 und Grund (Req 6.6, 6.7)."
      tags:
      - Dokumente
      parameters:
