# Abhängigkeiten wöchentlich aktualisieren (Aufgabe 1.8). Jeder PR läuft durch die CI und wird von Fabian gemergt.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /backend/src/main/docker
    schedule:
      interval: weekly
    ignore:
      # Das Projekt bleibt auf Java 25 LTS (tech.md); Patch- und Minor-Updates auf 25.x kommen weiter.
      # Der Wechsel auf die nächste LTS (Java 29) ist ein eigener Entscheid.
      - dependency-name: eclipse-temurin
        update-types: ["version-update:semver-major"]
  - package-ecosystem: docker-compose
    directory: /backend
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    ignore:
      # TypeScript-Major folgt dem Update von Angular.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
  - package-ecosystem: maven
    directory: /backend
    schedule:
      interval: weekly
