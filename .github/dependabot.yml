# Abhängigkeiten wöchentlich aktualisieren (Aufgabe 1.8). Jeder PR läuft durch die CI und wird von Fabian gemergt.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /backend/src/main/docker
    schedule:
      interval: weekly
    ignore:
      # Das Projekt bleibt auf Java 25 LTS (tech.md); Patch- und Minor-Updates auf 25.x kommen weiter.
      # Der Wechsel auf die nächste LTS (Java 29) ist ein eigener Entscheid.
      - dependency-name: eclipse-temurin
        update-types: ["version-update:semver-major"]
  # Basis-Images von PostgreSQL und Keycloak für den Deploy (Aufgabe 1.9), per Digest gepinnt. Dieselben Images nennt
  # application.properties für die Dev Services; DeployImagesTest bricht ab, bis der Dependabot-PR sie dort nachzieht.
  - package-ecosystem: docker
    directories:
      - /deploy/infomaniak/db
      - /deploy/infomaniak/keycloak
    schedule:
      interval: weekly
  - package-ecosystem: docker-compose
    directory: /backend
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    ignore:
      # TypeScript-Major folgt dem Update von Angular.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
  - package-ecosystem: maven
    directories:
      - /backend
      # Drive-Import-Werkzeug (Aufgabe 4.8), eigenes Maven-Projekt
      - /tools/drive_import
    schedule:
      interval: weekly
