# Abhängigkeiten wöchentlich aktualisieren (Aufgabe 1.8). Jeder PR läuft durch die CI und wird von Fabian gemergt.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /backend/src/main/docker
    schedule:
      interval: weekly
  - package-ecosystem: docker-compose
    directory: /backend
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
  - package-ecosystem: maven
    directory: /backend
    schedule:
      interval: weekly
