# Secret-Scan und Leitplanken aller Branches (Harness-Vorlage, Master in der Skill-Werkstatt).
# Letzte Linie hinter dem Pre-Commit-Hook: Der bindet nur eingerichtete Klone.
name: Secret-Scan

on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    env:
      VERSION: 8.30.1
      SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # Binary statt gitleaks-action: Die Action verlangt für Organisationen eine Lizenz.
      - name: gitleaks laden und prüfen
        run: |
          curl -sSfL -o gitleaks.tgz "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz"
          echo "${SHA256}  gitleaks.tgz" | sha256sum -c -
          tar -xzf gitleaks.tgz gitleaks
          rm gitleaks.tgz
      - name: Scan
        run: ./gitleaks git --redact --no-banner --config .gitleaks.toml .

  leitplanken:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Der Schlüssel dangerous-clean-slate der FTP-Action leert den ganzen Docroot.
      - name: Kein dangerous-clean-slate
        run: |
          if grep -rnE '^([^#]*[[:space:]{,])?dangerous-clean-slate[[:space:]]*:' .github/workflows; then
            echo "::error::dangerous-clean-slate in einem Workflow. Schlüssel weglassen, der Sync-State genügt."
            exit 1
          fi
