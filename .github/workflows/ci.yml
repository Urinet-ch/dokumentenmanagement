# CI für jeden PR und main (tech.md, Tests und Qualität; Aufgabe 1.1). Baut nur, pusht kein Image (Deploy folgt mit 1.9).
# Req 16.7: kein Secret, keine echten Belege, kein Golden-Lauf, kein echter KI-Aufruf (Tests nur gegen WireMock auf
# localhost); Logs nennen nur IDs und Dateipfade.
name: CI

on:
  # Entwürfe (Draft) laufen nicht: Actions-Minuten sind knapp (Free-Plan), Agenten prüfen lokal vor «Ready for review».
  # ready_for_review startet den ersten Lauf, danach jeder Push (Entscheid Fabian 10.11.2026).
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  # Push auf main vorübergehend ohne CI (Entscheid Fabian 11.11.2026, Actions-Minuten bis 1.12.): Jeder PR steht vor dem
  # Merge auf dem aktuellen main und hat dort eine grüne CI. Wieder einschalten: «push: branches: [main]» ergänzen.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend:
    name: Backend (mvn verify, Quinoa-Build, Prüfungen)
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Bestehende Liquibase-Changesets unverändert
        env:
          BASIS: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          .github/scripts/pruefe-liquibase-test.sh
          .github/scripts/pruefe-liquibase.sh "$BASIS"

      - name: Frontend-Abhängigkeiten
        working-directory: frontend
        run: npm ci

      - name: mvn verify (Cucumber, JUnit, ArchUnit, Abdeckung @req) und Build über Quinoa
        run: mvn -B -ntp -f backend/pom.xml verify

      - name: OpenAPI und generierter Client aktuell
        working-directory: frontend
        run: |
          npm run api:generieren > /dev/null
          if [ -n "$(git status --porcelain -- openapi src/app/gemeinsam/api)" ]; then
            echo "OpenAPI oder generierter Client veraltet; lokal bauen und 'npm run api:generieren' ausführen:"
            git status --porcelain -- openapi src/app/gemeinsam/api
            exit 1
          fi

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: quarkus-app
          path: backend/target/quarkus-app/
          retention-days: 3

  frontend:
    name: Frontend (ng test)
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - working-directory: frontend
        run: npm ci
      - name: npm audit (Laufzeit-Abhängigkeiten)
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high
      - working-directory: frontend
        run: npx ng test --watch=false

  browser:
    name: Browser-Szenarien (Cucumber.js, Playwright)
    needs: backend
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: quarkus-app
          path: backend/target/quarkus-app/
      - working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
      # Die Upload-Szenarien (Aufgabe 2.4) laufen gegen das echte Archiv im Testmodus: Dev Services (PostgreSQL,
      # Keycloak mit Test-Realm, MinIO), synthetische Dateien. Es schreibt backend/target/browser-backend.json, sobald
      # es bereit ist, und hält, bis backend/target/browser-backend.stop erscheint (BrowserBackendTest).
      - name: Echtes Archiv für die Upload-Szenarien starten (BrowserBackendTest)
        run: |
          mvn -B -ntp -f backend/pom.xml test -Dtest=BrowserBackendTest -Darchiv.browser-backend=true \
            -Dsurefire.failIfNoSpecifiedTests=false -Dquarkus.quinoa.enabled=false \
            -Dquarkus.test.hang-detection-timeout=PT2H > "$RUNNER_TEMP/browser-backend.log" 2>&1 &
          for _ in $(seq 1 900); do
            test -f backend/target/browser-backend.json && exit 0
            sleep 1
          done
          echo "Echtes Archiv nicht bereit"
          tail -n 50 "$RUNNER_TEMP/browser-backend.log"
          exit 1
      - name: Archiv starten
        env:
          # ohne Datenbank (Readiness DOWN): seit Aufgabe 1.3 gibt es Entitäten, die Persistence Unit muss mit aus.
          # prod verlangt seit Aufgabe 1.9 eine Adresse der Datenbank (sonst Abbruch); hier eine nie erreichte
          # Platzhalter-Adresse und die Datasource ausdrücklich aus
          QUARKUS_HIBERNATE_ORM_ACTIVE: 'false'
          QUARKUS_DATASOURCE_ACTIVE: 'false'
          QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://localhost:1/keine-datenbank
          # ohne Keycloak beendet sich das Archiv sonst nach 5 Minuten mit Exit-Code 75 (OIDC-Wächter)
          ARCHIV_OIDC_WAECHTER_FRIST: PT60M
        # Secret-Dateien wie in prod, nur mit Platzhaltern, keine echten Zugangsdaten: ohne eine der Dateien
        # bricht der Start ab (design.md, Abschnitt zu Konfiguration und Geheimnissen). Dieses Archiv liefert nur die
        # PWA aus; die Uploads leiten die Szenarien an das echte Archiv im Testmodus weiter (frontend/e2e/schritte/upload.mjs)
        run: |
          DATEIEN="$RUNNER_TEMP/secret-dateien"
          mkdir -p "$DATEIEN"
          for datei in archiv_db_app archiv_db_owner s3_app_zugang_id s3_app_zugang_geheimnis; do
            printf 'ci-platzhalter' > "$DATEIEN/$datei"
          done
          java -Dsmallrye.config.source.file.locations="$DATEIEN" -jar backend/target/quarkus-app/quarkus-run.jar > /dev/null 2>&1 &
          for i in $(seq 1 60); do
            curl -sf http://localhost:8080/q/health/live > /dev/null && exit 0
            sleep 1
          done
          echo "Archiv nicht gestartet"
          exit 1
      - working-directory: frontend
        run: npx cucumber-js
      - name: Echtes Archiv beenden
        if: always()
        run: touch backend/target/browser-backend.stop

  docker:
    name: Docker-Image (nur bauen)
    needs: backend
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: quarkus-app
          path: backend/target/quarkus-app/
      - run: docker build -f backend/src/main/docker/Dockerfile.jvm -t urinet-archiv:ci backend
