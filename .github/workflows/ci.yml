# CI für jeden PR und main (tech.md, Tests und Qualität; Aufgabe 1.1). Baut nur, pusht kein Image (Deploy folgt mit 1.9).
# Req 16.7: kein Secret, keine echten Belege, kein Golden-Lauf, kein echter KI-Aufruf (Tests nur gegen WireMock auf
# localhost); Logs nennen nur IDs und Dateipfade.
name: CI

on:
  # Entwürfe (Draft) laufen nicht (Entscheid Fabian 10.11.2026); seit das Repo öffentlich ist (11.11.2026), kosten Läufe
  # keine Minuten mehr, die Regel bleibt: Agenten prüfen lokal vor «Ready for review».
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Reine Spec-Anpassungen ohne vollständigen Lauf (entschieden von Fabian am 13.11.2026): «art» bestimmt mit
  # .github/scripts/nur-spec.py, ob jede geänderte Datei eine .md-Datei unter .kiro/ oder docs/ ist (strenge
  # Positivliste; PR: alle Dateien zwischen Basis und Kopf, Push auf main: gegenüber «before», neuer Branch oder
  # überschriebener Push und workflow_dispatch nie). Dann läuft nur «spec» mit den Tests, die Specs und Docs lesen, ohne
  # Quarkus-Start; alle anderen Jobs (auch «testzahl») sind übersprungen. Der Deploy-Nachweis (pruefe-ci-nachweis.py)
  # nutzt dieselbe Regel: Ein solcher Commit auf main erbt den Nachweis seines Vorgängers; dafür braucht er den Lauf
  # auf dem Push nach main. Secret-Scan und Leitplanken (secret-scan.yml) laufen unverändert bei jedem Push. Entwürfe
  # überspringen «art» und «spec», damit alle Jobs.
  # Die Regel kommt aus dem Basis-Stand (PR: Basis, Push: before), nicht aus dem geprüften Commit (Review 13.11.2026):
  # Ein PR, der nur-spec.py fehlerhaft ändert, kann sich so nicht selbst als «nur Spec» einstufen und die schweren
  # Jobs samt NurSpecTest überspringen. Fehlt die Regel im Basis-Stand, ist das Ergebnis «false».
  art:
    name: Änderungsart (nur Spec?)
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-24.04
    outputs:
      nur-spec: ${{ steps.art.outputs.nur-spec }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # ganze Historie: Basis, Kopf und Vorgänger müssen für git diff vorhanden sein
          fetch-depth: 0
          persist-credentials: false
      - name: Nur Spec? (nur-spec.py)
        id: art
        env:
          EREIGNIS: ${{ github.event_name }}
          BASIS: ${{ github.event.pull_request.base.sha }}
          KOPF: ${{ github.event.pull_request.head.sha }}
          VORHER: ${{ github.event.before }}
        run: |
          case "$EREIGNIS" in
            pull_request) stand=$BASIS von=$BASIS bis=$KOPF art=pr ;;
            push) stand=$VORHER von=$VORHER bis=$GITHUB_SHA art=push ;;
            *) stand= ;;
          esac
          regel="$RUNNER_TEMP/nur-spec.py"
          if [ -n "$stand" ] && git show "$stand:.github/scripts/nur-spec.py" > "$regel" 2> /dev/null; then
            ergebnis=$(python3 -I "$regel" "$art" "$von" "$bis")
          else
            echo "Keine Regel nur-spec.py im Basis-Stand ($EREIGNIS): voller Lauf"
            ergebnis=false
          fi
          case "$ergebnis" in
            true|false) ;;
            *) echo "::error::nur-spec.py lieferte weder true noch false"; exit 1 ;;
          esac
          echo "nur-spec=$ergebnis" >> "$GITHUB_OUTPUT"
          if [ "$ergebnis" = true ]; then
            echo "Nur Spec: Es laufen nur die Spec-Prüfungen, die übrigen Jobs sind übersprungen." >> "$GITHUB_STEP_SUMMARY"
          fi

  spec:
    # Name gleich SPEC_JOB in nur-spec.py: Daran erkennt der Deploy-Nachweis den Lauf. Läuft in jedem Lauf (ausser
    # Entwurf), nicht nur bei «nur Spec» (Review 13.11.2026): Ein voller Lauf hat damit weiterhin keinen übersprungenen
    # Job, und Regel 1 des Deploy-Nachweises («jeder Job erfolgreich») bleibt unverändert; die Doppelung mit «backend»
    # kostet etwa eine Minute auf einem eigenen Runner, parallel zu den anderen Jobs.
    name: Spec-Prüfungen (nur Spec)
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      # Jede Testklasse, die .kiro/ oder docs/ liest: Abdeckung @req (Req 16.14), Fehlercodes, Rechtematrix,
      # Stammdaten-Tabelle gegen den Seed; dazu die Regel selbst (NurSpecTest, CiNachweisTest). NurSpecTest prüft, dass
      # jede Klasse mit einem Pfad nach .kiro/ oder docs/ (oder ihr Nutzer) hier steht, und dass es jede genannte gibt
      - name: Spec-Tests (ohne Quarkus-Start)
        env:
          SPEC_TESTS: ReqAbdeckungTest,FehlercodeSpecTest,RechtematrixSpecTest,DokumentartSeedTest,NurSpecTest,CiNachweisTest
        run: |
          mvn -B -ntp -f backend/pom.xml test -Dtest="$SPEC_TESTS" -Dsurefire.failIfNoSpecifiedTests=false \
            -Dquarkus.quinoa=false

  # Die Backend-Tests laufen in drei parallelen Jobs (Entscheid Fabian 13.11.2026, vorher ein Job mit 22 min): Klassen
  # mit eigenem Quarkus-Start (Profil, Main-Test) tragen genau eine Startgruppe @Tag("start-1") oder @Tag("start-2"),
  # alle anderen keine (StartGruppenTest). «testzahl» prüft, dass jede Testklasse in genau einem Job lief. Das Artefakt
  # für Browser-Szenarien und Docker baut «build» ohne Tests; lokal deckt «mvn verify» weiterhin alles in einem Lauf ab.
  build:
    name: Build (Quinoa, OpenAPI, Liquibase, Drive-Import)
    if: needs.art.outputs.nur-spec != 'true'
    needs: art
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Bestehende Liquibase-Changesets unverändert
        env:
          BASIS: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          .github/scripts/pruefe-liquibase-test.sh
          .github/scripts/pruefe-liquibase.sh "$BASIS"

      - name: Frontend-Abhängigkeiten
        working-directory: frontend
        run: npm ci

      - name: Build über Quinoa (ohne Tests, die laufen in den Backend-Jobs)
        run: mvn -B -ntp -f backend/pom.xml package -Dmaven.test.skip=true

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: quarkus-app
          path: backend/target/quarkus-app/
          retention-days: 3

      - name: OpenAPI und generierter Client aktuell
        working-directory: frontend
        run: |
          npm run api:generieren > /dev/null
          if [ -n "$(git status --porcelain -- openapi src/app/gemeinsam/api)" ]; then
            echo "OpenAPI oder generierter Client veraltet; lokal bauen und 'npm run api:generieren' ausführen:"
            git status --porcelain -- openapi src/app/gemeinsam/api
            exit 1
          fi

      - name: Drive-Import-Werkzeug (mvn verify, Unit-Tests, SpotBugs)
        run: mvn -B -ntp -f tools/drive_import/pom.xml verify

  backend:
    name: Backend-Tests (Szenarien, JUnit, ArchUnit, SpotBugs)
    if: needs.art.outputs.nur-spec != 'true'
    needs: art
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      # Quinoa baut die PWA im Job «build»; hier nur verify ohne die Klassen mit eigenem Start
      - name: mvn verify (Cucumber, JUnit, ArchUnit, Abdeckung @req, SpotBugs) ohne Startgruppen
        run: mvn -B -ntp -f backend/pom.xml verify -DexcludedGroups=start-1,start-2 -Dquarkus.quinoa=false
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: surefire-backend
          path: backend/target/surefire-reports/TEST-*.xml
          retention-days: 3

  starttests:
    name: Backend-Starttests (${{ matrix.gruppe }})
    if: needs.art.outputs.nur-spec != 'true'
    needs: art
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # Gruppenliste synchron halten mit -DexcludedGroups (Job backend), den Argumenten der Testzahl-Prüfung und
        # GRUPPEN in StartGruppenTest
        gruppe: [start-1, start-2]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: mvn test (nur Startgruppe ${{ matrix.gruppe }})
        env:
          GRUPPE: ${{ matrix.gruppe }}
        run: mvn -B -ntp -f backend/pom.xml test -Dgroups="$GRUPPE"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: surefire-${{ matrix.gruppe }}
          path: backend/target/surefire-reports/TEST-*.xml
          retention-days: 3

  testzahl:
    name: Backend-Tests vollständig (jede Klasse genau einmal)
    if: needs.art.outputs.nur-spec != 'true'
    needs: [art, backend, starttests]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: surefire-*
          path: berichte
      - run: |
          python3 .github/scripts/pruefe-testaufteilung.py backend/src/test/java backend=berichte/surefire-backend \
            start-1=berichte/surefire-start-1 start-2=berichte/surefire-start-2

  frontend:
    name: Frontend (ng test)
    if: needs.art.outputs.nur-spec != 'true'
    needs: art
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - working-directory: frontend
        run: npm ci
      - name: npm audit (Laufzeit-Abhängigkeiten)
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high
      - working-directory: frontend
        run: npx ng test --watch=false
      - name: Generator-Client (tools/archiv_client.py, unittest)
        run: python3 -m unittest tools/test_archiv_client.py
      - name: Lastskripte (tools/last, unittest)
        run: python3 -m unittest tools/last/test_last.py

  browser:
    name: Browser-Szenarien (Cucumber.js, Playwright)
    if: needs.art.outputs.nur-spec != 'true'
    needs: [art, build]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: quarkus-app
          path: backend/target/quarkus-app/
      - working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
      # Die Upload-Szenarien (Aufgabe 2.4) laufen gegen das echte Archiv im Testmodus: Dev Services (PostgreSQL,
      # Keycloak mit Test-Realm, MinIO), synthetische Dateien. Es schreibt backend/target/browser-backend.json, sobald
      # es bereit ist, und hält, bis backend/target/browser-backend.stop erscheint (BrowserBackendTest).
      - name: Echtes Archiv für die Upload-Szenarien starten (BrowserBackendTest)
        run: |
          mvn -B -ntp -f backend/pom.xml test -Dtest=BrowserBackendTest -Darchiv.browser-backend=true \
            -Dsurefire.failIfNoSpecifiedTests=false -Dquarkus.quinoa.enabled=false \
            -Dquarkus.test.hang-detection-timeout=PT2H > "$RUNNER_TEMP/browser-backend.log" 2>&1 &
          for _ in $(seq 1 900); do
            test -f backend/target/browser-backend.json && exit 0
            sleep 1
          done
          echo "Echtes Archiv nicht bereit"
          tail -n 50 "$RUNNER_TEMP/browser-backend.log"
          exit 1
      - name: Archiv starten
        env:
          # ohne Datenbank (Readiness DOWN): seit Aufgabe 1.3 gibt es Entitäten, die Persistence Unit muss mit aus.
          # prod verlangt seit Aufgabe 1.9 eine Adresse der Datenbank (sonst Abbruch); hier eine nie erreichte
          # Platzhalter-Adresse und die Datasource ausdrücklich aus
          QUARKUS_HIBERNATE_ORM_ACTIVE: 'false'
          QUARKUS_DATASOURCE_ACTIVE: 'false'
          QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://localhost:1/keine-datenbank
          # ohne Keycloak beendet sich das Archiv sonst nach 5 Minuten mit Exit-Code 75 (OIDC-Wächter)
          ARCHIV_OIDC_WAECHTER_FRIST: PT60M
          # prod nutzt /var/lib/archiv/arbeit (im Image angelegt, Volume archiv_arbeit); auf dem Runner darf der
          # Prozess es nicht anlegen, und der Start bricht ab (PR #55). Hier ein Verzeichnis des Runners
          ARCHIV_ARBEIT_VERZEICHNIS: ${{ runner.temp }}/arbeit
          # prod startet ohne Zeitstempeldienst nicht (Req 15.3, Aufgabe 5.2); dieselben Dienste wie in compose.yml.
          # Ohne Datenbank plant der Worker keine Manifeste, es geht also keine Anfrage an die Dienste
          ARCHIV_TSA_DIENSTE: sgpki,freetsa
        # Secret-Dateien wie in prod, nur mit Platzhaltern, keine echten Zugangsdaten: ohne eine der Dateien
        # bricht der Start ab (design.md, Abschnitt zu Konfiguration und Geheimnissen). Dieses Archiv liefert nur die
        # PWA aus; die Uploads leiten die Szenarien an das echte Archiv im Testmodus weiter (frontend/e2e/schritte/upload.mjs)
        run: |
          DATEIEN="$RUNNER_TEMP/secret-dateien"
          mkdir -p "$DATEIEN"
          for datei in archiv_db_app archiv_db_owner s3_app_zugang_id s3_app_zugang_geheimnis infomaniak_ai_token archiv_manifest_key; do
            printf 'ci-platzhalter' > "$DATEIEN/$datei"
          done
          # Log in eine Datei; bei einem Fehler die letzten 80 Zeilen (nur Platzhalter, keine echten Geheimnisse)
          java -Dsmallrye.config.source.file.locations="$DATEIEN" -jar backend/target/quarkus-app/quarkus-run.jar \
            > "$RUNNER_TEMP/archiv.log" 2>&1 &
          PID=$!
          for _ in $(seq 1 60); do
            curl -sf http://localhost:8080/q/health/live > /dev/null && exit 0
            kill -0 "$PID" 2> /dev/null || break
            sleep 1
          done
          echo "Archiv nicht gestartet"
          tail -n 80 "$RUNNER_TEMP/archiv.log"
          exit 1
      - working-directory: frontend
        run: npx cucumber-js
      - name: Echtes Archiv beenden
        if: always()
        run: touch backend/target/browser-backend.stop

  docker:
    name: Docker-Image (nur bauen)
    if: needs.art.outputs.nur-spec != 'true'
    needs: [art, build]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: quarkus-app
          path: backend/target/quarkus-app/
      - run: docker build -f backend/src/main/docker/Dockerfile.jvm -t urinet-archiv:ci backend
