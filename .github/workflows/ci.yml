# CI für jeden PR und main (tech.md, Tests und Qualität; Aufgabe 1.1). Baut nur, pusht kein Image (Deploy folgt mit 1.9).
# Req 16.7: kein Secret, keine echten Belege, kein Golden-Lauf, kein echter KI-Aufruf (Tests nur gegen WireMock auf
# localhost); Logs nennen nur IDs und Dateipfade.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend:
    name: Backend (mvn verify, Quinoa-Build, Prüfungen)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Bestehende Liquibase-Changesets unverändert
        env:
          BASIS: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          .github/scripts/pruefe-liquibase-test.sh
          .github/scripts/pruefe-liquibase.sh "$BASIS"

      - name: Frontend-Abhängigkeiten
        working-directory: frontend
        run: npm ci

      - name: mvn verify (Cucumber, JUnit, ArchUnit, Abdeckung @req) und Build über Quinoa
        run: mvn -B -ntp -f backend/pom.xml verify

      - name: OpenAPI und generierter Client aktuell
        working-directory: frontend
        run: |
          npm run api:generieren > /dev/null
          if [ -n "$(git status --porcelain -- openapi src/app/gemeinsam/api)" ]; then
            echo "OpenAPI oder generierter Client veraltet; lokal bauen und 'npm run api:generieren' ausführen:"
            git status --porcelain -- openapi src/app/gemeinsam/api
            exit 1
          fi

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: quarkus-app
          path: backend/target/quarkus-app/
          retention-days: 3

  frontend:
    name: Frontend (ng test)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - working-directory: frontend
        run: npm ci
      - name: npm audit (Laufzeit-Abhängigkeiten)
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high
      - working-directory: frontend
        run: npx ng test --watch=false

  browser:
    name: Browser-Szenarien (Cucumber.js, Playwright)
    needs: backend
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: quarkus-app
          path: backend/target/quarkus-app/
      - working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Archiv starten
        run: |
          java -jar backend/target/quarkus-app/quarkus-run.jar > /dev/null 2>&1 &
          for i in $(seq 1 60); do
            curl -sf http://localhost:8080/q/health/live > /dev/null && exit 0
            sleep 1
          done
          echo "Archiv nicht gestartet"
          exit 1
      - working-directory: frontend
        run: npx cucumber-js

  docker:
    name: Docker-Image (nur bauen)
    needs: backend
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: quarkus-app
          path: backend/target/quarkus-app/
      - run: docker build -f backend/src/main/docker/Dockerfile.jvm -t urinet-archiv:ci backend
