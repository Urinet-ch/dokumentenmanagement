# UriNet Archiv – Backend (tech.md). Profile: dev, test, prod und lokal (nur Entwicklerrechner, ADR-012).

# Laufarten (tech.md, Stack): api, worker oder beide; Stufe A: beide in einem Container
archiv.rolle=api,worker

# PWA über Quinoa im selben Artefakt (Req 16.1)
quarkus.quinoa.ui-dir=../frontend
quarkus.quinoa.build-dir=dist/frontend/browser
quarkus.quinoa.enable-spa-routing=true
quarkus.quinoa.ignored-path-prefixes=/api,/q
quarkus.quinoa.package-manager-install=false
quarkus.quinoa.package-manager-command.install=ci
# Unit- und Szenario-Tests ohne Frontend-Build; die PWA prüfen Cucumber.js + Playwright gegen den Prod-Build
%test.quarkus.quinoa=false

# REST unter /api/v1 (tech.md, Konventionen Backend); OpenAPI-Datei für den generierten Client (design.md, Frontend)
quarkus.rest.path=/api/v1
quarkus.smallrye-openapi.info-title=UriNet Archiv API
quarkus.smallrye-openapi.info-version=v1
quarkus.smallrye-openapi.store-schema-directory=../frontend/openapi
# ohne umgebungsabhängige Server-Einträge, damit die CI-Prüfung «OpenAPI aktuell» stabil bleibt
quarkus.smallrye-openapi.auto-add-server=false
# Probe-Endpunkte aus src/test (Aufgabe 1.4) gehören nicht in die OpenAPI-Datei des Clients
mp.openapi.scan.exclude.packages=ch.urinet.archiv.probe
# frei strukturiertes JSON (z. B. zusatzSchema der Dokumentarten) als Objekt, nicht als Jackson-Klasse JsonNode
mp.openapi.schema.com.fasterxml.jackson.databind.JsonNode={"name":"JsonObjekt","type":"object"}
# feste Discovery-URL statt der Dev-Services-Adresse, damit die Datei in jeder Umgebung gleich ist
quarkus.smallrye-openapi.oidc-open-id-connect-url=https://archiv-auth.apps.urinet.ch/realms/urinet-archiv/.well-known/openid-configuration

# Persistenz: PostgreSQL, Schema nur über Liquibase, Hibernate prüft nur (Req 1.7, tech.md Regel 11)
quarkus.datasource.db-kind=postgresql
quarkus.hibernate-orm.schema-management.strategy=validate
# Schema pro Mandant (ADR-002, Aufgabe 1.4): Tenant-ID = Schemaname aus dem Token-Claim mandant (MandantTenantResolver).
# Der Start prüft nur die qualifizierten Tabellen in public; die Mandanten-Tabellen prüft MandantMigration je Schema
# nach der Migration (MandantSchemaFilter, design.md «Mandant»)
quarkus.hibernate-orm.multitenant=SCHEMA
quarkus.hibernate-orm.unsupported-properties."hibernate.hbm2ddl.schema_filter_provider"=ch.urinet.archiv.mandant.adapter.out.persistence.MandantSchemaFilter
quarkus.liquibase.change-log=db/public/changelog.xml
quarkus.liquibase.migrate-at-start=true
# Dev Services: PostgreSQL 17 mit pgvector (design.md, Testing Strategy)
quarkus.datasource.devservices.image-name=pgvector/pgvector:0.8.7-pg17-trixie
# Readiness DOWN, solange die Datenbank fehlt (Agroal-Health-Check)
quarkus.datasource.health.enabled=true
# DB-Rollen (design.md «Secrets und Konfiguration»): archiv_app für die App, archiv_owner nur für Liquibase und
# das Anlegen der Mandanten-Schemas; Passwörter nur als Dateien unter /run/secrets (tech.md Regel 7). Jede Datei ist
# ein Schlüssel (smallrye-config-source-file-system), ohne Default
archiv.db.app-rolle=archiv_app
%prod.smallrye.config.source.file.locations=/run/secrets
# Adresse der Datenbank ohne Default (Aufgabe 1.9): kommt aus QUARKUS_DATASOURCE_JDBC_URL (deploy/infomaniak/compose.yml).
# Fehlt sie, bricht der Start ab (DatenbankAdressePruefung), statt mit still abgeschalteter Datasource zu laufen. Keine
# Abbildung hier, sonst startet in den prod-Tests der DB-Devservice nicht.
%prod.archiv.db.url-pflicht=true
%prod.quarkus.datasource.username=archiv_app
%prod.quarkus.datasource.password=${archiv_db_app}
%prod.quarkus.liquibase.username=archiv_owner
%prod.quarkus.liquibase.password=${archiv_db_owner}
# Fail closed (SecretPruefung, schon beim Lesen der Zugänge vor Liquibase): Fehlt eine dieser Dateien, ist sie leer oder
# übersteuert eine Umgebungsvariable den Zugang, bricht der Start ab; ein fehlendes optionales
# Passwort allein hielte den Start nicht auf. archiv_db_owner nur, wenn beim Start migriert wird (api, kommando; nicht
# der Worker)
%prod.archiv.secrets.pflicht=archiv_db_app,s3_app_zugang_id,s3_app_zugang_geheimnis
%prod.archiv.secrets.pflicht-migration=archiv_db_owner

# Anmeldung über Keycloak (OIDC, Req 2.1); die API prüft nur Bearer-Tokens, Rollen aus realm_access
quarkus.oidc.application-type=service
quarkus.oidc.client-id=archiv-api
# nur Tokens für die API annehmen (Audience-Mapper in archiv-pwa)
quarkus.oidc.token.audience=archiv-api
%prod.quarkus.oidc.auth-server-url=https://archiv-auth.apps.urinet.ch/realms/urinet-archiv
# Keycloak gehört zur Readiness (entschieden von Fabian am 11.11.2026, PR #42 P42-1; design.md «Betrieb auf der VPS»):
# Ein falsch konfiguriertes oder fehlendes Keycloak macht die API unhealthy, der Deploy-Workflow rollt zurück. Ohne
# Keycloak antwortet die API 401 (OidcNichtErreichbarTest). War Keycloak beim Start nicht erreichbar (Neustart der VPS),
# bleibt der Tenant «Not Ready», bis eine angemeldete Anfrage ihn neu aufbaut; darum beendet sich die API, wenn er die
# Frist lang nicht bereit ist (Exit-Code 75, OidcBereitschaftWaechter), und Docker startet sie neu. Frist mindestens
# 1 min (Schleifenschutz); im Test ohne Takt, die Tests rufen den Wächter selbst
quarkus.oidc.health.enabled=true
archiv.oidc.waechter.frist=5m
archiv.oidc.waechter.intervall=15s
# Zeitlimit je Prüfung des Wächters (Review PR #42, Runde 2, K1); kürzer als das Intervall
archiv.oidc.waechter.zeitlimit=10s
%test.archiv.oidc.waechter.intervall=off
# Grenzen der Anfrage (design.md «Upload», Aufgabe 2.4): Uploads (multipart) höchstens archiv.upload.max-anfrage
# (Startwert 500 MB, Req 3.1 «mehrere in einem Vorgang»), je Datei archiv.upload.max-datei (Req 3.6); alle anderen
# Anfragen höchstens archiv.http.max-anfrage (bisheriger Standard von Quarkus). Quarkus selbst prüft nur die grösste
# Grenze; die kleinere für Anfragen ohne multipart prüft ProblemFehlerRoute am Content-Length
archiv.upload.max-datei=50M
archiv.upload.max-anfrage=500M
archiv.http.max-anfrage=10M
quarkus.http.limits.max-body-size=${archiv.upload.max-anfrage}
# Teile eines Uploads liegen als temporäre Dateien auf der Platte (nie ganz im Heap, Speicherbudget Stufe A) und werden
# am Ende jeder Anfrage gelöscht, auch im Fehlerfall; /tmp ist im Container beschreibbar (read_only, tmpfs)
quarkus.http.body.uploads-directory=${java.io.tmpdir}/archiv-upload
quarkus.http.body.delete-uploaded-files-on-end=true
# Zeitgrenze der Upload-Transaktion in Sekunden (Sperre der Prüfsumme bis zum Commit, Ablage aller Dateien in S3)
archiv.upload.transaktion-zeitgrenze=600
# Kleine Grenze nur im Testprofil (Problem Details für 413); Uploads bis 60 MB, damit eine Datei über 50 MB 413 je Datei
# ergibt und eine grössere Anfrage 413 für die ganze Anfrage
%test.archiv.http.max-anfrage=1M
%test.archiv.upload.max-anfrage=60M
quarkus.http.auth.permission.api.paths=/api/*
quarkus.http.auth.permission.api.policy=authenticated
# Rollen nur aus den Realm-Rollen (Req 2.2); Endpunkte ohne Sicherheits-Annotation sind gesperrt (fail closed, Aufgabe 1.4)
quarkus.oidc.roles.role-claim-path=realm_access/roles
# Benutzer-ID = Keycloak-ID (sub), nie der Benutzername: erstellt_von und person_benutzer steuern die Sichtbarkeit von
# PERSONAL, ein Benutzername kann neu vergeben werden (design.md «Sicherheit»); der Benutzername dient nur zur Anzeige
quarkus.oidc.token.principal-claim=sub
quarkus.security.jaxrs.deny-unannotated-endpoints=true
# API-Tokens (Req 2.5): jede Prüfung und jedes Anlegen rechnet Argon2id mit 19 MiB Heap. Höchstens so viele Rechnungen
# gleichzeitig (zählt zum Speicherbudget der Stufe A: 2 × 19 MiB); wer nach der Wartezeit keinen Platz hat, erhält 503
# UEBERLASTET ohne Argon2. Wartezeit 0 heisst nicht warten; negativ oder weniger als 1 Platz bricht den Start ab
archiv.api-token.parallele-pruefungen=2
archiv.api-token.wartezeit=200ms
# Auftragsschlange (Aufgabe 2.5, design.md «Verarbeitung», ADR-003): Plätze des Workers (Stufe A: 1, Speicherbudget),
# Takt des Pollers, Lebenszeichen (Req 5.7) und Aufräumer; im Test ohne Takt, die Tests rufen Poller und Aufräumer selbst
archiv.worker.parallel=2
archiv.worker.intervall=2s
archiv.auftrag.lebenszeichen=30s
archiv.auftrag.aufraeumen-intervall=1m
# Herunterfahren: so lange wartet der Worker auf unterbrochene Handler, bevor er stoppt (unter der Stopp-Frist von
# Docker, 10 s); ein rechtzeitig beendeter Auftrag geht ohne Versuch zurück auf OFFEN
archiv.worker.stopp-frist=5s
%test.archiv.worker.intervall=off
%test.archiv.auftrag.aufraeumen-intervall=off
%test.archiv.auftrag.lebenszeichen=200ms
# Zeitgrenze je Auftragstyp (Req 5.6, Startwerte aus design.md, nach K5 zu prüfen); ohne Zeitgrenze startet kein Handler
archiv.auftrag.zeitgrenze.VERARBEITEN=10m
archiv.auftrag.zeitgrenze.KI_VORSCHLAG=3m
archiv.auftrag.zeitgrenze.ARCHIVIEREN=5m
archiv.auftrag.zeitgrenze.CSV_VORSCHAU=5m
archiv.auftrag.zeitgrenze.CSV_UEBERNEHMEN=10m
archiv.auftrag.zeitgrenze.MANIFEST=15m
archiv.auftrag.zeitgrenze.PRUEFLAUF=30m
archiv.auftrag.zeitgrenze.WISSEN_INGEST=3m
archiv.auftrag.zeitgrenze.WISSEN_LINT=3m
archiv.auftrag.zeitgrenze.WISSEN_EMBEDDING=10m
archiv.auftrag.zeitgrenze.WISSEN_EMBEDDING_ALLE=30m
archiv.auftrag.zeitgrenze.WISSEN_EXPORT=15m
# Zusatz-Schemas der Dokumentarten (Req 9.5): Rechenzeit je Prüfung zusammen (Schlüsselwörter, Kompilieren und
# Suchen regulärer Ausdrücke, auch format: regex); danach 422 ZUSATZ_UNGUELTIG (Schutz gegen ReDoS). 0 oder negativ bricht den Start ab
archiv.dokumentart.muster-zeitgrenze=50ms
# OCR-Adapter (Aufgabe 2.6, design.md «Verarbeitung»): Zeitbudget eines Laufs unter der Zeitgrenze von VERARBEITEN
# (OcrPruefung), ocrmypdf --jobs (Stufe A 1, seitenweise), Arbeitsverzeichnis je Lauf (danach gelöscht), PATH der
# Werkzeuge im Image (Dockerfile.jvm, Stufe «werkzeuge»)
archiv.ocr.zeitgrenze=8m
archiv.ocr.jobs=1
archiv.ocr.arbeitsverzeichnis=/tmp/archiv-ocr
archiv.ocr.pfad=/usr/local/bin:/usr/bin:/bin
# Tests und Profil lokal: Werkzeuge per docker run im Image der Stufe «werkzeuge» (backend/README.md); in prod
# abgelehnt. Das Arbeitsverzeichnis liegt unter dem Projekt bzw. Home, weil Colima /var/folders nicht einbindet
%test.archiv.ocr.container-image=urinet-archiv-werkzeuge:test
%test.archiv.ocr.arbeitsverzeichnis=${user.dir}/target/ocr-arbeit
%lokal.archiv.ocr.container-image=urinet-archiv-werkzeuge:lokal
%lokal.archiv.ocr.arbeitsverzeichnis=${user.home}/.cache/urinet-archiv/ocr
# Dev Services: Keycloak mit dem Test-Realm (Export plus Testbenutzer, deploy/keycloak/)
quarkus.keycloak.devservices.image-name=quay.io/keycloak/keycloak:26.8.2
quarkus.keycloak.devservices.realm-name=urinet-archiv
quarkus.keycloak.devservices.realm-path=../deploy/keycloak/realm-test.json
# Fester Port nur in dev: die PWA im Dev-Build meldet sich dort an (frontend/src/umgebung/umgebung.development.ts)
%dev.quarkus.keycloak.devservices.port=8180

# Ablage im Object Storage von Infomaniak (design.md, Ablage)
quarkus.s3.endpoint-override=https://s3.gva2.infomaniak.cloud
quarkus.s3.path-style-access=true
quarkus.s3.aws.region=gva2
quarkus.s3.aws.credentials.type=static
# App-Schlüssel nur als Secret-Dateien unter /run/secrets, ohne Default (Pflicht in archiv.secrets.pflicht)
%prod.quarkus.s3.aws.credentials.static-provider.access-key-id=${s3_app_zugang_id}
%prod.quarkus.s3.aws.credentials.static-provider.secret-access-key=${s3_app_zugang_geheimnis}
quarkus.s3.sync-client.type=url
# Obergrenze je S3-Aufruf inkl. Wiederholungen (Aufgabe 2.6): Der URL-Client reagiert nicht auf Thread-Unterbrechung,
# ein hängender Aufruf hielte sonst den Worker-Platz über die Zeitgrenze des Auftrags hinaus
quarkus.s3.api-call-timeout=2m
# Bucket je Mandant: <Präfix><code>; Stufe A setzt urinet-archiv-a- (Req 6.11, entschieden 09.11.2026)
archiv.ablage.bucket-praefix=urinet-archiv-
# Entwicklung und Tests: MinIO aus compose-devservices.yml (Port und Zugang setzen die Compose-Labels)
%dev,test.quarkus.s3.endpoint-override=http://localhost:${archiv.entwicklung.minio-port}
%dev,test.quarkus.s3.aws.region=us-east-1
# Bypass-Header nie (Req 6.5): BypassVerbot lehnt jeden Aufruf damit ab, in allen Profilen; ohne BypassVerbot am Client
# bricht S3Ablage beim ersten Zugriff ab
quarkus.s3.interceptors=ch.urinet.archiv.ablage.adapter.out.s3.BypassVerbot
# Tests: KeinBypassInterceptor hält zusätzlich jeden Versuch fest (Nachweis JUnit) und steht darum vorne; S3Stoerung
# simuliert auf Abruf einen Ausfall beim Upload (Req 3, design.md «Umsetzung 2.4»), S3Verzoegerung einen langsamen
# Object Storage beim Auflisten von Versionen (Review PR #54, S2)
%test.quarkus.s3.interceptors=ch.urinet.archiv.ablage.KeinBypassInterceptor,ch.urinet.archiv.ablage.S3Stoerung,ch.urinet.archiv.ablage.S3Verzoegerung,ch.urinet.archiv.ablage.adapter.out.s3.BypassVerbot
# Sperren (Req 6.11, tasks.md 2.3): manifest/ Standard COMPLIANCE ohne Höchstfrist; die Stufe kommt aus archiv.stufe
# (A | B), ohne Wert gilt B, und ab Stufe B bricht der Start bei abweichenden Werten ab (AblageStufenPruefung).
# Tests und lokale Entwicklung laufen wie Stufe A mit kurzen Fristen, damit Test-Buckets löschbar bleiben.
archiv.ablage.manifest-sperrmodus=COMPLIANCE
# vorsignierte Download-URL: höchstens 5 Minuten (Req 14.6)
archiv.ablage.url-gueltigkeit=PT5M
%dev,test.archiv.stufe=A
%dev,test.archiv.ablage.max-sperrfrist=P1D
%dev,test.archiv.ablage.manifest-sperrmodus=GOVERNANCE
%dev,test.archiv.ablage.manifest-max-sperrfrist=P1D

# E-Mail (Benachrichtigungen); Entwicklung und Tests gegen Mailpit aus compose-devservices.yml
%dev,test.quarkus.mailer.mock=false
%dev,test.quarkus.mailer.host=localhost
%dev,test.quarkus.mailer.from=archiv@example.invalid

# Dev-Stubs der Driven Ports (design.md, KI; ADR-011): Schalter zur Laufzeit, Stubs nur im Profil dev (lokal erbt
# davon, schaltet KI und OCR aber aus)
archiv.ablage.stub=false
archiv.ki.stub=false
archiv.ocr.stub=false
archiv.integration.stub=false
%dev.archiv.ablage.stub=true
%dev.archiv.ki.stub=true
%dev.archiv.ocr.stub=true
%dev.archiv.integration.stub=true
# Embeddings und Reranker (Ports folgen mit Spec 02): Schalter wie das Sprachmodell, im Profil lokal immer Stub
archiv.ki.embedding-stub=${archiv.ki.stub}
archiv.ki.reranker-stub=${archiv.ki.stub}

# KI nur über Infomaniak AI Services (tech.md Regel 6); Token als Secret-Datei folgt mit dem KI-Port (Welle 3)
archiv.ki.product-id=113354
archiv.ki.basis-url=https://api.infomaniak.com/2/ai/${archiv.ki.product-id}/openai/v1
archiv.ki.erfassung-modell=google/gemma-4-31B-it
archiv.ki.chat-modell=mistralai/Mistral-Small-4-119B-2603
archiv.ki.embedding-modell=bge_multilingual_gemma2
archiv.ki.reranker-modell=BAAI/bge-reranker-v2-m3
archiv.ki.reranker-url=https://api.infomaniak.com/2/ai/${archiv.ki.product-id}/cohere/v2/rerank
# Tests nur gegen WireMock auf localhost (Req 16.7, 16.21); die WireMock-Testressource (Welle 3) setzt den Port,
# bis dahin fester Wert; KiBasisUrlPruefung lässt in test nur diesen Port zu, nie 1234 (LM Studio)
%test.archiv.ki.wiremock-port=8089
%test.archiv.ki.basis-url=http://localhost:${archiv.ki.wiremock-port}/v1
%test.archiv.ki.reranker-url=http://localhost:${archiv.ki.wiremock-port}/cohere/v2/rerank
quarkus.langchain4j.openai.base-url=${archiv.ki.basis-url}
quarkus.langchain4j.openai.chat-model.model-name=${archiv.ki.erfassung-modell}
# nie Inhalte loggen (Req 16.7)
quarkus.langchain4j.openai.log-requests=false
quarkus.langchain4j.openai.log-responses=false

# Profil lokal (Req 16.20–16.22, ADR-012, design.md «KI», Profil lokal): nur Entwicklerrechner, Sprachmodell in
# LM Studio an localhost; Start mit mvn quarkus:dev -Dquarkus.profile=lokal (backend/README.md). Nie in CI, Stufe A/B
# oder Produktion; lokal zusammen mit prod bricht den Start ab (KiBasisUrlPruefung)
# erbt von dev: Dev Services, Stubs für Ablage und Integration
%lokal.quarkus.config.profile.parent=dev
# Dev-Stub von KiPort für das Sprachmodell aus
%lokal.archiv.ki.stub=false
# echter OCR-Adapter (OCRmyPDF als lokales Docker-Image, archiv.ocr.container-image oben), ab Aufgabe 2.6 (Req 7.1)
%lokal.archiv.ocr.stub=false
# LM Studio, Port beim Start ausdrücklich gesetzt (lms server start --port 1234)
%lokal.archiv.ki.basis-url=http://localhost:1234/v1
# Name aus lms load <model_key> --identifier archiv-lokal
%lokal.archiv.ki.chat-modell=archiv-lokal
%lokal.archiv.ki.erfassung-modell=archiv-lokal
# Embeddings und Reranker als Stub ohne Vektoren; kein Infomaniak-Token, keine Produkt-ID, keine Reranker-URL
%lokal.archiv.ki.embedding-stub=true
%lokal.archiv.ki.reranker-stub=true
%lokal.archiv.ki.product-id=
%lokal.archiv.ki.reranker-url=

# Logging: nur IDs, nur in prod als JSON (quarkus-logging-json schaltet es sonst in allen Profilen ein)
quarkus.log.console.json.enabled=false
%prod.quarkus.log.console.json.enabled=true
# Keine Werte im Log (Req 16.7): Hibernate loggt bei Constraint-Verstössen «Key (code)=(<Wert>)», Narayana den Fehler
# samt Ursache, der OIDC-Provider bei ungültiger Signatur das ganze Token (Name, E-Mail, Mandant). Die Fehler selbst
# kommen als Ausnahme an und werden als Problem Details mit Fehler-ID geloggt, dazu die Klassen der Ursachen-Kette und
# der SQLState (ProblemAntwort). Ein @LoggingFilter ersetzt die Drosselung nicht: Er sieht die Werte auch in den
# Meldungen der angehängten Ausnahmen und könnte sie nur samt Stacktrace verwerfen.
quarkus.log.category."org.hibernate.orm.jdbc.error".level=OFF
quarkus.log.category."org.hibernate.engine.jdbc.spi.SqlExceptionHelper".level=OFF
quarkus.log.category."com.arjuna".level=ERROR
quarkus.log.category."io.quarkus.oidc.runtime.OidcProvider".level=ERROR
