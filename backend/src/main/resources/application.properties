# UriNet Archiv – Backend (tech.md). Profile: dev, test, prod; «lokal» folgt mit 1.11.

# Laufarten (tech.md, Stack): api, worker oder beide; Stufe A: beide in einem Container
archiv.rolle=api,worker

# PWA über Quinoa im selben Artefakt (Req 16.1)
quarkus.quinoa.ui-dir=../frontend
quarkus.quinoa.build-dir=dist/frontend/browser
quarkus.quinoa.enable-spa-routing=true
quarkus.quinoa.ignored-path-prefixes=/api,/q
quarkus.quinoa.package-manager-install=false
quarkus.quinoa.package-manager-command.install=ci
# Unit- und Szenario-Tests ohne Frontend-Build; die PWA prüfen Cucumber.js + Playwright gegen den Prod-Build
%test.quarkus.quinoa=false

# REST unter /api/v1 (tech.md, Konventionen Backend); OpenAPI-Datei für den generierten Client (design.md, Frontend)
quarkus.rest.path=/api/v1
quarkus.smallrye-openapi.info-title=UriNet Archiv API
quarkus.smallrye-openapi.info-version=v1
quarkus.smallrye-openapi.store-schema-directory=../frontend/openapi
# ohne umgebungsabhängige Server-Einträge, damit die CI-Prüfung «OpenAPI aktuell» stabil bleibt
quarkus.smallrye-openapi.auto-add-server=false
# Security-Schema kommt mit Keycloak (1.2); ohne OIDC-URL wäre das automatische Schema ungültig
quarkus.smallrye-openapi.auto-add-security=false

# Persistenz: PostgreSQL, Schema nur über Liquibase, Hibernate prüft nur (Req 1.7, tech.md Regel 11)
quarkus.datasource.db-kind=postgresql
# Bis 1.2 ohne Datenbank: Datasource ausdrücklich inaktiv, damit Health und Liquibase nichts Falsches melden
quarkus.datasource.active=false
quarkus.hibernate-orm.schema-management.strategy=validate
quarkus.liquibase.change-log=db/public/changelog.xml
quarkus.liquibase.migrate-at-start=true
# Dev Services (PostgreSQL 17 + pgvector, Keycloak) folgen mit 1.2
quarkus.devservices.enabled=false

# Anmeldung über Keycloak (OIDC) folgt mit 1.2
quarkus.oidc.tenant-enabled=false

# KI nur über Infomaniak AI Services (tech.md Regel 6); Token als Secret-Datei folgt mit dem KI-Port (Welle 3)
archiv.ki.product-id=113354
archiv.ki.basis-url=https://api.infomaniak.com/2/ai/${archiv.ki.product-id}/openai/v1
archiv.ki.erfassung-modell=google/gemma-4-31B-it
archiv.ki.chat-modell=mistralai/Mistral-Small-4-119B-2603
archiv.ki.embedding-modell=bge_multilingual_gemma2
archiv.ki.reranker-modell=BAAI/bge-reranker-v2-m3
archiv.ki.reranker-url=https://api.infomaniak.com/2/ai/${archiv.ki.product-id}/cohere/v2/rerank
# Tests nur gegen WireMock auf localhost (Req 16.7, 16.21)
%test.archiv.ki.basis-url=http://localhost:8089/v1
%test.archiv.ki.reranker-url=http://localhost:8089/cohere/v2/rerank
quarkus.langchain4j.openai.base-url=${archiv.ki.basis-url}
quarkus.langchain4j.openai.chat-model.model-name=${archiv.ki.erfassung-modell}
# nie Inhalte loggen (Req 16.7)
quarkus.langchain4j.openai.log-requests=false
quarkus.langchain4j.openai.log-responses=false

# Logging: nur IDs, nur in prod als JSON (quarkus-logging-json schaltet es sonst in allen Profilen ein)
quarkus.log.console.json.enabled=false
%prod.quarkus.log.console.json.enabled=true
