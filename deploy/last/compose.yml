name: archiv-last

x-haertung: &haertung
  restart: "no"
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges]

services:
  api:
    <<: *haertung
    image: ${LAST_API_IMAGE:?Freigegebenes Archiv-Image mit Digest einsetzen}
    user: "10001:10001"
    init: true
    mem_limit: 1024m
    cpus: 0.6
    tmpfs: [/tmp:size=16m]
    volumes:
      - arbeit:/var/lib/archiv/arbeit
    environment:
      QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://db:5432/archiv
      QUARKUS_DATASOURCE_JDBC_MAX_SIZE: "8"
      QUARKUS_OIDC_AUTH_SERVER_URL: http://last-kc:8080/realms/urinet-archiv
      ARCHIV_KEYCLOAK_ADMIN_URL: http://last-kc:8080
      ARCHIV_ROLLE: api,worker
      ARCHIV_WORKER_PARALLEL: "1"
      ARCHIV_STUFE: A
      ARCHIV_ABLAGE_BUCKET_PRAEFIX: ${LAST_BUCKET_PRAEFIX:-urinet-archiv-a-}
      ARCHIV_ABLAGE_MAX_SPERRFRIST: P1D
      ARCHIV_ABLAGE_MANIFEST_MAX_SPERRFRIST: P1D
      ARCHIV_ABLAGE_MANIFEST_SPERRMODUS: COMPLIANCE
      QUARKUS_S3_ENDPOINT_OVERRIDE: ${LAST_S3_ENDPOINT:?Infomaniak-Endpunkt einsetzen}
      QUARKUS_S3_AWS_REGION: ${LAST_S3_REGION:?Region einsetzen}
      ARCHIV_KI_STUB: "true"
      ARCHIV_OCR_STUB: "false"
      ARCHIV_ABLAGE_STUB: "false"
      ARCHIV_LAST_HISTOGRAMME: "true"
      ARCHIV_SECRETS_PFLICHT: archiv_db_app,s3_app_zugang_id,s3_app_zugang_geheimnis,archiv_manifest_key
      ARCHIV_MANIFEST_BEIM_START: "false"
      ARCHIV_MANIFEST_ZEITPLAN: "off"
      ARCHIV_TSA_DIENSTE: sgpki,freetsa
      MALLOC_ARENA_MAX: "2"
      JAVA_OPTS_APPEND: >-
        -Djava.util.logging.manager=org.jboss.logmanager.LogManager
        -Xmx384m -XX:MaxMetaspaceSize=192m -XX:ReservedCodeCacheSize=32m
        -Xss512k -XX:+UseSerialGC -XX:+ExitOnOutOfMemoryError
    secrets:
      - archiv_db_app
      - archiv_db_owner
      - s3_app_zugang_id
      - s3_app_zugang_geheimnis
      - archiv_manifest_key
      - archiv_data_key
      - namenssperre_salz
      - keycloak_verwaltung_secret
    networks: [intern, ausgang]
    depends_on:
      db: {condition: service_healthy}
      kc: {condition: service_healthy}
    healthcheck:
      test: [CMD, bash, -c, "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /q/health/ready HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n' >&3 && head -n1 <&3 | grep -q ' 200 '"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 120s

  db:
    <<: *haertung
    image: ${LAST_DB_IMAGE:?Freigegebenes Archiv-DB-Image mit Digest einsetzen}
    user: "999:999"
    mem_limit: 256m
    cpus: 0.3
    tmpfs:
      - /var/run/postgresql:size=1m,uid=999,gid=999,mode=0775
      - /tmp:size=16m
    environment:
      POSTGRES_PASSWORD_FILE: /run/secrets/archiv_db_postgres
    command: [postgres, -c, shared_buffers=24MB, -c, work_mem=2MB, -c, maintenance_work_mem=16MB, -c, max_connections=30, -c, effective_cache_size=64MB]
    secrets: [archiv_db_postgres, archiv_db_owner_scram, archiv_db_app_scram, keycloak_db_scram]
    volumes: [daten:/var/lib/postgresql/data]
    networks: [intern]
    healthcheck:
      test: [CMD, pg_isready, -U, postgres, -d, archiv, -h, 127.0.0.1]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s

  kc:
    <<: *haertung
    image: ${LAST_KC_IMAGE:?Freigegebenes Archiv-Keycloak-Image mit Digest einsetzen}
    user: "1000:1000"
    mem_limit: 768m
    cpus: 0.6
    tmpfs:
      - /tmp:size=32m
      - /opt/keycloak/data/tmp:size=32m,uid=1000,gid=1000,mode=0700
    environment:
      KC_DB_URL: jdbc:postgresql://db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_POOL_MAX_SIZE: "8"
      KC_HOSTNAME: http://last-kc:8080
      # Kein erreichbarer Host: vom Wrapper für Passkey-/Realm-Konfiguration benötigt.
      ARCHIV_BASIS_URL: https://archiv-last.invalid
      KC_HTTP_ENABLED: "true"
      KC_BOOTSTRAP_ADMIN_USERNAME: last-admin
      MALLOC_ARENA_MAX: "2"
      JAVA_OPTS: >-
        -XX:+UseSerialGC -Xms32m -Xmx96m -XX:MaxMetaspaceSize=160m
        -XX:TieredStopAtLevel=1 -XX:CICompilerCount=1 -XX:ReservedCodeCacheSize=32m
        -XX:MaxDirectMemorySize=32m -Xss512k -XX:+ExitOnOutOfMemoryError
    secrets: [keycloak_db, keycloak_admin, keycloak_smtp_passwort]
    networks:
      intern:
        aliases: [last-kc]
    depends_on:
      db: {condition: service_healthy}
    healthcheck:
      test: [CMD, bash, -c, "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n' >&3 && head -n1 <&3 | grep -q ' 200 '"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 180s

networks:
  intern:
    internal: true
  # Nur api: Ausgang zu Infomaniak, keine Ports, kein Traefik, keine andere App.
  ausgang: {}

volumes:
  daten:
    name: archiv_last_daten
  arbeit:
    name: archiv_last_arbeit

secrets:
  archiv_db_app: {file: "${LAST_SECRETS:?Geschützten Mess-Secrets-Pfad einsetzen}/archiv_db_app"}
  archiv_db_owner: {file: "${LAST_SECRETS:?}/archiv_db_owner"}
  archiv_db_postgres: {file: "${LAST_SECRETS:?}/archiv_db_postgres"}
  archiv_db_owner_scram: {file: "${LAST_SECRETS:?}/archiv_db_owner_scram"}
  archiv_db_app_scram: {file: "${LAST_SECRETS:?}/archiv_db_app_scram"}
  keycloak_db_scram: {file: "${LAST_SECRETS:?}/keycloak_db_scram"}
  keycloak_db: {file: "${LAST_SECRETS:?}/keycloak_db"}
  keycloak_admin: {file: "${LAST_SECRETS:?}/keycloak_admin"}
  keycloak_smtp_passwort: {file: "${LAST_SECRETS:?}/keycloak_smtp_passwort"}
  keycloak_verwaltung_secret: {file: "${LAST_SECRETS:?}/keycloak_verwaltung_secret"}
  s3_app_zugang_id: {file: "${LAST_SECRETS:?}/s3_app_zugang_id"}
  s3_app_zugang_geheimnis: {file: "${LAST_SECRETS:?}/s3_app_zugang_geheimnis"}
  archiv_manifest_key: {file: "${LAST_SECRETS:?}/archiv_manifest_key"}
  archiv_data_key: {file: "${LAST_SECRETS:?}/archiv_data_key"}
  namenssperre_salz: {file: "${LAST_SECRETS:?}/namenssperre_salz"}
