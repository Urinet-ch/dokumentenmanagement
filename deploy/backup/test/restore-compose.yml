services:
  db:
    image: pgvector/pgvector:0.8.7-pg17-trixie@sha256:89947206f52eac3a9df9b663df7e76987cbdc623be6576b3a524953d568700d7
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
      - archiv_db_owner
      - archiv_db_app
      - keycloak_db
    # Daten nur im tmpfs des Containers: «compose down» räumt sie mit weg, ohne Dateien fremder uid im Temp-Verzeichnis.
    tmpfs:
      - /var/lib/postgresql/data
    volumes:
      - ./restore-db-init.sh:/docker-entrypoint-initdb.d/10-restore-test.sh:ro
    networks: [intern, hostzugang]
    ports:
      - 127.0.0.1::5432
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 2s
      timeout: 2s
      retries: 60

  minio:
    image: cgr.dev/chainguard/minio:latest@sha256:59953701f8f8d0de81aab456f0b0b6c0a1804119415559bf7ede79d944108879
    command: ["server", "/tmp/daten"]
    environment:
      MINIO_ROOT_USER: archiv-dev
      MINIO_ROOT_PASSWORD: archiv-dev-zugang
    tmpfs:
      - /tmp/daten
    networks: [intern, hostzugang]
    ports:
      - 127.0.0.1::9000

  kc:
    image: archiv:restore-roundtrip-kc
    # Speichergrenze, damit drei JVMs in eine kleine Docker-VM passen (z. B. Colima mit 6 GB)
    mem_limit: 768m
    environment:
      JAVA_OPTS_KC_HEAP: -XX:MaxRAMPercentage=50 -XX:InitialRAMPercentage=25
      KC_DB: postgres
      KC_DB_URL_HOST: db
      KC_DB_URL_DATABASE: keycloak
      KC_DB_USERNAME: keycloak
      KC_BOOTSTRAP_ADMIN_USERNAME: archiv-admin
      KC_HOSTNAME: http://kc:8080
      KC_HOSTNAME_STRICT: "false"
      KC_HTTP_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"
    secrets:
      - keycloak_db
      - keycloak_admin
      - restore_oidc_password
      - restore_oidc_client
      - restore_oidc_user
    depends_on:
      db:
        condition: service_healthy
    networks: [intern]

  api:
    image: archiv:restore-roundtrip
    mem_limit: 768m
    environment:
      SMALLRYE_CONFIG_SOURCE_FILE_LOCATIONS: /run/secrets
      QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://db:5432/archiv
      QUARKUS_OIDC_AUTH_SERVER_URL: http://kc:8080/realms/urinet-archiv
      QUARKUS_S3_ENDPOINT_OVERRIDE: http://minio:9000
      QUARKUS_S3_AWS_REGION: us-east-1
      QUARKUS_HTTP_HOST: 0.0.0.0
      ARCHIV_ROLLE: api
      ARCHIV_STUFE: A
      ARCHIV_ABLAGE_BUCKET_PRAEFIX: urinet-archiv-a-
      ARCHIV_ABLAGE_MAX_SPERRFRIST: P1D
      ARCHIV_ABLAGE_MANIFEST_MAX_SPERRFRIST: P1D
      ARCHIV_ABLAGE_MANIFEST_SPERRMODUS: GOVERNANCE
      # Nur für die Startprüfung (TsaStartpruefung) wie im Deploy; ohne Internet (Netz intern) stempelt der Stack nicht.
      ARCHIV_TSA_DIENSTE: sgpki,freetsa
    secrets:
      - archiv_db_app
      - archiv_db_owner
      - s3_app_zugang_id
      - s3_app_zugang_geheimnis
      - infomaniak_ai_token
      - archiv_manifest_key
      - keycloak_db
      - keycloak_admin
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_started
      kc:
        condition: service_started
    networks: [intern]

  kc_restore:
    image: archiv:restore-roundtrip-kc
    # Speichergrenze, damit drei JVMs in eine kleine Docker-VM passen (z. B. Colima mit 6 GB)
    mem_limit: 768m
    environment:
      JAVA_OPTS_KC_HEAP: -XX:MaxRAMPercentage=50 -XX:InitialRAMPercentage=25
      KC_DB: postgres
      KC_DB_URL_HOST: db
      KC_DB_URL_DATABASE: keycloak_restore
      KC_DB_USERNAME: keycloak
      KC_BOOTSTRAP_ADMIN_USERNAME: archiv-admin
      KC_HOSTNAME: ${ARCHIV_RESTORE_KC_BASE_URL:?}
      KC_HOSTNAME_STRICT: "false"
      KC_HTTP_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"
    secrets:
      - keycloak_db
      - keycloak_admin
    depends_on:
      db:
        condition: service_healthy
    networks: [intern, hostzugang]
    ports:
      - "127.0.0.1:${ARCHIV_RESTORE_KC_PORT:?}:8080"

secrets:
  postgres_password:
    file: ${ARCHIV_RESTORE_TMP:?}/secrets/postgres_password
  archiv_db_owner:
    file: ${ARCHIV_RESTORE_TMP:?}/secrets/archiv_db_owner
  archiv_db_app:
    file: ${ARCHIV_RESTORE_TMP:?}/secrets/archiv_db_app
  s3_app_zugang_id:
    file: ${ARCHIV_RESTORE_TMP:?}/secrets/s3_app_zugang_id
  s3_app_zugang_geheimnis:
    file: ${ARCHIV_RESTORE_TMP:?}/secrets/s3_app_zugang_geheimnis
  infomaniak_ai_token:
    file: ${ARCHIV_RESTORE_TMP:?}/secrets/infomaniak_ai_token
  archiv_manifest_key:
    file: ${ARCHIV_RESTORE_TMP:?}/secrets/archiv_manifest_key
  keycloak_db:
    file: ${ARCHIV_RESTORE_TMP:?}/secrets/keycloak_db
  keycloak_admin:
    file: ${ARCHIV_RESTORE_TMP:?}/secrets/keycloak_admin
  restore_oidc_password:
    file: ${ARCHIV_RESTORE_TMP:?}/secrets/restore_oidc_password
  restore_oidc_user:
    file: ${ARCHIV_RESTORE_TMP:?}/secrets/restore_oidc_user.json
  restore_oidc_client:
    file: ${ARCHIV_RESTORE_TMP:?}/secrets/restore_oidc_client.json

# Docker veröffentlicht auf einem Netz mit «internal: true» keine Ports. Darum hängen nur PostgreSQL und MinIO, die die
# Maven-Phasen vom Host aus brauchen, zusätzlich an «hostzugang» (Ports nur an 127.0.0.1). Keycloak und die API bleiben
# allein im internen Netz; das Skript prüft sie über den Datenbank-Container.
networks:
  intern:
    internal: true
  hostzugang: {}
