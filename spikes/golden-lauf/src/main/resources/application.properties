# Aufgabe 0.5 – Golden-Lauf. Nur gegen Infomaniak AI (Req 16.22, ADR-012), kein Profil lokal.
quarkus.banner.enabled=false
quarkus.log.level=WARN
quarkus.log.category."ch.urinet".level=INFO

archiv.ki.product-id=113354
archiv.ki.basis-url=https://api.infomaniak.com/2/ai/${archiv.ki.product-id}/openai/v1
# Secret-Datei; lokal per -Darchiv.ki.token-datei=$HOME/.config/urinet-archiv/infomaniak_ai_token
archiv.ki.token-datei=/run/secrets/infomaniak_ai_token
archiv.ki.chat-modell=mistralai/Mistral-Small-4-119B-2603
archiv.ki.timeout=180s
# Req 7.6 / 0.9, Startwert 0.8 (>=)
archiv.ki.schwelle=0.8

# Der AI-Service nutzt KiModell (ohne Transport-Wiederholung); diese Werte gelten nur für das ungenutzte Standardmodell
quarkus.langchain4j.openai.base-url=${archiv.ki.basis-url}
quarkus.langchain4j.openai.timeout=${archiv.ki.timeout}
quarkus.langchain4j.openai.chat-model.model-name=${archiv.ki.chat-modell}
quarkus.langchain4j.openai.chat-model.temperature=0
quarkus.langchain4j.openai.chat-model.response-format=json_schema
quarkus.langchain4j.openai.chat-model.strict-json-schema=true
# nie Inhalte loggen (Req 16.7)
quarkus.langchain4j.openai.log-requests=false
quarkus.langchain4j.openai.log-responses=false

# OCR: abgeleitetes Image aus ocr/Dockerfile (OCRmyPDF 17.13.0 + ita + poppler)
golden.ocr.image=golden-ocr:17.13.0
golden.ocr.sprachen=deu+fra+ita+eng
golden.ocr.zeitgrenze=10m
# Name des Mandanten für die echten Belege (Kennungen aus $ARCHIV_GOLDEN_DIR/mandant-kennungen.json)
golden.mandant-name=UriNet Aschwanden
# design.md «Mandant»: eigene_arten von urinet
golden.eigene-arten=AUSGANGSRECHNUNG,OFFERTE,LOHNABRECHNUNG
# R3: Eingangsdatum der Golden-Belege, fest für alle Abstimmungs- und Gate-Läufe (Generator datiert bis rund 10.11.2026)
golden.eingangsdatum=2026-11-10
# Infomaniak-Preisliste Mistral-Small-4, Stand 08.11.2026, exkl. MWST
golden.preis.ein-chf-pro-mio=0.20
golden.preis.aus-chf-pro-mio=0.75
