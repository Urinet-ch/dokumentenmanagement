# Spike 0.3 – Infomaniak AI Services. Nur synthetische Daten.
quarkus.banner.enabled=false

archiv.ki.product-id=113354
archiv.ki.basis-url=https://api.infomaniak.com/2/ai/${archiv.ki.product-id}/openai/v1
archiv.ki.reranker-url=https://api.infomaniak.com/2/ai/${archiv.ki.product-id}/cohere/v2/rerank
# Secret-Datei; lokal per -Darchiv.ki.token-datei=~/.config/urinet-archiv/infomaniak_ai_token
archiv.ki.token-datei=/run/secrets/infomaniak_ai_token
archiv.ki.chat-modell=mistralai/Mistral-Small-4-119B-2603
archiv.ki.embedding-modell=bge_multilingual_gemma2
archiv.ki.reranker-modell=BAAI/bge-reranker-v2-m3

# Standardmodell: freier Text, Werkzeuge, Bild
quarkus.langchain4j.openai.base-url=${archiv.ki.basis-url}
quarkus.langchain4j.openai.timeout=120s
quarkus.langchain4j.openai.chat-model.model-name=${archiv.ki.chat-modell}
quarkus.langchain4j.openai.chat-model.temperature=0
quarkus.langchain4j.openai.embedding-model.model-name=${archiv.ki.embedding-modell}

# JSON-Schema-Antwortformat (Structured Outputs)
quarkus.langchain4j.openai.strukturiert.base-url=${archiv.ki.basis-url}
quarkus.langchain4j.openai.strukturiert.timeout=120s
quarkus.langchain4j.openai.strukturiert.chat-model.model-name=${archiv.ki.chat-modell}
quarkus.langchain4j.openai.strukturiert.chat-model.temperature=0
quarkus.langchain4j.openai.strukturiert.chat-model.response-format=json_schema
quarkus.langchain4j.openai.strukturiert.chat-model.strict-json-schema=true

# JSON-Modus (response_format json_object)
quarkus.langchain4j.openai.jsonmodus.base-url=${archiv.ki.basis-url}
quarkus.langchain4j.openai.jsonmodus.timeout=120s
quarkus.langchain4j.openai.jsonmodus.max-retries=1
quarkus.langchain4j.openai.jsonmodus.chat-model.model-name=${archiv.ki.chat-modell}
quarkus.langchain4j.openai.jsonmodus.chat-model.temperature=0
quarkus.langchain4j.openai.jsonmodus.chat-model.response-format=json_object
