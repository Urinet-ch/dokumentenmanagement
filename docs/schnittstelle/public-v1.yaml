openapi: 3.1.0
info:
  title: UriNet Archiv – Webseiten-Schnittstelle
  version: "1"
  description: |
    Vertrag der Webseiten-Schnittstelle unter `/public/v1` (Hauptversion 1), gleich für jede Webseite
    (Spec 03, Requirement 11, ADR-014). Endpunkte kommen additiv mit den Aufgaben, die sie bauen; diese Fassung
    beschreibt Anmeldung, Fehler, Header und Versionierung sowie die lesenden Endpunkte (Liste, Suche, Details,
    Datei-Link, Filter, Umleitung).

    Lesen:
    - **Stufe der Anfrage.** Der Header `X-Archiv-Zugriff` (`oeffentlich`, `mitglieder`, `vorstand`; fehlt er, gilt
      `oeffentlich`) meldet die Stufe des Besuchers. Sie darf nicht über der Stufe des Schlüssels liegen (403
      `NICHT_ERLAUBT`); ein unbekannter Wert ergibt 400 `ANFRAGE_UNGUELTIG`. Es gilt für Liste, Suche, Details,
      Datei-Link, Filter und Umleitung.
    - **Fester Filter.** Jede Abfrage liefert nur archivierte, veröffentlichte Dokumente der Vertraulichkeit `NORMAL`
      mit einer Zugriffsstufe bis zur Stufe der Anfrage. Ein Dokument ausserhalb davon gibt es für die Anfrage nicht:
      404 `NICHT_GEFUNDEN`, gleich wie bei einer unbekannten ID. Kein Parameter ändert diesen Filter.
    - **Dokumente heissen nur mit ihrer ID.** Die Antworten nennen nie eine URL einer Seite der Webseite, nie den
      Dateinamen, die Vertraulichkeit, den Status oder Angaben zur Veröffentlichung; den Link auf die Dokumentseite
      bildet die Webseite selbst.
    - **Client-Hash.** `X-Archiv-Client` (SHA-256 aus IP und Tages-Salz des Besuchers, 64 Hexziffern in
      Kleinbuchstaben, von der Webseite berechnet) ist optional; die IP des Besuchers erhält das Archiv nie.
    - **Unbekannte Parameter** einer Abfrage werden ignoriert.

    Regeln:
    - **Nur serverseitig.** Nur der Server einer Webseite ruft die Schnittstelle auf. Das Archiv erlaubt kein CORS;
      ein Schlüssel gehört nie in einen Browser, eine App oder ein Skript beim Besucher.
    - **Innerhalb einer Hauptversion nur additiv.** Erlaubt sind neue Endpunkte, neue optionale Parameter, neue
      Antwortfelder und neue Werte bei Feldern mit `x-erweiterbar: true`. Alles andere (Pfad, Feld oder Parameter
      entfernen oder umbenennen, Typ ändern, neuer Pflichtparameter, Statuscode entfernen, neuer Wert eines nicht
      erweiterbaren Felds) kommt nur unter einer neuen Hauptversion `/public/v<n+1>`.
    - **Unbekanntes ignorieren.** Nutzer ignorieren Antwortfelder, die sie nicht kennen, und behandeln unbekannte
      Werte erweiterbarer Felder wie einen allgemeinen Fall (bei `fehlercode` nach dem HTTP-Status).
    - **Parallelbetrieb.** Kommt eine neue Hauptversion, läuft die alte mindestens 6 Monate ab Bereitstellung der neuen
      weiter.
    - **Abkündigung.** Ist eine Hauptversion abgekündigt, trägt jede ihrer Antworten, auch jede Fehlerantwort, die
      Header `Deprecation` (RFC 9745), `Sunset` (RFC 8594, Datum der möglichen Abschaltung) und
      `Link: </public/v<n+1>>; rel="successor-version"`. Ohne Abkündigung fehlen alle drei.
    - **Nicht zwischenspeichern.** Jede Antwort trägt `Cache-Control: no-store`; zwischenspeichern darf nur der Server
      der Webseite nach seinen eigenen Regeln.
    - **Fehler als Problem Details** (RFC 9457, `application/problem+json`) mit stabilem `fehlercode`; `title` und
      `detail` sind feste Texte ohne Eingabewerte. Massgebend für die Behandlung ist `fehlercode`, nie der Text.
    - **`x-erweiterbar: true`** an einem Feld mit Aufzählung (`enum`) heisst: Innerhalb der Hauptversion können
      neue Werte dazukommen; Nutzer müssen unbekannte Werte vertragen.
paths:
  "/public/v1/dokumente":
    get:
      summary: Veröffentlichte Dokumente auflisten
      description: Dokumente, die der feste Filter bis zur Stufe der Anfrage liefert
        (archiviert, veröffentlicht, Vertraulichkeit NORMAL, Zugriffsstufe bis zur gemeldeten
        Stufe). Filter nach reihe (Code), jahr und ausgabe; sortierung datum_ab (Standard),
        datum_auf oder titel. Unbekannte Parameter werden ignoriert.
      parameters:
      - description: Ausgabe innerhalb der Reihe
        name: ausgabe
        in: query
        schema:
          type: string
      - description: Jahr, vier Ziffern
        name: jahr
        in: query
        schema:
          type: string
      - description: Einträge je Seite, 1 bis 100 (Standard 20)
        schema:
          maximum: 100
          minimum: 1
          format: int32
          type: integer
        name: pro_seite
        in: query
      - description: Code der Reihe, z. B. aus /public/v1/filter
        name: reihe
        in: query
        schema:
          type: string
      - description: Seite ab 1 (Standard 1, höchstens 9999)
        schema:
          minimum: 1
          format: int32
          type: integer
        name: seite
        in: query
      - description: Sortierung (Standard datum_ab)
        schema:
          type: string
          enum:
          - datum_ab
          - datum_auf
          - titel
        name: sortierung
        in: query
      - "$ref": "#/components/parameters/ClientHeader"
      - "$ref": "#/components/parameters/ZugriffHeader"
      responses:
        '200':
          description: Seite der Liste
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/WebseiteDokumentListe"
        '400':
          "$ref": "#/components/responses/AnfrageUngueltig"
        '401':
          "$ref": "#/components/responses/NichtAngemeldet"
        '403':
          "$ref": "#/components/responses/NichtErlaubt"
        '503':
          "$ref": "#/components/responses/Ueberlastet"
  "/public/v1/dokumente/{id}":
    get:
      summary: Details eines Dokuments
      description: Dokument mit Auszug. Ein Dokument ausserhalb des festen Filters (nicht
        veröffentlicht, höhere Stufe, fremder Mandant) und eine unbekannte oder ungültige
        ID ergeben dieselbe Antwort 404.
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      - "$ref": "#/components/parameters/ClientHeader"
      - "$ref": "#/components/parameters/ZugriffHeader"
      responses:
        '200':
          description: Dokument
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/WebseiteDokumentDetails"
        '400':
          "$ref": "#/components/responses/AnfrageUngueltig"
        '401':
          "$ref": "#/components/responses/NichtAngemeldet"
        '403':
          "$ref": "#/components/responses/NichtErlaubt"
        '404':
          "$ref": "#/components/responses/NichtGefunden"
        '503':
          "$ref": "#/components/responses/Ueberlastet"
  "/public/v1/dokumente/{id}/datei":
    get:
      summary: Datei-Link eines öffentlichen Dokuments
      description: Vorsignierte Adresse der PDF-Datei, höchstens 5 Minuten gültig; jeder
        Abruf wird mit gekürzter IP protokolliert. Nur für Dokumente der Stufe oeffentlich;
        für andere Dokumente gibt es hier keine Adresse (404), ihr Abruf folgt als Stream
        mit einer späteren Fassung.
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      - "$ref": "#/components/parameters/ClientHeader"
      - "$ref": "#/components/parameters/ZugriffHeader"
      responses:
        '200':
          description: Adresse der Datei
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/WebseiteDateiLink"
        '400':
          "$ref": "#/components/responses/AnfrageUngueltig"
        '401':
          "$ref": "#/components/responses/NichtAngemeldet"
        '403':
          "$ref": "#/components/responses/NichtErlaubt"
        '404':
          "$ref": "#/components/responses/NichtGefunden"
        '503':
          "$ref": "#/components/responses/Ueberlastet"
  "/public/v1/filter":
    get:
      summary: Werte für die Filter
      description: Reihen (Code und Name der aktiven Dokumentarten), zu denen der feste
        Filter bis zur Stufe der Anfrage mindestens ein Dokument liefert; eine Reihe
        oder ein Wert einer höheren Stufe wird nie genannt.
      parameters:
      - "$ref": "#/components/parameters/ClientHeader"
      - "$ref": "#/components/parameters/ZugriffHeader"
      responses:
        '200':
          description: Filter
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/WebseiteFilter"
        '400':
          "$ref": "#/components/responses/AnfrageUngueltig"
        '401':
          "$ref": "#/components/responses/NichtAngemeldet"
        '403':
          "$ref": "#/components/responses/NichtErlaubt"
        '503':
          "$ref": "#/components/responses/Ueberlastet"
  "/public/v1/suche":
    get:
      summary: Dokumente suchen
      description: Hybridsuche (Volltext und semantische Suche mit Reranker) über die
        Dokumente, die der feste Filter bis zur Stufe der Anfrage liefert, ohne Dateinamen.
        q ist Pflicht (höchstens 200 Zeichen). Höchstens 30 Treffer ohne Blättern; degradiert
        heisst, dass nur im Volltext gesucht wurde. Die Fundstelle fehlt, wenn die Seite
        unbekannt ist.
      parameters:
      - description: Ausgabe innerhalb der Reihe
        name: ausgabe
        in: query
        schema:
          type: string
      - description: Jahr, vier Ziffern
        name: jahr
        in: query
        schema:
          type: string
      - description: Suchbegriff (Websuche-Syntax), höchstens 200 Zeichen
        required: true
        name: q
        in: query
        schema:
          type: string
      - description: Code der Reihe
        name: reihe
        in: query
        schema:
          type: string
      - "$ref": "#/components/parameters/ClientHeader"
      - "$ref": "#/components/parameters/ZugriffHeader"
      responses:
        '200':
          description: Treffer
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/WebseiteSuchergebnis"
        '400':
          "$ref": "#/components/responses/AnfrageUngueltig"
        '401':
          "$ref": "#/components/responses/NichtAngemeldet"
        '403':
          "$ref": "#/components/responses/NichtErlaubt"
        '503':
          "$ref": "#/components/responses/Ueberlastet"
  "/public/v1/umleitung":
    get:
      summary: Dokument zu einer alten URL
      description: Zuordnung alte URL der bisherigen Webseite zur Dokument-ID, nur für
        Dokumente, die der feste Filter bis zur Stufe der Anfrage liefert; sonst 404.
        Die URL darf mit Schema und Host stehen; geprüft wird nur der Pfad (ohne Anfrage
        und Fragment, Prozent-Kodierung aufgelöst, ohne abschliessenden Schrägstrich).
      parameters:
      - description: Alte URL oder ihr Pfad
        required: true
        name: url
        in: query
        schema:
          type: string
      - "$ref": "#/components/parameters/ClientHeader"
      - "$ref": "#/components/parameters/ZugriffHeader"
      responses:
        '200':
          description: Dokument
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/WebseiteUmleitung"
        '400':
          "$ref": "#/components/responses/AnfrageUngueltig"
        '401':
          "$ref": "#/components/responses/NichtAngemeldet"
        '403':
          "$ref": "#/components/responses/NichtErlaubt"
        '404':
          "$ref": "#/components/responses/NichtGefunden"
        '503':
          "$ref": "#/components/responses/Ueberlastet"
security:
  - webseitenSchluessel: []
components:
  securitySchemes:
    webseitenSchluessel:
      type: http
      scheme: bearer
      description: |
        Webseiten-Schlüssel `ua_<id>_<geheimnis>` im Header `Authorization: Bearer <schlüssel>`, je Webseite und
        Mandant vom Betreiber ausgestellt. Die Scopes legt Aufgabe 11.7 fest. Ein fehlender, ungültiger, abgelaufener
        oder widerrufener Schlüssel ergibt dieselbe Antwort 401 `NICHT_ANGEMELDET`.
  schemas:
    Problem:
      type: object
      description: Fehlerantwort nach RFC 9457 mit stabilem Fehlercode.
      required: [type, title, status, detail, instance, fehlercode]
      properties:
        type:
          type: string
          description: "`urn:urinet:archiv:fehler:<fehlercode>`"
        title:
          type: string
          description: Fester deutscher Titel je Fehlercode.
        status:
          type: integer
          format: int32
          description: HTTP-Status der Antwort.
        detail:
          type: string
          description: Fester deutscher Text je Fehlercode, ohne Eingabewerte.
        instance:
          type: string
          description: Fehler-ID `urn:uuid:<uuid>`; dieselbe ID steht im Log des Archivs.
        fehlercode:
          type: string
          description: Stabiler Fehlercode; neue Codes sind additiv.
          x-erweiterbar: true
          enum:
            - ANFRAGE_UNGUELTIG
            - NICHT_ANGEMELDET
            - MANDANT_FEHLT
            - NICHT_ERLAUBT
            - NICHT_GEFUNDEN
            - DATEI_ZU_GROSS
            - INTERNER_FEHLER
            - UEBERLASTET
    WebseiteDateiLink:
      description: Vorsignierte Adresse der Datei, kurz gültig
      type: object
      required:
      - url
      - gueltigBis
      properties:
        url:
          type: string
          description: Adresse der PDF-Datei; bis gueltigBis ein Zugangsschlüssel, nicht
            weitergeben, nicht speichern, nicht loggen
        gueltigBis:
          type: string
          format: date-time
          description: Ablauf, höchstens 5 Minuten nach der Anfrage
    WebseiteDokument:
      description: Dokument in der Liste; bezeichnet nur mit der ID, nie mit einer URL
      type: object
      required:
      - id
      - zugriff
      properties:
        id:
          type: string
          format: uuid
        titel:
          type:
          - string
          - 'null'
        reihe:
          anyOf:
          - "$ref": "#/components/schemas/WebseiteReihe"
          - type: 'null'
        ausgabe:
          type:
          - string
          - 'null'
          description: Ausgabe innerhalb der Reihe, z. B. Nummer
        jahr:
          type:
          - integer
          - 'null'
          format: int32
        datum:
          type:
          - string
          - 'null'
          format: date
          description: Erscheinungsdatum; fehlt, wenn unbekannt
        zugriff:
          type: string
          description: Zugriffsstufe des Dokuments
          enum:
          - oeffentlich
          - mitglieder
          - vorstand
        seiten:
          type:
          - integer
          - 'null'
          format: int32
          description: Zahl der Seiten, wenn bekannt
    WebseiteDokumentDetails:
      description: Dokument mit Auszug
      type: object
      required:
      - id
      - zugriff
      properties:
        id:
          type: string
          format: uuid
        titel:
          type:
          - string
          - 'null'
        reihe:
          anyOf:
          - "$ref": "#/components/schemas/WebseiteReihe"
          - type: 'null'
        ausgabe:
          type:
          - string
          - 'null'
        jahr:
          type:
          - integer
          - 'null'
          format: int32
        datum:
          type:
          - string
          - 'null'
          format: date
        zugriff:
          type: string
          enum:
          - oeffentlich
          - mitglieder
          - vorstand
        seiten:
          type:
          - integer
          - 'null'
          format: int32
        auszug:
          type:
          - string
          - 'null'
          description: Anfang des Textes, höchstens 300 Zeichen; fehlt ohne Text
    WebseiteDokumentListe:
      description: Seite der Liste veröffentlichter Dokumente
      type: object
      required:
      - eintraege
      - seite
      - proSeite
      - gesamt
      properties:
        eintraege:
          type: array
          items:
            "$ref": "#/components/schemas/WebseiteDokument"
        seite:
          type: integer
          format: int32
          description: Nummer dieser Seite, ab 1
        proSeite:
          type: integer
          format: int32
        gesamt:
          type: integer
          format: int64
          description: Zahl aller Dokumente, die die Anfrage liefert
    WebseiteFilter:
      description: Auswahl für die Filter der Webseite
      type: object
      required:
      - reihen
      properties:
        reihen:
          type: array
          items:
            "$ref": "#/components/schemas/WebseiteReihe"
          description: Reihen mit mindestens einem sichtbaren Dokument
    WebseiteFundstelle:
      description: Stelle des besten Treffers im Dokument
      type: object
      required:
      - seite
      properties:
        seite:
          type: integer
          format: int32
          description: PDF-Seite, ab 1
    WebseiteReihe:
      type: object
      description: Reihe (Dokumentart) eines Dokuments
      required:
      - code
      - name
      properties:
        code:
          type: string
        name:
          type: string
    WebseiteSuchergebnis:
      description: Treffer der Hybridsuche, höchstens 30, ohne Blättern
      type: object
      required:
      - treffer
      - degradiert
      properties:
        treffer:
          type: array
          items:
            "$ref": "#/components/schemas/WebseiteTreffer"
        degradiert:
          type: boolean
          description: true, wenn nur im Volltext gesucht wurde (Rückfall, ohne semantische
            Suche)
    WebseiteTreffer:
      type: object
      description: Dokument als Treffer der Suche
      required:
      - id
      - zugriff
      - rang
      properties:
        id:
          type: string
          format: uuid
        titel:
          type:
          - string
          - 'null'
        reihe:
          anyOf:
          - "$ref": "#/components/schemas/WebseiteReihe"
          - type: 'null'
        ausgabe:
          type:
          - string
          - 'null'
        jahr:
          type:
          - integer
          - 'null'
          format: int32
        datum:
          type:
          - string
          - 'null'
          format: date
        zugriff:
          type: string
          enum:
          - oeffentlich
          - mitglieder
          - vorstand
        seiten:
          type:
          - integer
          - 'null'
          format: int32
        auszug:
          type:
          - string
          - 'null'
          description: Textstelle zum Suchbegriff aus dem Text, höchstens 300 Zeichen;
            ohne Dateinamen
        fundstelle:
          "$ref": "#/components/schemas/WebseiteFundstelle"
        rang:
          type: integer
          format: int32
          description: Platz in dieser Antwort, ab 1
    WebseiteUmleitung:
      description: Dokument zu einer alten URL
      type: object
      required:
      - dokumentId
      properties:
        dokumentId:
          type: string
          format: uuid
  parameters:
    ClientHeader:
      description: SHA-256 aus IP und Tages-Salz des Besuchers, von der Webseite berechnet
        (64 Hexziffern in Kleinbuchstaben); die IP selbst bekommt das Archiv nie
      schema:
        type: string
      name: X-Archiv-Client
      in: header
    ZugriffHeader:
      description: Zugriffsstufe der Anfrage; fehlt der Header, gilt oeffentlich; über
        der Stufe des Schlüssels 403, unbekannt 400
      schema:
        type: string
        enum:
        - oeffentlich
        - mitglieder
        - vorstand
      name: X-Archiv-Zugriff
      in: header
  headers:
    CacheControl:
      description: Auf jeder Antwort; nicht zwischenspeichern.
      required: true
      schema:
        type: string
        enum: [no-store]
    Deprecation:
      description: |
        Nur bei abgekündigter Hauptversion (RFC 9745): Zeitpunkt der Abkündigung als Structured-Field-Datum
        `@<Unix-Sekunden>`.
      schema:
        type: string
    Sunset:
      description: |
        Nur bei abgekündigter Hauptversion (RFC 8594): Zeitpunkt, ab dem die Hauptversion abgeschaltet werden kann,
        als HTTP-Datum, z. B. `Thu, 01 Jul 2027 00:00:00 GMT`.
      schema:
        type: string
    Link:
      description: |
        Nur bei abgekündigter Hauptversion: Nachfolgerin, z. B. `</public/v2>; rel="successor-version"`.
      schema:
        type: string
    RetryAfter:
      description: Sekunden bis zum nächsten Versuch.
      required: true
      schema:
        type: integer
        format: int32
    WwwAuthenticate:
      description: Verfahren der Anmeldung.
      required: true
      schema:
        type: string
        enum: [Bearer]
  responses:
    AnfrageUngueltig:
      description: |
        Anfrage formal ungültig (`ANFRAGE_UNGUELTIG`): Pfad, Parameter oder Inhalt, auch falsches Verb (405) oder
        andere 4xx des Frameworks mit ihrem Status.
      headers:
        Cache-Control:
          $ref: "#/components/headers/CacheControl"
        Deprecation:
          $ref: "#/components/headers/Deprecation"
        Sunset:
          $ref: "#/components/headers/Sunset"
        Link:
          $ref: "#/components/headers/Link"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    NichtAngemeldet:
      description: |
        Schlüssel fehlt, ist ungültig, abgelaufen oder widerrufen (`NICHT_ANGEMELDET`); die Antwort verrät nicht,
        welcher Fall vorliegt.
      headers:
        WWW-Authenticate:
          $ref: "#/components/headers/WwwAuthenticate"
        Cache-Control:
          $ref: "#/components/headers/CacheControl"
        Deprecation:
          $ref: "#/components/headers/Deprecation"
        Sunset:
          $ref: "#/components/headers/Sunset"
        Link:
          $ref: "#/components/headers/Link"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    NichtErlaubt:
      description: Schlüssel ohne Recht für den Endpunkt (`NICHT_ERLAUBT`) oder Mandant nicht aktiv (`MANDANT_FEHLT`).
      headers:
        Cache-Control:
          $ref: "#/components/headers/CacheControl"
        Deprecation:
          $ref: "#/components/headers/Deprecation"
        Sunset:
          $ref: "#/components/headers/Sunset"
        Link:
          $ref: "#/components/headers/Link"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    NichtGefunden:
      description: Pfad unbekannt oder Dokument nicht sichtbar (`NICHT_GEFUNDEN`).
      headers:
        Cache-Control:
          $ref: "#/components/headers/CacheControl"
        Deprecation:
          $ref: "#/components/headers/Deprecation"
        Sunset:
          $ref: "#/components/headers/Sunset"
        Link:
          $ref: "#/components/headers/Link"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    ZuGross:
      description: Anfrage über der Grenze des Archivs (`DATEI_ZU_GROSS`).
      headers:
        Cache-Control:
          $ref: "#/components/headers/CacheControl"
        Deprecation:
          $ref: "#/components/headers/Deprecation"
        Sunset:
          $ref: "#/components/headers/Sunset"
        Link:
          $ref: "#/components/headers/Link"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    InternerFehler:
      description: Unerwarteter Fehler (`INTERNER_FEHLER`); die Antwort nennt nur die Fehler-ID.
      headers:
        Cache-Control:
          $ref: "#/components/headers/CacheControl"
        Deprecation:
          $ref: "#/components/headers/Deprecation"
        Sunset:
          $ref: "#/components/headers/Sunset"
        Link:
          $ref: "#/components/headers/Link"
      content:
        application/problem+json:
          schema:
