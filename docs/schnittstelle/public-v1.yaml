openapi: 3.1.0
info:
  title: UriNet Archiv – Webseiten-Schnittstelle
  version: "1"
  description: |
    Vertrag der Webseiten-Schnittstelle unter `/public/v1` (Hauptversion 1), gleich für jede Webseite
    (Spec 03, Requirement 11, ADR-014). Endpunkte kommen additiv mit den Aufgaben, die sie bauen; diese Fassung
    beschreibt Anmeldung, Fehler, Header und Versionierung.

    Regeln:
    - **Nur serverseitig.** Nur der Server einer Webseite ruft die Schnittstelle auf. Das Archiv erlaubt kein CORS;
      ein Schlüssel gehört nie in einen Browser, eine App oder ein Skript beim Besucher.
    - **Innerhalb einer Hauptversion nur additiv.** Erlaubt sind neue Endpunkte, neue optionale Parameter, neue
      Antwortfelder und neue Werte bei Feldern mit `x-erweiterbar: true`. Alles andere (Pfad, Feld oder Parameter
      entfernen oder umbenennen, Typ ändern, neuer Pflichtparameter, Statuscode entfernen, neuer Wert eines nicht
      erweiterbaren Felds) kommt nur unter einer neuen Hauptversion `/public/v<n+1>`.
    - **Unbekanntes ignorieren.** Nutzer ignorieren Antwortfelder, die sie nicht kennen, und behandeln unbekannte
      Werte erweiterbarer Felder wie einen allgemeinen Fall (bei `fehlercode` nach dem HTTP-Status).
    - **Parallelbetrieb.** Kommt eine neue Hauptversion, läuft die alte mindestens 6 Monate ab Bereitstellung der neuen
      weiter.
    - **Abkündigung.** Ist eine Hauptversion abgekündigt, trägt jede ihrer Antworten, auch jede Fehlerantwort, die
      Header `Deprecation` (RFC 9745), `Sunset` (RFC 8594, Datum der möglichen Abschaltung) und
      `Link: </public/v<n+1>>; rel="successor-version"`. Ohne Abkündigung fehlen alle drei.
    - **Nicht zwischenspeichern.** Jede Antwort trägt `Cache-Control: no-store`; zwischenspeichern darf nur der Server
      der Webseite nach seinen eigenen Regeln.
    - **Fehler als Problem Details** (RFC 9457, `application/problem+json`) mit stabilem `fehlercode`; `title` und
      `detail` sind feste Texte ohne Eingabewerte. Massgebend für die Behandlung ist `fehlercode`, nie der Text.
    - **`x-erweiterbar: true`** an einem Feld mit Aufzählung (`enum`) heisst: Innerhalb der Hauptversion können
      neue Werte dazukommen; Nutzer müssen unbekannte Werte vertragen.
paths:
  /public/v1/chat:
    post:
      tags: [Webseite]
      summary: Frage an den öffentlichen Chatbot
      description: |
        Der Chatbot der Webseite antwortet auf Fragen zu den veröffentlichten Publikationen, nur aus Dokumenten, die
        der feste Filter bis zur gemeldeten Stufe liefert (veröffentlicht, archiviert, normale Vertraulichkeit,
        `zugriff` bis zur Stufe). Er verwendet nur Suche und Anzeige dieser Dokumente: keine Kennzahlen, keine internen
        Daten, keine Rechte oder Sicht eines Benutzers. Anonym für den Besucher: Das Archiv speichert Frage (bereinigt),
        Quellen und Tokens befristet (Standard 90 Tage, je Mandant einstellbar), nie Client-Hash, IP, Antwort oder Gespräch.

        Antwort als Server-Sent Events (`text/event-stream`) mit benannten Ereignissen, JSON in `data:`:
        - `werkzeug` `{werkzeug}`: je Werkzeugaufruf (nur zur Anzeige «sucht …»).
        - `text` `{delta}`: Teil der Antwort. Ohne passende Publikation sagt der Chatbot das und verweist auf die
          Geschäftsstelle; `quellen` ist dann leer.
        - `quellen` `[{dokumentId, titel, reihe {code, name}, ausgabe}]`: genau einmal, unmittelbar vor `fertig`. Die
          Quellen stammen aus den Werkzeugergebnissen und sind über den festen Filter geprüft; nie Stufe, Status oder
          Dateiname. Den Link auf die Dokumentseite bildet die Webseite aus `dokumentId`.
        - `fertig` `{gespraechId}`: Ende der Antwort. Das Gespräch lebt höchstens 30 Minuten im Speicher des Archivs, nur
          für denselben Client; eine unbekannte, fremde oder abgelaufene ID beginnt ein neues Gespräch.
        - `fehler` `{meldung, gespraechId}`: fester Text, beendet den Stream ohne `fertig`.

        Grenzen: höchstens 20 Fragen je Client (`X-Archiv-Client`) und Stunde, dazu eine Grenze je Webseite und eine
        laufende Frage je Client; ein Monatsbudget an Tokens je Mandant. Darüber 429 mit `ZU_VIELE_ANFRAGEN` bzw.
        `BUDGET`.
      parameters:
        - name: X-Archiv-Zugriff
          in: header
          description: Stufe des Besuchers; fehlt der Header, gilt `oeffentlich`; über der Stufe des Schlüssels 403.
          schema:
            type: string
            enum: [oeffentlich, mitglieder, vorstand]
        - name: X-Archiv-Client
          in: header
          description: |
            SHA-256 (64 Hexziffern, Kleinbuchstaben) von IP und Tages-Salz, von der Webseite berechnet; ohne Header
            zählen alle Besucher ohne Hash der Webseite zusammen.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatFrage"
      responses:
        "200":
          description: Stream der Ereignisse
          content:
            text/event-stream:
              schema:
                type: string
        "400":
          $ref: "#/components/responses/AnfrageUngueltig"
        "401":
          $ref: "#/components/responses/NichtAngemeldet"
        "403":
          $ref: "#/components/responses/NichtErlaubt"
        "429":
          $ref: "#/components/responses/ZuVieleAnfragen"
        "503":
          $ref: "#/components/responses/Ueberlastet"
security:
  - webseitenSchluessel: []
components:
  securitySchemes:
    webseitenSchluessel:
      type: http
      scheme: bearer
      description: |
        Webseiten-Schlüssel `ua_<id>_<geheimnis>` im Header `Authorization: Bearer <schlüssel>`, je Webseite und
        Mandant vom Betreiber ausgestellt. Die Scopes legt Aufgabe 11.7 fest. Ein fehlender, ungültiger, abgelaufener
        oder widerrufener Schlüssel ergibt dieselbe Antwort 401 `NICHT_ANGEMELDET`.
  schemas:
    ChatFrage:
      type: object
      required: [frage]
      properties:
        frage:
          type: string
          minLength: 1
          maxLength: 500
          description: Frage, nach Trim 1 bis 500 Zeichen (Obergrenze konfigurierbar, Standard 500).
        gespraechId:
          type: [string, "null"]
          format: uuid
          description: Gespräch fortsetzen; ohne beginnt ein neues.
    Problem:
      type: object
      description: Fehlerantwort nach RFC 9457 mit stabilem Fehlercode.
      required: [type, title, status, detail, instance, fehlercode]
      properties:
        type:
          type: string
          description: "`urn:urinet:archiv:fehler:<fehlercode>`"
        title:
          type: string
          description: Fester deutscher Titel je Fehlercode.
        status:
          type: integer
          format: int32
          description: HTTP-Status der Antwort.
        detail:
          type: string
          description: Fester deutscher Text je Fehlercode, ohne Eingabewerte.
        instance:
          type: string
          description: Fehler-ID `urn:uuid:<uuid>`; dieselbe ID steht im Log des Archivs.
        grund:
          type: string
          x-erweiterbar: true
          enum: [STUNDENLIMIT, LAEUFT]
          description: |
            Nur bei `ZU_VIELE_ANFRAGEN` des Chats: `STUNDENLIMIT` (Stundengrenze je Client oder Webseite erreicht) oder
            `LAEUFT` (schon eine Frage dieses Clients läuft, `Retry-After` höchstens 5 Sekunden).
        fehlercode:
          type: string
          description: Stabiler Fehlercode; neue Codes sind additiv.
          x-erweiterbar: true
          enum:
            - ANFRAGE_UNGUELTIG
            - NICHT_ANGEMELDET
            - MANDANT_FEHLT
            - NICHT_ERLAUBT
            - NICHT_GEFUNDEN
            - ZU_VIELE_ANFRAGEN
            - BUDGET
            - DATEI_ZU_GROSS
            - INTERNER_FEHLER
            - UEBERLASTET
  headers:
    CacheControl:
      description: Auf jeder Antwort; nicht zwischenspeichern.
      required: true
      schema:
        type: string
        enum: [no-store]
    Deprecation:
      description: |
        Nur bei abgekündigter Hauptversion (RFC 9745): Zeitpunkt der Abkündigung als Structured-Field-Datum
        `@<Unix-Sekunden>`.
      schema:
        type: string
    Sunset:
      description: |
        Nur bei abgekündigter Hauptversion (RFC 8594): Zeitpunkt, ab dem die Hauptversion abgeschaltet werden kann,
        als HTTP-Datum, z. B. `Thu, 01 Jul 2027 00:00:00 GMT`.
      schema:
        type: string
    Link:
      description: |
        Nur bei abgekündigter Hauptversion: Nachfolgerin, z. B. `</public/v2>; rel="successor-version"`.
      schema:
        type: string
    RetryAfter:
      description: Sekunden bis zum nächsten Versuch.
      required: true
      schema:
        type: integer
        format: int32
    WwwAuthenticate:
      description: Verfahren der Anmeldung.
      required: true
      schema:
        type: string
        enum: [Bearer]
  responses:
    AnfrageUngueltig:
      description: |
        Anfrage formal ungültig (`ANFRAGE_UNGUELTIG`): Pfad, Parameter oder Inhalt, auch falsches Verb (405) oder
        andere 4xx des Frameworks mit ihrem Status.
      headers:
        Cache-Control:
          $ref: "#/components/headers/CacheControl"
        Deprecation:
          $ref: "#/components/headers/Deprecation"
        Sunset:
          $ref: "#/components/headers/Sunset"
        Link:
          $ref: "#/components/headers/Link"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    NichtAngemeldet:
      description: |
        Schlüssel fehlt, ist ungültig, abgelaufen oder widerrufen (`NICHT_ANGEMELDET`); die Antwort verrät nicht,
        welcher Fall vorliegt.
      headers:
        WWW-Authenticate:
          $ref: "#/components/headers/WwwAuthenticate"
        Cache-Control:
          $ref: "#/components/headers/CacheControl"
        Deprecation:
          $ref: "#/components/headers/Deprecation"
        Sunset:
          $ref: "#/components/headers/Sunset"
        Link:
          $ref: "#/components/headers/Link"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    NichtErlaubt:
      description: Schlüssel ohne Recht für den Endpunkt (`NICHT_ERLAUBT`) oder Mandant nicht aktiv (`MANDANT_FEHLT`).
      headers:
        Cache-Control:
          $ref: "#/components/headers/CacheControl"
        Deprecation:
          $ref: "#/components/headers/Deprecation"
        Sunset:
          $ref: "#/components/headers/Sunset"
        Link:
          $ref: "#/components/headers/Link"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    NichtGefunden:
      description: Pfad unbekannt oder Dokument nicht sichtbar (`NICHT_GEFUNDEN`).
      headers:
        Cache-Control:
          $ref: "#/components/headers/CacheControl"
        Deprecation:
          $ref: "#/components/headers/Deprecation"
        Sunset:
          $ref: "#/components/headers/Sunset"
        Link:
          $ref: "#/components/headers/Link"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    ZuGross:
      description: Anfrage über der Grenze des Archivs (`DATEI_ZU_GROSS`).
      headers:
        Cache-Control:
          $ref: "#/components/headers/CacheControl"
        Deprecation:
          $ref: "#/components/headers/Deprecation"
        Sunset:
          $ref: "#/components/headers/Sunset"
        Link:
          $ref: "#/components/headers/Link"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    InternerFehler:
      description: Unerwarteter Fehler (`INTERNER_FEHLER`); die Antwort nennt nur die Fehler-ID.
      headers:
        Cache-Control:
          $ref: "#/components/headers/CacheControl"
        Deprecation:
          $ref: "#/components/headers/Deprecation"
        Sunset:
          $ref: "#/components/headers/Sunset"
        Link:
          $ref: "#/components/headers/Link"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    ZuVieleAnfragen:
      description: |
        Grenze überschritten. `ZU_VIELE_ANFRAGEN` mit `Retry-After` (Sekunden bis zum nächsten Versuch) und im Chat dem
        Feld `grund`; `BUDGET` (nur Chat): Token-Budget des Mandanten im Monat erschöpft, ohne `Retry-After`; die
        Webseite zeigt dann «Der Chatbot ist diesen Monat ausgelastet – die Suche funktioniert weiterhin.».
      headers:
        Retry-After:
          description: Nur bei `ZU_VIELE_ANFRAGEN`; Sekunden bis zum nächsten Versuch.
          schema:
            type: integer
            format: int32
        Cache-Control:
          $ref: "#/components/headers/CacheControl"
        Deprecation:
          $ref: "#/components/headers/Deprecation"
        Sunset:
          $ref: "#/components/headers/Sunset"
        Link:
          $ref: "#/components/headers/Link"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Ueberlastet:
      description: |
        Zu viele gleichzeitige Prüfungen von Schlüsseln (`UEBERLASTET`); nach `Retry-After` Sekunden erneut versuchen.
      headers:
        Retry-After:
          $ref: "#/components/headers/RetryAfter"
        Cache-Control:
          $ref: "#/components/headers/CacheControl"
        Deprecation:
          $ref: "#/components/headers/Deprecation"
        Sunset:
          $ref: "#/components/headers/Sunset"
        Link:
          $ref: "#/components/headers/Link"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
