<title>UriNet Archiv</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Inter+Tight:wght@600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: schwebende Glas-Navigation links, Arbeitsfläche rechts mit Kopfzeile; Karten nur für Kennzahlen, Diagramme und Arbeitsobjekte */
:root{
  --bg:#f2efe7; --glow:rgba(238,177,17,.22); --glow2:rgba(5,7,12,.05);
  --surface:#fffdf8; --surface-2:#f7f3e8; --glass:rgba(255,253,248,.72);
  --line:#e7e0cd; --line-strong:#d6cdb4;
  --fg:#05070c; --fg-2:#3a3d45; --muted:#6f6a5a;
  --accent:#eeb111; --accent-ink:#7a5900; --accent-soft:#fbefc8; --on-accent:#05070c;
  --chart:#a87a00; --chart-fill:rgba(238,177,17,.30);
  --ok:#21734a; --ok-soft:#e1f2e7; --warn:#9a5b00; --warn-soft:#fdf0d8; --crit:#b3261e; --crit-soft:#fbe4e1; --info:#2f5f96; --info-soft:#e3ecf7;
  --shadow:0 1px 2px rgba(40,30,0,.05),0 8px 24px -12px rgba(40,30,0,.18);
  --f-display:"Inter Tight","Inter",system-ui,sans-serif; --f-body:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif; --f-mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  --r:16px; --r-s:10px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#05070c; --glow:rgba(238,177,17,.10); --glow2:rgba(242,239,231,.03);
  --surface:#0d1017; --surface-2:#131722; --glass:rgba(13,16,23,.78);
  --line:#1f2431; --line-strong:#2c3242;
  --fg:#f2efe7; --fg-2:#cfccc3; --muted:#8d909a;
  --accent:#eeb111; --accent-ink:#f2c13a; --accent-soft:rgba(238,177,17,.14); --on-accent:#05070c;
  --chart:#eeb111; --chart-fill:rgba(238,177,17,.22);
  --ok:#5cc488; --ok-soft:rgba(92,196,136,.13); --warn:#f0a940; --warn-soft:rgba(240,169,64,.13); --crit:#ff7a6e; --crit-soft:rgba(255,122,110,.13); --info:#7fb0ea; --info-soft:rgba(127,176,234,.13);
  --shadow:0 1px 2px rgba(0,0,0,.4),0 12px 28px -14px rgba(0,0,0,.7); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#05070c; --glow:rgba(238,177,17,.10); --glow2:rgba(242,239,231,.03);
  --surface:#0d1017; --surface-2:#131722; --glass:rgba(13,16,23,.78);
  --line:#1f2431; --line-strong:#2c3242;
  --fg:#f2efe7; --fg-2:#cfccc3; --muted:#8d909a;
  --accent:#eeb111; --accent-ink:#f2c13a; --accent-soft:rgba(238,177,17,.14); --on-accent:#05070c;
  --chart:#eeb111; --chart-fill:rgba(238,177,17,.22);
  --ok:#5cc488; --ok-soft:rgba(92,196,136,.13); --warn:#f0a940; --warn-soft:rgba(240,169,64,.13); --crit:#ff7a6e; --crit-soft:rgba(255,122,110,.13); --info:#7fb0ea; --info-soft:rgba(127,176,234,.13);
  --shadow:0 1px 2px rgba(0,0,0,.4),0 12px 28px -14px rgba(0,0,0,.7); color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font:14px/1.5 var(--f-body);-webkit-font-smoothing:antialiased;
  background-image:radial-gradient(900px 520px at 88% -8%,var(--glow),transparent 70%),radial-gradient(700px 600px at -10% 110%,var(--glow2),transparent 70%);background-attachment:fixed}
button,input,select,textarea{font:inherit;color:inherit}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:25;background:var(--bg)}
a{color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.mono{font-family:var(--f-mono);font-size:.86em;letter-spacing:-.01em}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
svg.i{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}

/* Rahmen */
.app{display:grid;grid-template-columns:252px minmax(0,1fr);min-height:100%;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px))}
.side{position:sticky;top:12px;height:calc(100vh - 24px);margin-block:12px;background:var(--glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:20px;display:flex;flex-direction:column;padding:18px 12px;overflow:auto;z-index:30}
.brand{display:flex;align-items:center;gap:10px;padding:2px 8px 18px;font:700 17px/1 var(--f-display);letter-spacing:-.02em;text-decoration:none}
.brand small{display:block;font:500 11px/1.4 var(--f-body);color:var(--muted);letter-spacing:0}
.logo{width:32px;height:32px;border-radius:9px;background:var(--accent);display:grid;place-items:center;flex:none}
.logo svg{width:20px;height:20px;stroke:#05070c;fill:none;stroke-width:2;stroke-linecap:round}
.nav-group{font:600 10.5px/1 var(--f-body);text-transform:uppercase;letter-spacing:.09em;color:var(--muted);padding:16px 10px 6px}
.nav a{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:10px;text-decoration:none;color:var(--fg-2);font-weight:500}
.nav a:hover{background:var(--surface-2);color:var(--fg)}
.nav a[aria-current="page"]{background:var(--surface);color:var(--fg);box-shadow:var(--shadow);border:1px solid var(--line)}
.nav a[aria-current="page"] svg{color:var(--accent-ink)}
.nav a .cnt{margin-left:auto;background:var(--accent);color:var(--on-accent);font:600 11px/1 var(--f-body);padding:4px 7px;border-radius:99px}
.side-foot{margin-top:auto;padding:14px 10px 2px;border-top:1px solid var(--line);font-size:12px;color:var(--muted);display:grid;gap:6px}
.side-foot b{color:var(--fg);font-weight:600}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--ok);margin-right:6px;vertical-align:middle}

.main{min-width:0;padding:12px 0 40px 20px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;align-items:center;gap:12px;padding:8px 0 14px;background:linear-gradient(var(--bg) 70%,transparent)}
.ibtn.burger{display:none}
.search{flex:1;max-width:520px;display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:0 12px;height:42px;color:var(--muted)}
.search input{flex:1;min-width:0;border:0;background:transparent;outline:0;color:var(--fg);height:100%}
.search kbd{font:500 11px var(--f-mono);border:1px solid var(--line);border-radius:6px;padding:2px 6px}
.spacer{flex:1}
.ibtn{width:42px;height:42px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;cursor:pointer;position:relative;color:var(--fg-2)}
.ibtn:hover{color:var(--fg);border-color:var(--line-strong)}
.ibtn .badge{position:absolute;top:8px;right:9px;width:8px;height:8px;border-radius:50%;background:var(--crit);border:2px solid var(--surface)}
.user{display:flex;align-items:center;gap:10px;padding:4px 10px 4px 4px;border-radius:12px;border:1px solid var(--line);background:var(--surface);cursor:pointer;position:relative;height:42px}
.avatar{width:32px;height:32px;border-radius:9px;background:#05070c;color:#eeb111;display:grid;place-items:center;font:700 12px var(--f-display);flex:none}
.user .who{font-weight:600;line-height:1.15;font-size:13px;text-align:left}
.user .who small{display:block;font-weight:500;color:var(--muted);font-size:11.5px}
.menu{position:absolute;right:0;top:50px;width:290px;background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:10px;cursor:default;text-align:left}
.menu h4{margin:4px 6px 8px;font:600 11px var(--f-body);text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.menu label{display:flex;gap:10px;align-items:flex-start;padding:8px;border-radius:10px;cursor:pointer}
.menu label:hover{background:var(--surface-2)}
.menu label small{display:block;color:var(--muted);font-size:12px}
.menu input{margin-top:3px;accent-color:var(--accent)}

/* Seitenkopf */
.ph{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin:6px 0 20px}
.ph h1{font:700 clamp(22px,2.6vw,28px)/1.15 var(--f-display);letter-spacing:-.025em;margin:0;text-wrap:balance}
.ph p{margin:4px 0 0;color:var(--muted)}
.eyebrow{font:600 11px var(--f-body);text-transform:uppercase;letter-spacing:.09em;color:var(--accent-ink);margin-bottom:6px}

/* Bausteine */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);min-width:0}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:16px 18px 0;flex-wrap:wrap}
.card-h h2,.card-h h3{font:600 15px/1.3 var(--f-display);letter-spacing:-.01em;margin:0}
.card-b{padding:14px 18px 18px}
.grid{display:grid;gap:16px}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g-dash{grid-template-columns:minmax(0,1.65fr) minmax(0,1fr)}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:36px;padding:0 14px;border-radius:10px;border:1px solid var(--line-strong);background:var(--surface);cursor:pointer;font-weight:600;font-size:13px;white-space:nowrap;text-decoration:none}
.btn:hover{background:var(--surface-2)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.pri:hover{filter:brightness(.96)}
.btn.dark{background:var(--fg);border-color:var(--fg);color:var(--bg)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.danger{color:var(--crit)}
.btn.sm{height:30px;padding:0 10px;font-size:12.5px;border-radius:8px}
.btn svg.i{width:16px;height:16px}
.seg{display:inline-flex;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;padding:5px 11px;border-radius:7px;cursor:pointer;font-size:12.5px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.pill{display:inline-flex;align-items:center;gap:5px;font:600 11.5px/1 var(--f-body);padding:5px 8px;border-radius:99px;white-space:nowrap;background:var(--surface-2);color:var(--fg-2);border:1px solid var(--line)}
.pill.ok{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.pill.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.pill.crit{background:var(--crit-soft);color:var(--crit);border-color:transparent}
.pill.info{background:var(--info-soft);color:var(--info);border-color:transparent}
.pill.acc{background:var(--accent-soft);color:var(--accent-ink);border-color:transparent}
.pill svg.i{width:13px;height:13px}
.trend{display:inline-flex;align-items:center;gap:4px;font-size:12.5px;color:var(--muted)}
.trend b{color:var(--ok);font-weight:600}
.trend b.down{color:var(--crit)}
.field{display:grid;gap:5px}
.field label,.lbl{font-size:12px;font-weight:600;color:var(--muted)}
.inp{height:38px;border:1px solid var(--line-strong);border-radius:10px;background:var(--surface);padding:0 11px;width:100%;min-width:0}
textarea.inp{height:auto;padding:9px 11px;resize:vertical}
.inp:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:transparent}
.inp.unsicher{border-color:var(--warn);background:var(--warn-soft)}
.tbl-wrap{overflow-x:auto}
table.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{text-align:left;font-weight:600;font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:11px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl tr.click{cursor:pointer}
.tbl tr.click:hover td{background:var(--surface-2)}
.r{text-align:right}
.empty{padding:28px;text-align:center;color:var(--muted)}
.platzhalter{font-style:italic;color:var(--muted)}
.platzhalter::before{content:"Datei: ";font-style:normal;font-size:11px;text-transform:uppercase;letter-spacing:.06em}

/* Kennzahlen */
.kpi{padding:16px 18px;display:grid;gap:10px;text-decoration:none}
.kpi .k-h{display:flex;align-items:center;gap:8px;font-weight:600;color:var(--fg-2)}
.kpi .k-h span.ic{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;background:var(--surface-2);border:1px solid var(--line)}
.kpi .v{font:700 30px/1 var(--f-display);letter-spacing:-.03em;font-variant-numeric:tabular-nums}
a.kpi:hover{border-color:var(--line-strong)}
.kpi.hl{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.kpi.hl .k-h{color:var(--bg)}
.kpi.hl .k-h span.ic{background:var(--accent);border-color:var(--accent);color:#05070c}
.kpi.hl .trend{color:color-mix(in srgb,var(--bg) 65%,transparent)}

/* Lebenszyklus */
.flow{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;margin-top:4px}
.flow div{padding:10px 12px;background:var(--surface-2);border-radius:10px;position:relative;min-width:0}
.flow div b{display:block;font:700 18px/1.2 var(--f-display);font-variant-numeric:tabular-nums}
.flow div span{font:500 10.5px var(--f-mono);color:var(--muted);letter-spacing:.02em}
.flow div.now{background:var(--accent-soft)}
.flow div.now span{color:var(--accent-ink)}

/* Diagramme */
.chart{position:relative}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart .ax{fill:var(--muted);font:11px var(--f-body)}
.chart .gl{stroke:var(--line);stroke-width:1}
.tip{position:absolute;pointer-events:none;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);border-radius:10px;padding:8px 11px;font-size:12px;white-space:nowrap;transform:translate(-50%,-110%)}
.tip b{display:block;font:700 18px/1.1 var(--f-display)}
.bars{display:grid;gap:7px}
.bar{display:grid;grid-template-columns:130px minmax(0,1fr) 46px;align-items:center;gap:10px;font-size:12.5px;padding:2px 4px;border-radius:6px}
.bar:hover{background:var(--surface-2)}
.bar .t{height:14px;border-radius:0 4px 4px 0;background:var(--chart);min-width:3px}
.bar .n{text-align:right;font-variant-numeric:tabular-nums;color:var(--fg-2)}
.bar .l{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--fg-2)}

.list{display:grid}
.li{display:flex;gap:12px;align-items:flex-start;padding:11px 0;border-bottom:1px solid var(--line)}
.li:last-child{border-bottom:0}
.li .ic{width:32px;height:32px;border-radius:9px;background:var(--surface-2);display:grid;place-items:center;flex:none;color:var(--fg-2)}
.li .tx{min-width:0;flex:1}
.li .tx b{font-weight:600;display:block}
.li .tx small{color:var(--muted)}

/* Eingangskorb */
.korb{display:grid;gap:14px}
.kk{display:grid;grid-template-columns:120px minmax(0,1fr);gap:18px;padding:16px}
.kk.fehler{border-color:color-mix(in srgb,var(--crit) 45%,var(--line))}
.thumb{aspect-ratio:3/4;max-width:100%;border-radius:8px;background:#fff;border:1px solid var(--line);padding:10px 9px;display:grid;align-content:start;gap:5px;position:relative;overflow:hidden}
.thumb i{display:block;height:4px;border-radius:2px;background:#e3dfd4}
.thumb i.h{height:8px;width:55%;background:#05070c}
.thumb i.s{width:40%}
.thumb i.m{width:75%}
.thumb i.y{background:#eeb111;width:30%;margin-top:6px}
.thumb.err::after{content:"!";position:absolute;inset:0;display:grid;place-items:center;font:700 34px var(--f-display);color:#b3261e;background:rgba(251,228,225,.75)}
.kk-h{display:flex;gap:10px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap}
.kk-h h3{margin:0;font:600 16px/1.3 var(--f-display);letter-spacing:-.01em}
.kk-meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.vorschlag{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin:14px 0}
.vf{border:1px solid var(--line);border-radius:10px;padding:8px 10px;min-width:0}
.vf.u{border-color:var(--warn);background:var(--warn-soft)}
.vf .lbl{display:flex;justify-content:space-between;gap:6px}
.vf .val{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.konf{font:500 10.5px var(--f-mono)}
.hint{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:10px;font-size:13px;margin:10px 0}
.hint.warn{background:var(--warn-soft);color:var(--warn)}
.hint.crit{background:var(--crit-soft);color:var(--crit)}
.hint.info{background:var(--info-soft);color:var(--info)}
.hint .tx{color:var(--fg-2)}
.hint b{color:inherit}
.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

/* Suche */
.s-lay{display:grid;grid-template-columns:250px minmax(0,1fr);gap:18px;align-items:start}
.facet{padding:14px 16px;border-bottom:1px solid var(--line)}
.facet:last-child{border-bottom:0}
.facet h4{margin:0 0 8px;font:600 12px var(--f-body);color:var(--muted);text-transform:uppercase;letter-spacing:.07em}
.facet label{display:flex;align-items:center;gap:8px;padding:3px 0;cursor:pointer;font-size:13px}
.facet label span.c{margin-left:auto;color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums}
.facet input[type=checkbox]{accent-color:var(--accent)}
.hit{padding:16px 18px;border-bottom:1px solid var(--line);cursor:pointer;display:grid;gap:6px}
.hit:last-child{border-bottom:0}
.hit:hover{background:var(--surface-2)}
.hit h3{margin:0;font:600 15px/1.35 var(--f-display)}
.hit p{margin:0;color:var(--fg-2);font-size:13px}
mark{background:var(--accent-soft);color:inherit;padding:0 2px;border-radius:3px;box-shadow:inset 0 -2px 0 var(--accent)}
.big-search{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.big-search .search{max-width:none;height:48px;font-size:15px}

/* Dokument */
.doc-lay{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:18px;align-items:start}
.paper{background:#fff;color:#1b1d22;border-radius:6px;padding:34px 34px 40px;box-shadow:0 2px 6px rgba(0,0,0,.08),0 20px 40px -20px rgba(0,0,0,.35);font-size:12px;aspect-ratio:1/1.414;max-width:100%;overflow:hidden;display:flex;flex-direction:column;gap:14px}
.paper .p-h{display:flex;justify-content:space-between;align-items:flex-start}
.paper .p-logo{font:700 15px var(--f-display);display:flex;align-items:center;gap:6px}
.paper .p-logo i{width:14px;height:14px;background:#eeb111;border-radius:3px;display:inline-block}
.paper h4{font:700 17px var(--f-display);margin:8px 0 0}
.paper table{width:100%;border-collapse:collapse;font-size:11px}
.paper td{padding:5px 0;border-bottom:1px solid #eee}
.paper .tot{font-weight:700;border-top:2px solid #1b1d22}
.paper .qr{margin-top:auto;display:flex;gap:12px;align-items:center;border-top:1px dashed #bbb;padding-top:12px;font-size:10px;color:#666}
.paper .qr i{width:56px;height:56px;background:repeating-conic-gradient(#1b1d22 0 25%,#fff 0 50%) 0 0/8px 8px;border:3px solid #1b1d22;flex:none}
.kv{display:grid;grid-template-columns:150px minmax(0,1fr);gap:9px 14px;font-size:13.5px}
.kv dt{color:var(--muted)}
.kv dd{margin:0;min-width:0;overflow-wrap:anywhere}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);padding:0 18px;overflow-x:auto}
.tabs button{border:0;background:transparent;padding:12px 10px;cursor:pointer;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--fg);border-color:var(--accent)}
.tl{display:grid;gap:0}
.tl .e{display:grid;grid-template-columns:14px minmax(0,1fr);gap:12px;padding-bottom:16px;position:relative}
.tl .e::before{content:"";position:absolute;left:6px;top:14px;bottom:0;width:2px;background:var(--line)}
.tl .e:last-child::before{display:none}
.tl .e i{width:14px;height:14px;border-radius:50%;border:3px solid var(--accent);background:var(--surface);margin-top:3px}
.integ{display:grid;gap:8px;background:var(--surface-2);border-radius:12px;padding:12px 14px;font-size:12.5px}
.integ div{display:flex;gap:8px;align-items:center;min-width:0}
.integ .mono{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* Chat */
.chat-lay{display:grid;grid-template-columns:260px minmax(0,1fr);gap:18px;height:calc(100vh - 150px);min-height:520px}
.conv{overflow:auto;padding:8px}
.conv button{display:block;width:100%;text-align:left;border:0;background:transparent;padding:9px 10px;border-radius:9px;cursor:pointer;font-size:13px}
.conv button small{display:block;color:var(--muted);font-size:11.5px}
.conv button[aria-current="true"]{background:var(--surface-2);font-weight:600}
.thread{display:flex;flex-direction:column;min-height:0}
.msgs{flex:1;overflow:auto;padding:22px;display:flex;flex-direction:column;gap:18px}
.msg{max-width:720px;display:grid;gap:8px}
.msg.me{align-self:flex-end;background:var(--fg);color:var(--bg);padding:10px 14px;border-radius:14px 14px 4px 14px}
.msg.ai{align-self:flex-start}
.msg.ai .body{background:var(--surface-2);padding:12px 15px;border-radius:14px 14px 14px 4px;line-height:1.6}
.tool{display:inline-flex;align-items:center;gap:7px;font:500 12px var(--f-mono);color:var(--muted)}
.tool .spin{width:12px;height:12px;border:2px solid var(--line-strong);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:5px 9px;font-size:12px;cursor:pointer;text-decoration:none}
.chip:hover{border-color:var(--line-strong)}
.chip.wiki{border-style:dashed}
.chip svg.i{width:14px;height:14px}
.composer{border-top:1px solid var(--line);padding:12px;display:grid;gap:10px}
.composer form{display:flex;gap:8px}
.composer .inp{height:44px}
.beispiele{display:flex;gap:6px;flex-wrap:wrap}
.beispiele button{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:5px 11px;font-size:12px;cursor:pointer;color:var(--fg-2)}
.beispiele button:hover{border-color:var(--accent)}

/* Erfassen */
.drop{border:2px dashed var(--line-strong);border-radius:var(--r);padding:34px 20px;text-align:center;display:grid;gap:10px;justify-items:center;background:var(--surface);cursor:pointer;transition:border-color .15s,background .15s}
.drop.over,.drop:hover{border-color:var(--accent);background:var(--accent-soft)}
.drop .big{width:52px;height:52px;border-radius:14px;background:var(--accent);display:grid;place-items:center;color:#05070c}
.drop .big svg{width:26px;height:26px}
.prog{height:6px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.prog i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .4s}

/* Wissen */
.diff{font:12.5px/1.65 var(--f-mono);border:1px solid var(--line);border-radius:10px;overflow:auto}
.diff div{padding:1px 12px;white-space:pre-wrap}
.diff .add{background:var(--ok-soft)}
.diff .add::before{content:"+ ";color:var(--ok)}
.diff .del{background:var(--crit-soft);text-decoration:line-through;text-decoration-color:color-mix(in srgb,var(--crit) 50%,transparent)}
.diff .del::before{content:"− ";color:var(--crit)}
.diff .ctx::before{content:"  "}

/* Rechtematrix */
.mx td,.mx th{text-align:center}
.mx td:first-child,.mx th:first-child,.mx td:nth-child(2),.mx th:nth-child(2){text-align:left}
.yes{color:var(--ok);font-weight:700}
.no{color:var(--muted)}
.part{color:var(--warn);font-weight:600;font-size:12px}

/* Dialog, Toast, Drawer */
dialog{border:1px solid var(--line);border-radius:18px;background:var(--surface);color:var(--fg);padding:0;width:min(480px,calc(100vw - 32px));box-shadow:0 30px 80px -20px rgba(0,0,0,.45)}
dialog::backdrop{background:rgba(5,7,12,.45);backdrop-filter:blur(2px)}
dialog .d-b{padding:22px;display:grid;gap:12px}
dialog h3{margin:0;font:700 18px var(--f-display)}
dialog .d-f{display:flex;justify-content:flex-end;gap:8px;padding:14px 22px;border-top:1px solid var(--line)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:11px 16px;border-radius:12px;font-weight:600;font-size:13px;display:flex;gap:8px;align-items:center;z-index:100;box-shadow:var(--shadow)}
.toast svg.i{color:var(--accent)}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(520px,100vw);background:var(--surface);border-left:1px solid var(--line);z-index:60;box-shadow:-20px 0 60px -20px rgba(0,0,0,.35);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-right:env(safe-area-inset-right,0px)}
.drawer .dh{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--line)}
.drawer .db{overflow:auto;padding:20px;display:grid;gap:18px;align-content:start}
.scrim{position:fixed;inset:0;background:rgba(5,7,12,.4);z-index:50}
.role-note{display:flex;gap:10px;align-items:center;padding:10px 14px;border-radius:12px;background:var(--info-soft);color:var(--info);font-size:13px;margin-bottom:16px}

.nur-sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

function area(M){

 const last=pts[pts.length-1];
 return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Erfasste Dokumente pro Monat ${S.year}, höchster Wert ${Math.max(...M)} im ${mon[M.indexOf(Math.max(...M))]}">

  ${mon.map((m,i)=>`<text class="ax" x="${x(i)}" y="${H-6}" text-anchor="middle">${m}</text>`).join('')}
  <path d="${line} L${last[0]} ${y(0)} L${L} ${y(0)} Z" fill="url(#ag)"/>

 c.m.push({me:q});const t={tool:a.tool,busy:true};c.m.push(t);render();

function renderNav(){
 const korb=korbSichtbar().length;let html='',skipGroup=false;
 for(const n of NAV){
  if(n.g){skipGroup=n.need&&!n.need();if(!skipGroup)html+=`<div class="nav-group">${n.g}</div>`;continue}
  if(skipGroup||(n.need&&!n.need()))continue;
  const cur=S.view===n.h||(S.view==='dokument'&&n.h==='suche');
  html+=`<a href="#${n.h}" ${cur?'aria-current="page"':''}>${ic(n.i)}<span>${n.t}</span>${n.cnt&&korb?`<span class="cnt" aria-label="${korb} Dokumente">${korb}</span>`:''}</a>`;
 }
 $('#nav').innerHTML=html;
 const r=ROLLEN[S.rolle];$('#av').textContent=r.kurz;$('#who').innerHTML=`${r.name}<small>${r.label} · urinet</small>`;
}
function allowed(v){const n=NAV.find(x=>x.h===v);return v==='dokument'||v==='hilfe'||(n&&(!n.need||n.need()))}
function render(){
 if(!V[S.view]||!allowed(S.view))S.view='uebersicht';
 renderNav();$('#view').innerHTML=V[S.view]();
 if(S.view==='uebersicht')bindArea();
 if(S.view==='chat'){const b=$('#msgs');if(b)b.scrollTop=b.scrollHeight}
}
function route(){S.view=(location.hash||'#uebersicht').slice(1);$('#side').classList.remove('open');$('#layer').innerHTML='';render();window.scrollTo(0,0)}
addEventListener('hashchange',route);

/* ---------- Ereignisse ---------- */
document.addEventListener('click',e=>{
 const sp=e.target.closest('[data-sprung]');if(sp){e.preventDefault();const z=document.getElementById('h-'+sp.dataset.sprung);z?.scrollIntoView({block:'start'});z?.focus({preventScroll:true});return}
 const t=e.target.closest('[data-doc],[data-act],[data-year],[data-modus],[data-tab],[data-chat],[data-ask],[data-kf],[data-kontakt]');
 if(!t)return;
 if(t.dataset.doc){S.docId=+t.dataset.doc;S.tab='meta';if(location.hash!=='#dokument'){location.hash='dokument'}else route();if(t.tagName!=='A')e.preventDefault();return}
 if(t.dataset.year){S.year=+t.dataset.year;render();return}
 if(t.dataset.modus){S.modus=t.dataset.modus;render();return}
 if(t.dataset.tab){S.tab=t.dataset.tab;render();return}
 if(t.dataset.chat){S.chatId=+t.dataset.chat;render();return}
 if(t.dataset.ask){ask(t.dataset.ask);return}
 if(t.dataset.kf){S.kf=t.dataset.kf;render();return}
 if(t.dataset.kontakt){kontaktDetail(+t.dataset.kontakt);return}
 const a=t.dataset.act,id=+t.dataset.id;
 if(a==='bestaetigen'){$('#layer').innerHTML='';const k=KORB.find(x=>x.id===id);KORB=KORB.filter(x=>x.id!==id);render();toast(`Bestätigt · D-${id} wird archiviert`);DOCS.unshift({id,titel:k.titel,art:k.f[0][1],partner:k.f[1][1],datum:k.f[2][1],betrag:parseFloat(k.f[3][1].replace(/[^\d.]/g,'')),ri:'Eingang',nr:'',st:'ARCHIVIERT',vt:'NORMAL',gj:2026,tags:[],dn:k.dn,bis:'31.12.2036',text:'',erf:k.erf.split(' ·')[0]})}
 if(a==='verwerfen')dialog(`<form><div class="d-b"><h3>Dokument D-${id} verwerfen?</h3><p class="muted" style="margin:0">Das Dokument verschwindet aus Eingangskorb und Suche. Die Originaldatei bleibt im Archivspeicher, der Vorgang wird protokolliert.</p><div class="field"><label for="grund">Grund</label><textarea class="inp" id="grund" name="grund" rows="3" required placeholder="z. B. Doppelt erfasst, privater Beleg"></textarea></div></div><div class="d-f"><button type="button" class="btn ghost" data-cancel>Abbrechen</button><button class="btn pri" style="background:var(--crit);border-color:var(--crit);color:#fff">Verwerfen</button></div></form>`,()=>{KORB=KORB.filter(x=>x.id!==id);render();toast(`D-${id} verworfen`)});
 if(a==='wiederholen'){const k=KORB.find(x=>x.id===id);k.st='EINGANGSKORB';k.titel='Beleg Bürobedarf';k.f=[['Art','Quittung / Spesen',.86],['Partner','Papeterie Gisler Altdorf',.74],['Belegdatum','17.11.2026',.9],['Betrag','CHF 18.50',.93],['Geschäftsjahr','2026',.97]];render();toast('Erneut verarbeitet · Vorschlag bereit')}
 if(a==='archwdh'){KORB=KORB.filter(x=>x.id!==id);render();toast('Archivierung wiederholt · Kopie gesperrt')}
 if(a==='pruefen'){const k=KORB.find(x=>x.id===id);drawer('Prüfen und ändern',`<div class="thumb" style="max-width:180px;justify-self:center" aria-hidden="true"><i class="h"></i><i class="s"></i><i></i><i class="m"></i><i></i><i class="y"></i></div><form id="pf" style="display:grid;gap:12px">${k.f.map(([l,v,c],i)=>`<div class="field"><label for="pf${i}">${l}${c<.8?' · <span style="color:var(--warn)">unsicher ('+Math.round(c*100)+' %)</span>':''}</label>${l==='Art'?`<select class="inp" id="pf${i}">${ARTEN.map(a=>`<option ${a.name===v?'selected':''}>${a.name}</option>`).join('')}</select>`:`<input class="inp${c<.8?' unsicher':''}" id="pf${i}" value="${esc(v)}">`}</div>`).join('')}<div class="field"><label for="pfv">Vertraulichkeit</label><select class="inp" id="pfv"><option>Normal</option><option>Intern</option><option>Personal</option></select></div><div class="field"><label for="pft">Titel</label><input class="inp" id="pft" value="${esc(k.titel)}"></div><div class="actions"><button class="btn pri" type="button" data-act="bestaetigen" data-id="${k.id}">${ic('check')}Speichern und bestätigen</button></div></form>`)}
 if(a==='kinaktiv'||a==='kmerge'){const k=KONTAKTE.find(x=>x.id===id);
  if(a==='kmerge')dialog(`<form><div class="d-b"><h3>${esc(k.name)} zusammenführen</h3><div class="field"><label for="ziel">In diesen Kontakt (Ziel)</label><select class="inp" id="ziel" name="ziel">${KONTAKTE.filter(x=>x.aktiv&&x.id!==id).map(x=>`<option>${esc(x.name)}</option>`).join('')}</select></div><div class="hint warn">${ic('alert')}<span class="tx">${k.docs} Dokumente und 2 Verkaufschancen werden auf das Ziel umgehängt. Das lässt sich nicht rückgängig machen.</span></div><div class="field"><label for="mg">Grund</label><input class="inp" id="mg" name="g" required placeholder="z. B. Doppelt importiert"></div></div><div class="d-f"><button type="button" class="btn ghost" data-cancel>Abbrechen</button><button class="btn pri">Zusammenführen</button></div></form>`,fd=>{k.aktiv=false;k.merged=fd.get('ziel');$('#layer').innerHTML='';render();toast('Zusammengeführt')});
  else dialog(`<form><div class="d-b"><h3>${esc(k.name)} als inaktiv markieren?</h3><p class="muted" style="margin:0">Stammdaten und bestehende Zuordnungen bleiben. Der Kontakt erscheint nicht mehr in der Partnerauswahl.</p></div><div class="d-f"><button type="button" class="btn ghost" data-cancel>Abbrechen</button><button class="btn pri">Als inaktiv markieren</button></div></form>`,()=>{k.aktiv=false;$('#layer').innerHTML='';render();toast('Als inaktiv markiert')});}
 const msgs={wannehmen:'Änderung angenommen · neue Seitenversion',wverwerfen:'Änderung verworfen',lint:'Lint gestartet · Befunde erscheinen als Entwurf',importok:'362 Zeilen übernommen',speichern:'Einstellungen gespeichert · Version 7',widerrufen:'Token widerrufen',analyse:'Als Analyse vorgeschlagen · wartet auf Freigabe',kamera:'In der installierten Web-App öffnet sich hier die Kamera'};
 if(msgs[a])toast(msgs[a]);
 if(a==='einladen')dialog(`<form><div class="d-b"><h3>Benutzer einladen</h3><div class="field"><label for="im">E-Mail</label><input class="inp" id="im" type="email" required placeholder="name@firma.ch"></div><div class="field"><label for="ir">Rolle</label><select class="inp" id="ir"><option>Mitarbeiter</option><option>Treuhänder</option><option>Inhaber</option></select></div><p class="muted" style="margin:0;font-size:12.5px">Die Einladung kommt von Keycloak. Zwei-Faktor wird bei der ersten Anmeldung eingerichtet.</p></div><div class="d-f"><button type="button" class="btn ghost" data-cancel>Abbrechen</button><button class="btn pri">Einladung senden</button></div></form>`,()=>toast('Einladung vorbereitet'));
 if(a==='token')dialog(`<form><div class="d-b"><h3>API-Token anlegen</h3><div class="field"><label for="tn">Name</label><input class="inp" id="tn" required placeholder="z. B. Lohn-Generator"></div><div class="field"><label for="ts">Scope</label><select class="inp" id="ts"><option>generator</option><option>import</option></select></div><div class="field"><label for="tg">Gültig bis</label><input class="inp" id="tg" type="date"></div></div><div class="d-f"><button type="button" class="btn ghost" data-cancel>Abbrechen</button><button class="btn pri">Anlegen</button></div></form>`,()=>toast('Token angelegt · Klartext einmal angezeigt'));
});
document.addEventListener('keydown',e=>{
 if(e.key==='Enter'&&e.target.matches('[data-doc],[data-kontakt]'))e.target.click();
 if(e.key==='/'&&!e.target.matches('input,textarea,select')){e.preventDefault();$('#topq').focus()}
 if(e.key==='Escape'){$('#layer').innerHTML='';closeMenu()}
});
document.addEventListener('change',e=>{
 const t=e.target;
 if(t.dataset.f){const s=S.f[t.dataset.f];t.checked?s.add(t.value):s.delete(t.value);render()}
 if(t.id==='wtyp'){S.wTyp=t.value;render()}
 if(t.id==='file'&&t.files.length)addFiles(t.files);
 if(t.id==='csv'&&t.files.length)toast(`«${t.files[0].name}» gelesen · Vorschau wird erstellt`);
});
document.addEventListener('submit',e=>{
 if(e.target.closest('dialog'))return;e.preventDefault();
 if(e.target.id==='topsearch'){S.q=$('#topq').value;location.hash==='#suche'?render():location.hash='suche'}
 if(e.target.id==='bigsearch'){S.q=$('#q').value;$('#topq').value=S.q;render()}
 if(e.target.id==='kform'){S.kq=$('#kq').value;render()}
 if(e.target.id==='chatform'){const q=$('#chatq').value;ask(q)}
});
document.addEventListener('dragover',e=>{const d=e.target.closest?.('#drop');if(d){e.preventDefault();d.classList.add('over')}});
document.addEventListener('dragleave',e=>{const d=e.target.closest?.('#drop');d&&d.classList.remove('over')});
document.addEventListener('drop',e=>{const d=e.target.closest?.('#drop');if(d){e.preventDefault();d.classList.remove('over');addFiles(e.dataTransfer.files)}});
function addFiles(files){
 const q=$('#queue');[...files].forEach((f,n)=>{const row=document.createElement('div');row.innerHTML=queueRow(f.name,'Upload · gerade eben',10,'wird hochgeladen');const el=row.firstElementChild;q.prepend(el);
  const steps=[[35,'PDF/A wird erstellt'],[65,'Texterkennung läuft'],[90,'KI-Vorschlag'],[100,'Im Eingangskorb']];
  steps.forEach(([p,s],i)=>setTimeout(()=>{el.querySelector('i').style.width=p+'%';el.querySelector('small').textContent='Upload · gerade eben · '+s;if(p===100){el.lastElementChild.outerHTML=`<span class="pill ok">${ic('check')}Fertig</span>`;
   KORB.unshift({id:2630+n+Math.floor(Math.random()*50),dn:f.name,titel:'',erf:'Upload · gerade eben',st:'EINGANGSKORB',f:[['Art','Lieferantenbeleg',.72],['Partner','—',.3],['Belegdatum','20.11.2026',.8],['Betrag','CHF 0.00',.2]]});renderNav()}},700*(i+1)+n*300));
 });
}
document.addEventListener('click',e=>{if(e.target.closest('#copymail')){navigator.clipboard?.writeText('archiv@urinet.ch').then(()=>toast('Adresse kopiert'),()=>toast('Adresse markieren und kopieren'))}});
document.addEventListener('click',e=>{if(e.target.closest('#dlbtn'))toast('Download-Link erstellt · 5 Minuten gültig · protokolliert');if(e.target.closest('#editbtn'))toast('Änderungen erzeugen eine neue Version');
 if(e.target.closest('#expbtn')){const st=$('#expstate');st.innerHTML=`<div class="hint info">${ic('clock')}<span class="tx">Export 2025 wird erstellt …<div class="prog" style="margin-top:8px"><i style="width:15%"></i></div></span></div>`;let p=15;const iv=setInterval(()=>{p+=17;const b=st.querySelector('.prog i');if(b)b.style.width=Math.min(p,100)+'%';if(p>=100){clearInterval(iv);st.innerHTML=`<div class="hint info" style="background:var(--ok-soft);color:var(--ok)">${ic('check')}<span class="tx"><b>Fertig.</b> Download-Link ist 24 Stunden gültig. Eine E-Mail mit Link und Export-ID ist unterwegs. <button class="btn sm" style="margin-left:6px">${ic('dl')}ZIP herunterladen</button></span></div>`}},450)}
 if(e.target.closest('#newchat')){CHATS.unshift({t:'Neues Gespräch',d:'jetzt',m:[]});S.chatId=0;render();$('#chatq')?.focus()}
});

/* Kopfzeile */
$('#burger').innerHTML=ic('menu');
$('#burger').onclick=()=>{const o=$('#side').classList.toggle('open');$('#burger').setAttribute('aria-expanded',o)};
document.querySelectorAll('[data-i]').forEach(s=>s.outerHTML=ic(s.dataset.i));
function themeIcon(){const dark=document.documentElement.dataset.theme?document.documentElement.dataset.theme==='dark':matchMedia('(prefers-color-scheme: dark)').matches;$('#theme').innerHTML=ic(dark?'sun':'moon')}
$('#theme').onclick=()=>{const dark=document.documentElement.dataset.theme?document.documentElement.dataset.theme==='dark':matchMedia('(prefers-color-scheme: dark)').matches;document.documentElement.dataset.theme=dark?'light':'dark';themeIcon()};
themeIcon();
$('#bell').onclick=()=>toast('2 Dokumente brauchen Aufmerksamkeit im Eingangskorb');
function closeMenu(){$('#user .menu')?.remove();$('#user').setAttribute('aria-expanded','false')}
$('#user').onclick=e=>{
 if(e.target.closest('.menu')){const r=e.target.closest('input[name=rolle]');if(r){S.rolle=r.value;closeMenu();route();toast('Angemeldet als '+ROLLEN[S.rolle].label)}return}
 if($('#user .menu')){closeMenu();return}
 const m=document.createElement('div');m.className='menu';m.innerHTML=`<h4>Rolle ansehen (Demo)</h4>${Object.entries(ROLLEN).map(([k,r])=>`<label><input type="radio" name="rolle" value="${k}" ${S.rolle===k?'checked':''}><span><b>${r.label}</b><small>${r.name}</small></span></label>`).join('')}<h4 style="margin-top:10px">Mandant</h4><div style="padding:0 8px 6px;font-size:13px">urinet · Urinet Aschwanden, Seedorf UR</div>`;
 $('#user').append(m);$('#user').setAttribute('aria-expanded','true');
};
$('#user').onkeydown=e=>{if(e.key==='Enter'&&!e.target.closest('.menu'))$('#user').click()};
document.addEventListener('click',e=>{if(!e.target.closest('#user'))closeMenu()});
route();
</script>
